<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sebiston — отдел продаж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F8F5; --card:#FFFFFF; --ink:#14281F; --ink-2:#4A5C51; --ink-3:#7B8A81;
  --line:#DCE3DC; --line-2:#EDF0EC;
  --green:#2F9E4F; --green-d:#1E5B3A; --green-soft:#E8F4EA;
  --amber:#B45309; --amber-soft:#FBF0E2;
  --red:#A32B2B; --red-soft:#F8EAEA;
  --focus:#2F9E4F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --paper:#0F1712; --card:#16211B; --ink:#E8EFE9; --ink-2:#A9B8AE; --ink-3:#7E8F84;
    --line:#2A3A31; --line-2:#1E2C24;
    --green:#4CBF6C; --green-d:#7FD69A; --green-soft:#1B3325;
    --amber:#E0A458; --amber-soft:#332613;
    --red:#E07A7A; --red-soft:#33201F;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1712;--card:#16211B;--ink:#E8EFE9;--ink-2:#A9B8AE;--ink-3:#7E8F84;
  --line:#2A3A31;--line-2:#1E2C24;--green:#4CBF6C;--green-d:#7FD69A;--green-soft:#1B3325;
  --amber:#E0A458;--amber-soft:#332613;--red:#E07A7A;--red-soft:#33201F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Golos Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* шапка */
.top{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 18px 0;display:flex;align-items:center;gap:12px}
.mark{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.02em;font-size:19px}
.who{margin-left:auto;font-size:13px;color:var(--ink-3);text-align:right;line-height:1.3}
.tabs{max-width:1080px;margin:0 auto;padding:10px 18px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:0}
.tab{
  appearance:none;border:0;background:none;padding:0 10px 10px;cursor:pointer;font:inherit;
  font-size:14.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.tabsep{flex:none;width:1px;background:var(--line);margin:0 8px 12px;align-self:stretch}

main{max-width:1080px;margin:0 auto;padding:22px 18px 40px}
.panel[hidden]{display:none}
.lede{font-size:14px;color:var(--ink-3);margin:0 0 20px;max-width:70ch;line-height:1.5}
.lede b{color:var(--ink-2);font-weight:600}

.cols{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}

.block{margin:0 0 24px}
.block-h{display:flex;align-items:baseline;gap:10px;margin:0 0 13px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.block-h h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.block-h .note{font-size:12.5px;color:var(--ink-3);margin-left:auto}

.field{margin:0 0 14px}
label.lbl{display:block;font-size:13.5px;font-weight:500;color:var(--ink-2);margin:0 0 6px}
.req{color:var(--green);font-weight:600}

input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=month],textarea,select{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;
}
textarea{resize:vertical;min-height:68px;line-height:1.4}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--green)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input[aria-invalid="true"]{border-color:var(--red);background:var(--red-soft)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  appearance:none;font:inherit;font-size:14px;font-weight:500;cursor:pointer;
  background:var(--card);color:var(--ink-2);border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;transition:background .12s,border-color .12s,color .12s;
}
.chip:hover{border-color:var(--ink-3)}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green);color:var(--green-d);font-weight:600}
.chip.hot[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.chip.no[aria-pressed="true"]{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.chips.invalid{outline:2px solid var(--red);outline-offset:4px;border-radius:12px}

.hint{font-size:12.5px;color:var(--ink-3);margin:6px 0 0}
.err{font-size:13px;color:var(--red);margin:6px 0 0;font-weight:500}
.err[hidden]{display:none}
.dup{display:flex;gap:10px;align-items:flex-start;margin:8px 0 0;padding:10px 12px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:10px;font-size:13.5px;line-height:1.4}
.dup[hidden]{display:none}
.dup b{color:var(--amber)}
.cond{margin:12px 0 0;padding:13px;border-radius:12px;background:var(--line-2);border:1px solid var(--line)}
.cond[hidden]{display:none}
.check{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14.5px;color:var(--ink-2);margin:8px 0 0}
.check input{width:19px;height:19px;accent-color:var(--green);margin:0;flex:none}

.btn{appearance:none;font:inherit;font-size:15px;font-weight:600;cursor:pointer;border-radius:10px;padding:11px 20px;border:1px solid transparent;white-space:nowrap}
.btn-main{background:var(--green);color:#fff}
.btn-main:hover{background:var(--green-d)}
.btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ink-3);color:var(--ink)}
.btn-sm{font-size:13.5px;padding:7px 13px;border-radius:9px}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.actions{display:flex;gap:10px;align-items:center;margin:4px 0 0}
.actions .sum{font-size:12.5px;color:var(--ink-3);flex:1;min-width:0;line-height:1.3}

/* вычисленное значение */
.calc{
  display:flex;align-items:baseline;gap:10px;padding:11px 13px;border-radius:10px;
  background:var(--green-soft);border:1px solid var(--green);margin:0 0 14px;flex-wrap:wrap;
}
.calc .k{font-size:13px;color:var(--green-d)}
.calc .v{font-size:19px;font-weight:700;letter-spacing:-.02em;color:var(--green-d);margin-left:auto}

/* таблицы */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top;white-space:nowrap}
thead th{background:var(--green-d);color:#fff;font-weight:600;font-size:12.5px;position:sticky;top:0}
:root[data-theme="dark"] thead th,
:root:not([data-theme="light"]) thead th{color:#0F1712}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) thead th{color:#fff}}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--line-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:180px}
tfoot td{font-weight:700;background:var(--line-2);border-top:2px solid var(--line)}
.flagged{background:var(--amber-soft)!important}
.flagged td:first-child::after{content:" ⚑";color:var(--amber)}

.badge{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--green-soft);color:var(--green-d);display:inline-block}
.badge.hot{background:var(--amber-soft);color:var(--amber)}
.badge.no{background:var(--red-soft);color:var(--red)}
.badge.bron{background:var(--amber-soft);color:var(--amber)}

.stats{display:flex;gap:20px;flex-wrap:wrap;padding:14px 15px;margin:0 0 16px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.stat .n{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat .t{font-size:12.5px;color:var(--ink-3)}
.stat.hot .n{color:var(--amber)}
.stat.money .n{color:var(--green-d)}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}
.tools input[type=text]{flex:1;min-width:160px}
.tools input[type=month],.tools select{width:auto;min-width:150px}

.empty{border:1px dashed var(--line);border-radius:12px;padding:32px 22px;text-align:center;color:var(--ink-3);font-size:14px;line-height:1.55}
.empty b{display:block;color:var(--ink);font-size:15.5px;font-weight:600;margin:0 0 6px}

.warn{
  display:flex;gap:10px;align-items:flex-start;margin:0 0 16px;padding:12px 14px;
  background:var(--amber-soft);border:1px solid var(--amber);border-radius:11px;font-size:13.5px;line-height:1.5;
}
.warn b{color:var(--amber)}
.warn[hidden]{display:none}

/* полоса доли времени */
.bar-track{height:7px;border-radius:999px;background:var(--line-2);overflow:hidden;min-width:90px;display:block}
.bar-fill{height:100%;background:var(--green);display:block;border-radius:999px}
.bar-fill.warnc{background:var(--amber)}

.sync{font-size:12.5px;color:var(--ink-3);margin:0 0 16px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);z-index:60;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--green-d);color:#fff;font-size:14.5px;font-weight:500;padding:11px 18px;border-radius:999px;
  box-shadow:0 6px 24px rgba(20,40,31,.25);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  max-width:calc(100% - 36px);text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.lnk{appearance:none;background:none;border:0;padding:0;font:inherit;font-size:12.5px;color:var(--red);cursor:pointer;text-decoration:underline}
.lnk:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lnk.ok{color:var(--green-d)}
input.cell{
  width:100%;min-width:62px;font:inherit;font-size:13.5px;color:var(--ink);
  background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 6px;
  font-variant-numeric:tabular-nums;
}
input.cell:hover{border-color:var(--line)}
input.cell:focus-visible{outline:2px solid var(--focus);outline-offset:0;border-color:var(--green);background:var(--card)}
input.cell.n{text-align:right}
input.cell.edited{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);font-weight:600}
td.has-auto{position:relative}
.auto{display:block;font-size:11px;color:var(--ink-3);text-align:right;margin-top:1px}
.legend{font-size:12.5px;color:var(--ink-3);margin:0 0 14px;line-height:1.5;max-width:80ch}
.legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--amber-soft);border:1px solid var(--amber);vertical-align:-1px;margin-right:4px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="mark" aria-label="Sebiston">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="6" fill="#2F9E4F"/>
        <path d="M16.2 8.1c-.9-.9-2.2-1.4-3.7-1.4-2.6 0-4.3 1.2-4.3 3 0 1.6 1.2 2.4 3.6 2.9l1.3.3c1.1.2 1.6.6 1.6 1.2 0 .8-.8 1.3-2.2 1.3-1.4 0-2.6-.5-3.5-1.4l-1.3 1.8c1.1 1.1 2.7 1.7 4.7 1.7 2.8 0 4.6-1.3 4.6-3.3 0-1.7-1.1-2.6-3.6-3.1l-1.3-.3c-1.1-.2-1.6-.5-1.6-1.1 0-.7.7-1.1 2-1.1 1.2 0 2.2.4 3 1.1l1.7-1.6z" fill="#fff"/>
      </svg>
      <span>Sebiston</span>
    </div>
    <div class="who" id="who">Отдел продаж</div>
  </div>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-p="call"   aria-selected="true">Звонки</button>
    <button class="tab" role="tab" data-p="office" aria-selected="false">Офис</button>
    <button class="tab" role="tab" data-p="sales"  aria-selected="false">Продажи</button>
    <button class="tab" role="tab" data-p="time"   aria-selected="false">Хронометраж</button>
    <span class="tabsep" aria-hidden="true"></span>
    <button class="tab" role="tab" data-p="rday"   aria-selected="false">Лиды по дням</button>
    <button class="tab" role="tab" data-p="rmgr"   aria-selected="false">Лиды: все менеджеры</button>
    <button class="tab" role="tab" data-p="rsale"  aria-selected="false">Итог по продажам</button>
  </nav>
</header>

<main>
  <p class="sync" id="sync"></p>

  <section class="panel" id="p-call"   role="tabpanel"></section>
  <section class="panel" id="p-office" role="tabpanel" hidden></section>
  <section class="panel" id="p-sales"  role="tabpanel" hidden></section>
  <section class="panel" id="p-time"   role="tabpanel" hidden></section>
  <section class="panel" id="p-rday"   role="tabpanel" hidden></section>
  <section class="panel" id="p-rmgr"   role="tabpanel" hidden></section>
  <section class="panel" id="p-rsale"  role="tabpanel" hidden></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";

/* ============ справочники ============ */
var MGRS = ["Азиз","Амира","Асламджон","Бахора","Гесу","Зарина","Заррина","Манижа","Нозия","Фарзона","Фарход","Адам"];
var OBJECTS = ["Скандинавия","Бульвар Скандинавия","Address Residence","Address ТЦ","Ахрори","Бофанда"];
var TOPICS = ["Квадратуры и цены","Рассрочка","Ипотека","Полная оплата","Коммерческое помещение","Другое"];
var FLOORS = ["Любой","Нижние (1–5)","Средние (6–15)","Верхние (16+)"];
var STAGES = ["Горячий","Потенциальный","Думает","Отказ"];
var REJECTS = ["Высокая цена","Нет нужной площади","Нет нижних этажей","Локация не подошла","Клиент не в Таджикистане","Другое"];
var METHODS = ["Ипотека","Рассрочка","Полная оплата","Наличные"];
var CATS = ["Работа с лидами","Звонки","Встречи / показы","Переговоры / работа с клиентом","CRM и отчётность","Совещания","Административная работа","Ожидание / простой","Перерывы","Прочее"];
var IDLE = ["Ожидание / простой","Перерывы"];
var CITIES = [
 ["Душанбе","Таджикистан"],["Худжанд","Таджикистан"],["Бохтар","Таджикистан"],["Куляб","Таджикистан"],
 ["Истаравшан","Таджикистан"],["Исфара","Таджикистан"],["Канибадам","Таджикистан"],["Пенджикент","Таджикистан"],
 ["Турсунзаде","Таджикистан"],["Вахдат","Таджикистан"],["Гиссар","Таджикистан"],["Рудаки","Таджикистан"],
 ["Яван","Таджикистан"],["Нурек","Таджикистан"],["Дангара","Таджикистан"],["Шахринав","Таджикистан"],
 ["Файзабад","Таджикистан"],["Рогун","Таджикистан"],["Бустон","Таджикистан"],["Левакант","Таджикистан"],
 ["Спитамен","Таджикистан"],["Зафарабад","Таджикистан"],["Ашт","Таджикистан"],["Восе","Таджикистан"],
 ["Фархор","Таджикистан"],["Хорог","Таджикистан"],["Рашт","Таджикистан"],
 ["Москва","Россия"],["Санкт-Петербург","Россия"],["Екатеринбург","Россия"],["Новосибирск","Россия"],
 ["Казань","Россия"],["Нижний Новгород","Россия"],["Самара","Россия"],["Красноярск","Россия"],
 ["Тюмень","Россия"],["Сургут","Россия"],["Краснодар","Россия"],["Ростов-на-Дону","Россия"],
 ["Уфа","Россия"],["Челябинск","Россия"],["Пермь","Россия"],["Воронеж","Россия"],["Волгоград","Россия"],
 ["Дубай","ОАЭ"],["Абу-Даби","ОАЭ"],["Стамбул","Турция"],["Алматы","Казахстан"],["Астана","Казахстан"],
 ["Ташкент","Узбекистан"],["Бишкек","Кыргызстан"],["Кабул","Афганистан"]
];
var RESULT_FIELDS = [
 ["newLeads","Новых лидов получено"],["worked","Лидов обработано"],["outCalls","Исходящих звонков"],
 ["contacts","Состоявшихся контактов"],["meetSet","Назначено встреч"],["meetHeld","Проведено встреч"],
 ["shows","Проведено показов"],["repeat","Повторных контактов"],["bron","Брони"],["deals","Договоров"]
];

/* ============ состояние ============ */
var S = { leads:[], deals:[], tlog:[], results:{}, ovr:{} };
var LS = "sebiston.sales.v2";
var LS_MGR = "sebiston.mgr";
var db=null, userCap=null, dlCap=null;

function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function persist(){ lsSet(LS, JSON.stringify(S)); }
function restore(){
  var raw = lsGet(LS); if(!raw) return;
  try{
    var o = JSON.parse(raw);
    if(o && typeof o==="object"){
      S.leads = Array.isArray(o.leads)?o.leads:[];
      S.deals = Array.isArray(o.deals)?o.deals:[];
      S.tlog  = Array.isArray(o.tlog)?o.tlog:[];
      S.results = o.results && typeof o.results==="object" ? o.results : {};
      S.ovr = o.ovr && typeof o.ovr==="object" ? o.ovr : {};
    }
  }catch(e){}
}

/* ============ утилиты ============ */
function $(id){ return document.getElementById(id); }
function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
function digits(s){ return (s||"").replace(/\D+/g,""); }
function pad(n){ return n<10?"0"+n:""+n; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function uid(){ return String(Date.now())+"-"+Math.random().toString(36).slice(2,8); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function nowHM(){ var d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function thisMonth(){ return todayISO().slice(0,7); }
var MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
function fmtDate(iso){ if(!iso) return ""; var p=iso.split("-"); if(p.length!==3) return iso; return parseInt(p[2],10)+" "+MON[parseInt(p[1],10)-1]; }
function num(v){ var n=parseFloat(String(v).replace(",",".")); return isFinite(n)?n:0; }
function money(n){ return Math.round(n).toLocaleString("ru-RU")+" $"; }
function area(n){ return (Math.round(n*100)/100).toLocaleString("ru-RU")+" м²"; }
function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("on");},2600); }
function mins(hm){ if(!hm) return null; var p=hm.split(":"); if(p.length<2) return null; return parseInt(p[0],10)*60+parseInt(p[1],10); }
function hhmm(m){ if(m==null) return "—"; var s=m<0?"-":""; m=Math.abs(m); return s+Math.floor(m/60)+" ч "+pad(m%60)+" мин"; }

function chipsHTML(name, list, sel, cls){
  return '<div class="chips" data-g="'+name+'" role="group">'+list.map(function(v){
    var extra = cls && cls[v] ? " "+cls[v] : "";
    return '<button type="button" class="chip'+extra+'" data-v="'+esc(v)+'" aria-pressed="'+(v===sel?"true":"false")+'">'+esc(v)+'</button>';
  }).join("")+'</div>';
}
function bindChips(root){
  root.addEventListener("click", function(ev){
    var b = ev.target.closest(".chip"); if(!b) return;
    var g = b.closest(".chips"); if(!g || !root.contains(g)) return;
    var on = b.getAttribute("aria-pressed")==="true";
    if(g.dataset.multi==="1"){ b.setAttribute("aria-pressed", on?"false":"true"); }
    else{
      Array.prototype.forEach.call(g.querySelectorAll(".chip"),function(c){c.setAttribute("aria-pressed","false");});
      b.setAttribute("aria-pressed", on?"false":"true");
    }
    g.classList.remove("invalid");
    root.dispatchEvent(new CustomEvent("chipchange",{detail:{group:g.dataset.g},bubbles:false}));
  });
}
function gv(root,name){ var b=root.querySelector('[data-g="'+name+'"] .chip[aria-pressed="true"]'); return b?b.dataset.v:""; }
function gvs(root,name){ return Array.prototype.map.call(root.querySelectorAll('[data-g="'+name+'"] .chip[aria-pressed="true"]'),function(b){return b.dataset.v;}); }
function gset(root,name,v){
  Array.prototype.forEach.call(root.querySelectorAll('[data-g="'+name+'"] .chip'),function(c){
    c.setAttribute("aria-pressed", c.dataset.v===v?"true":"false");
  });
}
function f(root,name){ return root.querySelector('[data-f="'+name+'"]'); }
function fv(root,name){ var e=f(root,name); return e?e.value.trim():""; }

function citiesDatalist(){

/* ============ ручной ввод поверх расчёта ============ */
var ovrTimer=null;
function ovrKey(scope,mgr,period,field){ return [scope,mgr,period,field].join("~"); }
function ovrHas(k){ return Object.prototype.hasOwnProperty.call(S.ovr,k); }
function eff(k, auto){ return ovrHas(k) ? S.ovr[k] : auto; }
function effN(k, auto){ var v=eff(k,auto); return typeof v==="number"?v:num(v); }
function ovrFlush(){
  clearTimeout(ovrTimer);
  ovrTimer=setTimeout(function(){ push("ovr","all",{id:"all",map:S.ovr}); },600);
}
function ovrSet(k,v){
  if(v===""||v==null) delete S.ovr[k]; else S.ovr[k]=v;
  persist(); ovrFlush();
}
function ovrClearPrefix(pref){
  var hit=false;
  Object.keys(S.ovr).forEach(function(k){ if(k.indexOf(pref)===0){ delete S.ovr[k]; hit=true; } });
  if(hit){ persist(); ovrFlush(); }
  return hit;
}
function cellN(k, auto){
  var a = (auto||auto===0) ? auto : "";
  var edited = ovrHas(k) && num(S.ovr[k])!==num(a);
  var val = ovrHas(k) ? S.ovr[k] : a;
  return '<td class="num has-auto"><input class="cell n'+(edited?" edited":"")+'" data-k="'+esc(k)+'" data-auto="'+esc(a)+'" inputmode="decimal" value="'+esc(val)+'">'+
         (edited?'<span class="auto">расчёт: '+esc(a)+'</span>':'')+'</td>';
}
function cellT(k, auto, ph){
  var a = auto||"";
  var edited = ovrHas(k) && String(S.ovr[k])!==String(a);
  var val = ovrHas(k) ? S.ovr[k] : a;
  return '<td class="wrap"><input class="cell'+(edited?" edited":"")+'" data-k="'+esc(k)+'" data-auto="'+esc(a)+'" value="'+esc(val)+'" placeholder="'+esc(ph||"")+'"></td>';
}
function bindCells(wrap, rerender){
  wrap.addEventListener("change", function(ev){
    var i=ev.target;
    if(!i.classList || !i.classList.contains("cell")) return;
    var v=i.value.trim();
    if(v==="" || v===String(i.dataset.auto)) ovrSet(i.dataset.k,"");
    else ovrSet(i.dataset.k, v);
    rerender();
  });
  wrap.addEventListener("click", function(ev){
    var b=ev.target.closest("[data-reset]"); if(!b) return;
    if(ovrClearPrefix(b.dataset.reset)){ rerender(); toast("Строка вернулась к расчёту"); }
    else toast("В этой строке нет ручных правок");
  });
}
var LEGEND='<p class="legend"><span class="sw"></span> Янтарным подсвечено вписанное руками — под значением видно, что насчитала система. Строка ИТОГО и «Остаток» всегда складываются из ячеек.</p>';

/* ============ выгрузка ============ */
function csvText(head, rows){
  return "\uFEFF"+[head].concat(rows).map(function(r){
    return r.map(function(c){ c=(c==null?"":String(c)).replace(/"/g,'""'); return '"'+c+'"'; }).join(";");
  }).join("\r\n");
}
async function download(name, text){
  if(dlCap){ try{ await dlCap.save({filename:name, data:text}); toast("Файл сохранён"); return; }catch(e){} }
  try{
    var b=new Blob([text],{type:"text/csv;charset=utf-8"}), u=URL.createObjectURL(b);
    var a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1000);
    toast("Файл сохранён");
  }catch(e){ toast("Выгрузка недоступна в этом окне"); }
}

/* ============ синхронизация ============ */
async function push(coll, id, doc){
  if(!db) return;
  try{ await db.doc(coll+"/"+id).set(doc); }
  catch(e){ toast("Сохранено на устройстве, общая база недоступна"); }
}
async function drop(coll, id){
  if(!db) return;
  try{ await db.doc(coll+"/"+id).delete(); }catch(e){}
}

function initLeadPanel(root, mode){
  var isOffice = mode==="office";
  root.innerHTML = leadPanel(mode);
  bindChips(root);

  var elTel=f(root,"tel"), elFio=f(root,"fio");

  root.addEventListener("chipchange", function(ev){
    if(ev.detail.group==="stage") f(root,"rejWrap").hidden = gv(root,"stage")!=="Отказ";
    summary();
  });
  f(root,"meet").addEventListener("change", function(){
    f(root,"meetWrap").hidden = !this.checked;
    if(this.checked && !f(root,"meetDate").value){
      var d=new Date(); d.setDate(d.getDate()+1);
      f(root,"meetDate").value = d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
      f(root,"meetTime").value = "11:00";
    }
    summary();
  });
  f(root,"waSame").addEventListener("change", function(){ f(root,"waWrap").hidden = this.checked; });

  function dup(){
    var d=digits(elTel.value), box=f(root,"dup");
    if(d.length<6){ box.hidden=true; return; }
    var tail=d.slice(-9), hit=null;
    for(var i=0;i<S.leads.length;i++){ var t=digits(S.leads[i].tel).slice(-9); if(t&&t===tail){hit=S.leads[i];break;} }
    if(!hit){ box.hidden=true; return; }
    f(root,"dupText").innerHTML = "Этот номер уже в базе: <b>"+esc(hit.fio)+"</b>, записал "+esc(hit.mgr)+" "+esc(fmtDate(hit.date))+". Сохраните как повторный контакт, а не как нового клиента.";
    box.hidden=false;
  }
  elTel.addEventListener("input", function(){ elTel.setAttribute("aria-invalid","false"); f(root,"e-tel").hidden=true; dup(); summary(); });
  elFio.addEventListener("input", function(){ elFio.setAttribute("aria-invalid","false"); f(root,"e-fio").hidden=true; summary(); });

  function summary(){
    var miss=[];
    if(!elFio.value.trim()) miss.push("имя");
    if(digits(elTel.value).length<9) miss.push("телефон");
    if(!gv(root,"mgr")) miss.push("менеджера");
    if(miss.length){ f(root,"sum").textContent="Заполните "+miss.join(", "); return; }
    var o=gvs(root,"obj");
    f(root,"sum").textContent = (gv(root,"stage")||"Потенциальный")+(o.length?" · "+o.join(", "):"")+(f(root,"meet").checked?" · встреча назначена":"");
  }

  function reset(keepMgr){
    ["fio","tel","wa","sqFrom","sqTo","budget","note","decision","feedback"].forEach(function(n){ var e=f(root,n); if(e) e.value=""; });
    f(root,"waSame").checked=true; f(root,"waWrap").hidden=true;
    f(root,"meet").checked=false; f(root,"meetWrap").hidden=true;
    f(root,"meetDate").value=""; f(root,"meetTime").value="";
    f(root,"dup").hidden=true;
    gset(root,"topic",""); gset(root,"floor","");
    Array.prototype.forEach.call(root.querySelectorAll('[data-g="obj"] .chip'),function(c){c.setAttribute("aria-pressed","false");});
    gset(root,"stage","Потенциальный"); gset(root,"rej",""); f(root,"rejWrap").hidden=true;
    if(keepMgr) gset(root,"mgr",keepMgr);
    f(root,"dt").value=todayISO(); f(root,"tm").value=nowHM();
    summary();
  }

  f(root,"save").addEventListener("click", async function(){
    var ok=true, first=null;
    if(!elFio.value.trim()){ elFio.setAttribute("aria-invalid","true"); f(root,"e-fio").hidden=false; ok=false; first=elFio; }
    if(digits(elTel.value).length<9){ elTel.setAttribute("aria-invalid","true"); f(root,"e-tel").hidden=false; ok=false; first=first||elTel; }
    var g=root.querySelector('[data-g="mgr"]');
    if(!gv(root,"mgr")){ g.classList.add("invalid"); f(root,"e-mgr").hidden=false; ok=false; first=first||g; }
    else { g.classList.remove("invalid"); f(root,"e-mgr").hidden=true; }
    if(!ok){ if(first){ first.scrollIntoView({block:"center",behavior:"smooth"}); try{first.focus({preventScroll:true});}catch(e){} } toast("Не хватает данных"); return; }

    var waSame=f(root,"waSame").checked;
    var rec = {
      id: uid(), kind: isOffice?"office":"call",
      date: f(root,"dt").value, time: f(root,"tm").value,
      src: gv(root,"src"), fio: elFio.value.trim(), tel: elTel.value.trim(),
      wa: waSame ? elTel.value.trim() : fv(root,"wa"),
      city: fv(root,"city"), topic: gv(root,"topic"), objects: gvs(root,"obj"),
      sqFrom: fv(root,"sqFrom"), sqTo: fv(root,"sqTo"), floor: gv(root,"floor"), budget: fv(root,"budget"),
      stage: gv(root,"stage")||"Потенциальный",
      reject: gv(root,"stage")==="Отказ" ? gv(root,"rej") : "",
      meetDate: f(root,"meet").checked ? f(root,"meetDate").value : "",
      meetTime: f(root,"meet").checked ? f(root,"meetTime").value : "",
      meetHeld: false,
      decision: fv(root,"decision"), feedback: fv(root,"feedback"),
      note: fv(root,"note"), mgr: gv(root,"mgr"), createdAt: new Date().toISOString()
    };
    S.leads.unshift(rec); persist(); lsSet(LS_MGR, rec.mgr);
    renderList(); reset(rec.mgr);
    root.querySelector(".formside").scrollIntoView({block:"start",behavior:"smooth"});
    toast("Клиент записан: "+rec.fio);
    push("leads", rec.id, rec);
  });

  f(root,"clear").addEventListener("click", function(){ reset(lsGet(LS_MGR)||""); toast("Форма очищена"); });
  f(root,"q").addEventListener("input", renderList);
  f(root,"exp").addEventListener("click", function(){
    var rows = pick();
    if(!rows.length){ toast("Нечего выгружать"); return; }
    var head = ["№","Дата","Время","Источник","ФИО","Телефон","WhatsApp","Город","Тема вопроса","Объект",
                "Площадь от","Площадь до","Этаж","Бюджет $","Этап","Причина отказа","Встреча дата","Встреча время","Встреча проведена"]
                .concat(isOffice?["Последнее решение","Обратная связь"]:[]).concat(["Примечание","Менеджер"]);
    var body = rows.map(function(l,i){
      var base=[i+1,l.date,l.time,l.src,l.fio,l.tel,l.wa,l.city,l.topic,(l.objects||[]).join(" / "),
                l.sqFrom,l.sqTo,l.floor,l.budget,l.stage,l.reject,l.meetDate,l.meetTime,l.meetHeld?"да":""];
      if(isOffice) base=base.concat([l.decision||"",l.feedback||""]);
      return base.concat([l.note,l.mgr]);
    });
    download("sebiston-"+(isOffice?"ofis":"zvonki")+"-"+todayISO()+".csv", csvText(head, body));
  });

  function pick(){
    var q=f(root,"q").value.trim().toLowerCase();
    return S.leads.filter(function(l){
      if(l.kind!==(isOffice?"office":"call")) return false;
      if(!q) return true;
      return [l.fio,l.tel,l.note,l.topic,l.city,(l.objects||[]).join(" ")].join(" ").toLowerCase().indexOf(q)>=0;
    });
  }

  function renderList(){
    var rows=pick();
    var hot=rows.filter(function(l){return l.stage==="Горячий";}).length;
    var mset=rows.filter(function(l){return l.meetDate;}).length;
    var mheld=rows.filter(function(l){return l.meetHeld;}).length;
    var rej=rows.filter(function(l){return l.stage==="Отказ";}).length;
    f(root,"stats").innerHTML =
      '<div class="stat"><div class="n">'+rows.length+'</div><div class="t">контактов</div></div>'+
      '<div class="stat hot"><div class="n">'+hot+'</div><div class="t">горячих</div></div>'+
      '<div class="stat"><div class="n">'+mset+'</div><div class="t">встреч назначено</div></div>'+
      '<div class="stat"><div class="n">'+mheld+'</div><div class="t">проведено</div></div>'+
      '<div class="stat"><div class="n">'+rej+'</div><div class="t">отказов</div></div>';

    if(!rows.length){
      f(root,"tblw").outerHTML = '<div class="empty" data-f="tblw"><b>Пока пусто</b>Сохранённые контакты появятся здесь.</div>';
      return;
    }
    var html='<table><thead><tr><th>Дата</th><th>ФИО</th><th>Телефон</th><th>Тема</th><th>Объект</th><th>Этап</th><th>Встреча</th>'+
      (isOffice?'<th>Решение</th>':'')+'<th>Примечание</th><th>Менеджер</th><th></th></tr></thead><tbody>'+
      rows.map(function(l){
        var cls=l.stage==="Горячий"?"hot":(l.stage==="Отказ"?"no":"");
        var meet = l.meetDate
          ? fmtDate(l.meetDate)+(l.meetTime?" "+l.meetTime:"")+' <button class="lnk '+(l.meetHeld?"ok":"")+'" data-held="'+l.id+'">'+(l.meetHeld?"проведена":"отметить")+'</button>'
          : "—";
        return '<tr><td>'+esc(fmtDate(l.date))+(l.time?' '+esc(l.time):'')+'</td>'+
          '<td>'+esc(l.fio)+'</td>'+
          '<td><a href="tel:'+esc(digits(l.tel))+'">'+esc(l.tel)+'</a></td>'+
          '<td class="wrap">'+esc(l.topic||"—")+'</td>'+
          '<td class="wrap">'+esc((l.objects||[]).join(", ")||"—")+'</td>'+
          '<td><span class="badge '+cls+'">'+esc(l.stage)+'</span>'+(l.reject?'<br><span class="hint">'+esc(l.reject)+'</span>':'')+'</td>'+
          '<td>'+meet+'</td>'+
          (isOffice?'<td class="wrap">'+esc(l.decision||"—")+'</td>':'')+
          '<td class="wrap">'+esc(l.note||"—")+'</td>'+
          '<td>'+esc(l.mgr)+'</td>'+
          '<td><button class="lnk" data-del="'+l.id+'">удалить</button></td></tr>';
      }).join("")+'</tbody></table>';
    var w=f(root,"tblw");
    if(!w.classList.contains("tbl-wrap")){ var nw=el('<div class="tbl-wrap" data-f="tblw"></div>'); w.parentNode.replaceChild(nw,w); w=nw; }
    w.innerHTML=html;
    w.onclick=function(ev){
      var h=ev.target.closest("[data-held]"), d=ev.target.closest("[data-del]");
      if(h){
        var L=S.leads.find(function(x){return x.id===h.dataset.held;});
        if(L){ L.meetHeld=!L.meetHeld; persist(); push("leads",L.id,L); renderList(); }

    }).join("")+'</tbody></table>';
    f(root,"sum").textContent = total ? "За день записано "+hhmm(total) : "Ни одного действия";
  }
  root._render=render;
  render();

  var rej = list.filter(function(l){return l.stage==="Отказ";});
  var causes={};
  rej.forEach(function(l){ var k=l.reject||"без причины"; causes[k]=(causes[k]||0)+1; });
  var causeText = Object.keys(causes).sort(function(a,b){return causes[b]-causes[a];})
    .map(function(k){return k+" — "+causes[k];}).join("; ");
  return {
    worked: list.length,
    set: list.filter(function(l){return l.meetDate;}).length,
    held: list.filter(function(l){return l.meetHeld;}).length,
    rej: rej.length,
    causes: causeText,
    bron: deals.filter(function(d){return d.status==="Бронь";}).length,
    sold: deals.filter(function(d){return d.status==="Продажа";}).length,
    money: deals.filter(function(d){return d.status==="Продажа";}).reduce(function(s,d){return s+d.total;},0)
  };
}

function daysOfMonth(mon){
  if(!mon) return [];
  var y=parseInt(mon.slice(0,4),10), m=parseInt(mon.slice(5,7),10);
  var last=new Date(y,m,0).getDate(), out=[];
  for(var d=1;d<=last;d++) out.push(mon+"-"+pad(d));
  return out;
}

function merge(arrName, docs){
  var seen={}; S[arrName].forEach(function(x){seen[x.id]=1;});
  var added=0;
  docs.forEach(function(d){ if(d&&d.id&&!seen[d.id]){ S[arrName].push(d); seen[d.id]=1; added++; } });
  S[arrName].sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
  if(added) persist();
  return added;
}
async function connect(){
  if(!window.claude || typeof window.claude.use!=="function"){
    $("sync").textContent="Записи хранятся только в этом браузере."; return;
  }
  try{ userCap=await window.claude.use("user"); }catch(e){}
  try{ dlCap=await window.claude.use("downloads"); }catch(e){}
  try{ db=await window.claude.use("db"); }catch(e){ db=null; }
  if(userCap){ try{ var me=await userCap.me(); if(me&&me.name) $("who").textContent=me.name; }catch(e){} }
  if(!db){ $("sync").textContent="Общая база недоступна — записи хранятся только в этом браузере."; return; }
  $("sync").textContent="Общая база подключена: записи видны всем менеджерам.";
  try{
    db.collection("ovr").onSnapshot(function(snap){
      var ch=false;
      (snap&&snap.docs?snap.docs:[]).forEach(function(d){
        var v=d.data?d.data():d;
        if(v&&v.id==="all"&&v.map&&typeof v.map==="object"){ Object.assign(S.ovr,v.map); ch=true; }
      });
      if(ch){ persist(); refreshAll(); }
    });
  }catch(e){}
  [["leads","leads"],["deals","deals"],["tlog","tlog"]].forEach(function(p){
    try{
      db.collection(p[0]).onSnapshot(function(snap){
        var docs=[];
        (snap&&snap.docs?snap.docs:[]).forEach(function(d){ var v=d.data?d.data():d; if(v&&v.id) docs.push(v); });
        if(docs.length && merge(p[1],docs)) refreshAll();
      });
    }catch(e){}
  });
}

/* ==================================================================
   СТАРТ
   ================================================================== */
restore();
open("call");
connect();

})();
</script>
