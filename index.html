<style>
:root{
  --paper:#F7F8F5; --card:#FFFFFF; --ink:#14281F; --ink-2:#4A5C51; --ink-3:#7B8A81;
  --line:#DCE3DC; --line-2:#EDF0EC;
  --green:#0E6D23; --green-d:#0A5019; --green-soft:#E7F1E9; --brand:#0E6D23;
  --amber:#B45309; --amber-soft:#FBF0E2;
  --red:#A32B2B; --red-soft:#F8EAEA;
  --focus:#0E6D23;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1712; --card:#16211B; --ink:#E8EFE9; --ink-2:#A9B8AE; --ink-3:#7E8F84;
    --line:#2A3A31; --line-2:#1E2C24;
    --green:#4CBF6C; --green-d:#7FD69A; --green-soft:#1B3325; --brand:#6FCB84;
    --amber:#E0A458; --amber-soft:#332613;
    --red:#E07A7A; --red-soft:#33201F;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1712;--card:#16211B;--ink:#E8EFE9;--ink-2:#A9B8AE;--ink-3:#7E8F84;
  --line:#2A3A31;--line-2:#1E2C24;--green:#4CBF6C;--green-d:#7FD69A;--green-soft:#1B3325;--brand:#6FCB84;
  --amber:#E0A458;--amber-soft:#332613;--red:#E07A7A;--red-soft:#33201F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Golos Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* шапка */
.top{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 18px 0;display:flex;align-items:center;gap:12px}
.mark{display:flex;align-items:center}
.mark .logo{height:28px;width:auto;display:block}
.mark .logo path{fill:var(--brand)}
@media (max-width:480px){.mark .logo{height:22px}}
.who{margin-left:auto;font-size:13px;color:var(--ink-3);text-align:right;line-height:1.3}
.tabs{max-width:1080px;margin:0 auto;padding:10px 18px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:0}
.tab{
  appearance:none;border:0;background:none;padding:0 10px 10px;cursor:pointer;font:inherit;
  font-size:14.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.tabsep{flex:none;width:1px;background:var(--line);margin:0 8px 12px;align-self:stretch}

main{max-width:1080px;margin:0 auto;padding:22px 18px 40px}
.panel[hidden]{display:none}
.lede{font-size:14px;color:var(--ink-3);margin:0 0 20px;max-width:70ch;line-height:1.5}
.lede b{color:var(--ink-2);font-weight:600}

.cols{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:1fr}}

.block{margin:0 0 24px}
.block-h{display:flex;align-items:baseline;gap:10px;margin:0 0 13px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.block-h h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.block-h .note{font-size:12.5px;color:var(--ink-3);margin-left:auto}

.field{margin:0 0 14px}
label.lbl{display:block;font-size:13.5px;font-weight:500;color:var(--ink-2);margin:0 0 6px}
.req{color:var(--green);font-weight:600}

input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=month],textarea,select{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;
}
textarea{resize:vertical;min-height:68px;line-height:1.4}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--green)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input[aria-invalid="true"]{border-color:var(--red);background:var(--red-soft)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  appearance:none;font:inherit;font-size:14px;font-weight:500;cursor:pointer;
  background:var(--card);color:var(--ink-2);border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;transition:background .12s,border-color .12s,color .12s;
}
.chip:hover{border-color:var(--ink-3)}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green);color:var(--green-d);font-weight:600}
.chip.hot[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.chip.no[aria-pressed="true"]{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.chips.invalid{outline:2px solid var(--red);outline-offset:4px;border-radius:12px}

.hint{font-size:12.5px;color:var(--ink-3);margin:6px 0 0}
.err{font-size:13px;color:var(--red);margin:6px 0 0;font-weight:500}
.err[hidden]{display:none}
.dup{display:flex;gap:10px;align-items:flex-start;margin:8px 0 0;padding:10px 12px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:10px;font-size:13.5px;line-height:1.4}
.dup[hidden]{display:none}
.dup b{color:var(--amber)}
.cond{margin:12px 0 0;padding:13px;border-radius:12px;background:var(--line-2);border:1px solid var(--line)}
.cond[hidden]{display:none}
.check{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14.5px;color:var(--ink-2);margin:8px 0 0}
.check input{width:19px;height:19px;accent-color:var(--green);margin:0;flex:none}

.btn{appearance:none;font:inherit;font-size:15px;font-weight:600;cursor:pointer;border-radius:10px;padding:11px 20px;border:1px solid transparent;white-space:nowrap}
.btn-main{background:var(--green);color:#fff}
.btn-main:hover{background:var(--green-d)}
.btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ink-3);color:var(--ink)}
.btn-sm{font-size:13.5px;padding:7px 13px;border-radius:9px}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.actions{display:flex;gap:10px;align-items:center;margin:4px 0 0}
.actions .sum{font-size:12.5px;color:var(--ink-3);flex:1;min-width:0;line-height:1.3}

/* вычисленное значение */
.calc{
  display:flex;align-items:baseline;gap:10px;padding:11px 13px;border-radius:10px;
  background:var(--green-soft);border:1px solid var(--green);margin:0 0 14px;flex-wrap:wrap;
}
.calc .k{font-size:13px;color:var(--green-d)}
.calc .v{font-size:19px;font-weight:700;letter-spacing:-.02em;color:var(--green-d);margin-left:auto}

/* таблицы */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top;white-space:nowrap}
thead th{background:var(--green-d);color:#fff;font-weight:600;font-size:12.5px;position:sticky;top:0}
:root[data-theme="dark"] thead th{color:#0F1712}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) thead th{color:#0F1712}}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--line-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:180px}
tfoot td{font-weight:700;background:var(--line-2);border-top:2px solid var(--line)}
.flagged{background:var(--amber-soft)!important}
.flagged td:first-child::after{content:" ⚑";color:var(--amber)}

.badge{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--green-soft);color:var(--green-d);display:inline-block}
.badge.hot{background:var(--amber-soft);color:var(--amber)}
.badge.no{background:var(--red-soft);color:var(--red)}
.badge.bron{background:var(--amber-soft);color:var(--amber)}

.stats{display:flex;gap:20px;flex-wrap:wrap;padding:14px 15px;margin:0 0 16px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.stat .n{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat .t{font-size:12.5px;color:var(--ink-3)}
.stat.hot .n{color:var(--amber)}
.stat.money .n{color:var(--green-d)}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}
.tools input[type=text]{flex:1;min-width:160px}
.tools input[type=month],.tools input[type=date],.tools select{width:auto;min-width:150px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 12px}
.formgrid .field{margin-bottom:12px}
.formgrid .span2{grid-column:span 2}
.formgrid .span3{grid-column:span 3}
@media (max-width:560px){.formgrid .span2,.formgrid .span3{grid-column:1/-1}}
.block.entry{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px}

/* ============ состояние ============ */
var S = { leads:[], deals:[], tlog:[], daily:[], results:{}, ovr:{} };

var LS_MGR = "sebiston.mgr";

function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function persist(){ lsSet(LS, JSON.stringify(S)); }
function restore(){
  var raw = lsGet(LS); if(!raw) return;
  try{
    var o = JSON.parse(raw);
    if(o && typeof o==="object"){
      S.leads = Array.isArray(o.leads)?o.leads:[];
      S.deals = Array.isArray(o.deals)?o.deals:[];
      S.tlog  = Array.isArray(o.tlog)?o.tlog:[];
      S.results = o.results && typeof o.results==="object" ? o.results : {};
      S.ovr = o.ovr && typeof o.ovr==="object" ? o.ovr : {};
      S.daily = Array.isArray(o.daily)?o.daily:[];
    }
  }catch(e){}
}

/* ============ утилиты ============ */
function $(id){ return document.getElementById(id); }
function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
function digits(s){ return (s||"").replace(/\D+/g,""); }
function pad(n){ return n<10?"0"+n:""+n; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function uid(){ return String(Date.now())+"-"+Math.random().toString(36).slice(2,8); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function nowHM(){ var d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function thisMonth(){ return todayISO().slice(0,7); }
var MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
function fmtDate(iso){ if(!iso) return ""; var p=iso.split("-"); if(p.length!==3) return iso; return parseInt(p[2],10)+" "+MON[parseInt(p[1],10)-1]; }
function num(v){ var n=parseFloat(String(v).replace(",",".")); return isFinite(n)?n:0; }
function money(n){ return Math.round(n).toLocaleString("ru-RU")+" $"; }
function area(n){ return (Math.round(n*100)/100).toLocaleString("ru-RU")+" м²"; }
function toast(m){ var t=$("toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("on");},2600); }
function mins(hm){ if(!hm) return null; var p=hm.split(":"); if(p.length<2) return null; return parseInt(p[0],10)*60+parseInt(p[1],10); }
function hhmm(m){ if(m==null) return "—"; var s=m<0?"-":""; m=Math.abs(m); return s+Math.floor(m/60)+" ч "+pad(m%60)+" мин"; }

function chipsHTML(name, list, sel, cls){
  return '<div class="chips" data-g="'+name+'" role="group">'+list.map(function(v){
    var extra = cls && cls[v] ? " "+cls[v] : "";
    return '<button type="button" class="chip'+extra+'" data-v="'+esc(v)+'" aria-pressed="'+(v===sel?"true":"false")+'">'+esc(v)+'</button>';
  }).join("")+'</div>';
}
function bindChips(root){
  root.addEventListener("click", function(ev){
    var b = ev.target.closest(".chip"); if(!b) return;
    var g = b.closest(".chips"); if(!g || !root.contains(g)) return;
    var on = b.getAttribute("aria-pressed")==="true";
    if(g.dataset.multi==="1"){ b.setAttribute("aria-pressed", on?"false":"true"); }
    else{
      Array.prototype.forEach.call(g.querySelectorAll(".chip"),function(c){c.setAttribute("aria-pressed","false");});
      b.setAttribute("aria-pressed", on?"false":"true");
    }
    g.classList.remove("invalid");
    root.dispatchEvent(new CustomEvent("chipchange",{detail:{group:g.dataset.g},bubbles:false}));
  });
}
function gv(root,name){ var b=root.querySelector('[data-g="'+name+'"] .chip[aria-pressed="true"]'); return b?b.dataset.v:""; }
function gvs(root,name){ return Array.prototype.map.call(root.querySelectorAll('[data-g="'+name+'"] .chip[aria-pressed="true"]'),function(b){return b.dataset.v;}); }
function gset(root,name,v){
  Array.prototype.forEach.call(root.querySelectorAll('[data-g="'+name+'"] .chip'),function(c){
    c.setAttribute("aria-pressed", c.dataset.v===v?"true":"false");
  });
}
function f(root,name){ return root.querySelector('[data-f="'+name+'"]'); }
function fv(root,name){ var e=f(root,name); return e?e.value.trim():""; }

function citiesDatalist(){
  return '<datalist id="cities">'+CITIES.map(function(c){
    return '<option value="'+esc(c[0])+'" label="'+esc(c[1])+'"></option>';
  }).join("")+'</datalist>';
}

/* ============ ручной ввод поверх расчёта ============ */
var ovrTimer=null;
function ovrKey(scope,mgr,period,field){ return [scope,mgr,period,field].join("~"); }
function ovrHas(k){ return Object.prototype.hasOwnProperty.call(S.ovr,k); }
function eff(k, auto){ return ovrHas(k) ? S.ovr[k] : auto; }
function effN(k, auto){ var v=eff(k,auto); return typeof v==="number"?v:num(v); }
function ovrFlush(){
  clearTimeout(ovrTimer);
  ovrTimer=setTimeout(function(){ push("ovr","all",{id:"all",map:S.ovr}); },600);
}
function ovrSet(k,v){
  if(v===""||v==null) delete S.ovr[k]; else S.ovr[k]=v;
  persist(); ovrFlush();
}
function ovrClearPrefix(pref){
  var hit=false;
  Object.keys(S.ovr).forEach(function(k){ if(k.indexOf(pref)===0){ delete S.ovr[k]; hit=true; } });
  if(hit){ persist(); ovrFlush(); }
  return hit;
}
function cellN(k, auto){
  var a = (auto||auto===0) ? auto : "";
  var edited = ovrHas(k) && num(S.ovr[k])!==num(a);
  var val = ovrHas(k) ? S.ovr[k] : a;
  return '<td class="num has-auto"><input class="cell n'+(edited?" edited":"")+'" data-k="'+esc(k)+'" data-auto="'+esc(a)+'" inputmode="decimal" value="'+esc(val)+'">'+
         (edited?'<span class="auto">расчёт: '+esc(a)+'</span>':'')+'</td>';
}
function cellT(k, auto, ph){
  var a = auto||"";
  var edited = ovrHas(k) && String(S.ovr[k])!==String(a);
  var val = ovrHas(k) ? S.ovr[k] : a;
  return '<td class="wrap"><input class="cell'+(edited?" edited":"")+'" data-k="'+esc(k)+'" data-auto="'+esc(a)+'" value="'+esc(val)+'" placeholder="'+esc(ph||"")+'"></td>';
}
function bindCells(wrap, rerender){
  wrap.addEventListener("change", function(ev){
    var i=ev.target;
    if(!i.classList || !i.classList.contains("cell")) return;
    var v=i.value.trim();
    if(v==="" || v===String(i.dataset.auto)) ovrSet(i.dataset.k,"");
    else ovrSet(i.dataset.k, v);
    rerender();
  });
  wrap.addEventListener("click", function(ev){
    var b=ev.target.closest("[data-reset]"); if(!b) return;
    if(ovrClearPrefix(b.dataset.reset)){ rerender(); toast("Строка вернулась к расчёту"); }
    else toast("В этой строке нет ручных правок");
  });
}

/* ============ выгрузка ============ */
function csvText(head, rows){
  return "\uFEFF"+[head].concat(rows).map(function(r){
    return r.map(function(c){ c=(c==null?"":String(c)).replace(/"/g,'""'); return '"'+c+'"'; }).join(";");
  }).join("\r\n");
}
async function download(name, text){
  if(dlCap){ try{ await dlCap.save({filename:name, data:text}); toast("Файл сохранён"); return; }catch(e){} }
  try{
    var b=new Blob([text],{type:"text/csv;charset=utf-8"}), u=URL.createObjectURL(b);
    var a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(u);a.remove();},1000);
    toast("Файл сохранён");
  }catch(e){ toast("Выгрузка недоступна в этом окне"); }
}

/* ============ синхронизация ============ */
async function push(coll, id, doc){
  if(!db) return;
  try{ await db.doc(coll+"/"+id).set(doc); }
  catch(e){ toast("Сохранено на устройстве, общая база недоступна"); }
}
async function drop(coll, id){
  if(!db) return;
  try{ await db.doc(coll+"/"+id).delete(); }catch(e){}
}

function initLeadPanel(root, mode){
  var isOffice = mode==="office";
  root.innerHTML = leadPanel(mode);
  bindChips(root);

  var elTel=f(root,"tel"), elFio=f(root,"fio");

  root.addEventListener("chipchange", function(ev){
    if(ev.detail.group==="stage") f(root,"rejWrap").hidden = gv(root,"stage")!=="Отказ";
    summary();
  });
  f(root,"meet").addEventListener("change", function(){
    f(root,"meetWrap").hidden = !this.checked;
    if(this.checked && !f(root,"meetDate").value){
      var d=new Date(); d.setDate(d.getDate()+1);
      f(root,"meetDate").value = d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
      f(root,"meetTime").value = "11:00";
    }
    summary();
  });
  f(root,"waSame").addEventListener("change", function(){ f(root,"waWrap").hidden = this.checked; });

  function dup(){
    var d=digits(elTel.value), box=f(root,"dup");
    if(d.length<6){ box.hidden=true; return; }
    var tail=d.slice(-9), hit=null;
    for(var i=0;i<S.leads.length;i++){ var t=digits(S.leads[i].tel).slice(-9); if(t&&t===tail){hit=S.leads[i];break;} }
    if(!hit){ box.hidden=true; return; }
    f(root,"dupText").innerHTML = "Этот номер уже в базе: <b>"+esc(hit.fio)+"</b>, записал "+esc(hit.mgr)+" "+esc(fmtDate(hit.date))+". Сохраните как повторный контакт, а не как нового клиента.";
    box.hidden=false;
  }
  elTel.addEventListener("input", function(){ elTel.setAttribute("aria-invalid","false"); f(root,"e-tel").hidden=true; dup(); summary(); });
  elFio.addEventListener("input", function(){ elFio.setAttribute("aria-invalid","false"); f(root,"e-fio").hidden=true; summary(); });

  function summary(){
    var miss=[];
    if(!elFio.value.trim()) miss.push("имя");
    if(digits(elTel.value).length<9) miss.push("телефон");
    if(!gv(root,"mgr")) miss.push("менеджера");
    if(miss.length){ f(root,"sum").textContent="Заполните "+miss.join(", "); return; }
    var o=gvs(root,"obj");
    f(root,"sum").textContent = (gv(root,"stage")||"Потенциальный")+(o.length?" · "+o.join(", "):"")+(f(root,"meet").checked?" · встреча назначена":"");
  }

  function reset(keepMgr){
    ["fio","tel","wa","sqFrom","sqTo","budget","note","decision","feedback"].forEach(function(n){ var e=f(root,n); if(e) e.value=""; });
    f(root,"waSame").checked=true; f(root,"waWrap").hidden=true;
    f(root,"meet").checked=false; f(root,"meetWrap").hidden=true;
    f(root,"meetDate").value=""; f(root,"meetTime").value="";
    f(root,"dup").hidden=true;
    gset(root,"topic",""); gset(root,"floor","");
    Array.prototype.forEach.call(root.querySelectorAll('[data-g="obj"] .chip'),function(c){c.setAttribute("aria-pressed","false");});
    gset(root,"stage","Потенциальный"); gset(root,"rej",""); f(root,"rejWrap").hidden=true;
    if(keepMgr) gset(root,"mgr",keepMgr);
    f(root,"dt").value=todayISO(); f(root,"tm").value=nowHM();
    summary();
  }

  f(root,"save").addEventListener("click", async function(){
    var ok=true, first=null;
    if(!elFio.value.trim()){ elFio.setAttribute("aria-invalid","true"); f(root,"e-fio").hidden=false; ok=false; first=elFio; }
    if(digits(elTel.value).length<9){ elTel.setAttribute("aria-invalid","true"); f(root,"e-tel").hidden=false; ok=false; first=first||elTel; }
    var g=root.querySelector('[data-g="mgr"]');
    if(!gv(root,"mgr")){ g.classList.add("invalid"); f(root,"e-mgr").hidden=false; ok=false; first=first||g; }
    else { g.classList.remove("invalid"); f(root,"e-mgr").hidden=true; }
    if(!ok){ if(first){ first.scrollIntoView({block:"center",behavior:"smooth"}); try{first.focus({preventScroll:true});}catch(e){} } toast("Не хватает данных"); return; }

    var waSame=f(root,"waSame").checked;
    var rec = {
      id: uid(), kind: isOffice?"office":"call",
      date: f(root,"dt").value, time: f(root,"tm").value,
      src: gv(root,"src"), fio: elFio.value.trim(), tel: elTel.value.trim(),
      wa: waSame ? elTel.value.trim() : fv(root,"wa"),
      city: fv(root,"city"), topic: gv(root,"topic"), objects: gvs(root,"obj"),
      sqFrom: fv(root,"sqFrom"), sqTo: fv(root,"sqTo"), floor: gv(root,"floor"), budget: fv(root,"budget"),
      stage: gv(root,"stage")||"Потенциальный",
      reject: gv(root,"stage")==="Отказ" ? gv(root,"rej") : "",
      meetDate: f(root,"meet").checked ? f(root,"meetDate").value : "",
      meetTime: f(root,"meet").checked ? f(root,"meetTime").value : "",
      meetHeld: false,
      decision: fv(root,"decision"), feedback: fv(root,"feedback"),
      note: fv(root,"note"), mgr: gv(root,"mgr"), createdAt: new Date().toISOString()
    };
    S.leads.unshift(rec); persist(); lsSet(LS_MGR, rec.mgr);
    renderList(); reset(rec.mgr);
    root.querySelector(".formside").scrollIntoView({block:"start",behavior:"smooth"});
    toast("Клиент записан: "+rec.fio);
    push("leads", rec.id, rec);
  });

  f(root,"clear").addEventListener("click", function(){ reset(lsGet(LS_MGR)||""); toast("Форма очищена"); });
  f(root,"q").addEventListener("input", renderList);
  f(root,"exp").addEventListener("click", function(){
    var rows = pick();
    if(!rows.length){ toast("Нечего выгружать"); return; }
    var head = ["№","Дата","Время","Источник","ФИО","Телефон","WhatsApp","Город","Тема вопроса","Объект",
                "Площадь от","Площадь до","Этаж","Бюджет $","Этап","Причина отказа","Встреча дата","Встреча время","Встреча проведена"]
                .concat(isOffice?["Последнее решение","Обратная связь"]:[]).concat(["Примечание","Менеджер"]);
    var body = rows.map(function(l,i){
      var base=[i+1,l.date,l.time,l.src,l.fio,l.tel,l.wa,l.city,l.topic,(l.objects||[]).join(" / "),
                l.sqFrom,l.sqTo,l.floor,l.budget,l.stage,l.reject,l.meetDate,l.meetTime,l.meetHeld?"да":""];
      if(isOffice) base=base.concat([l.decision||"",l.feedback||""]);
      return base.concat([l.note,l.mgr]);
    });
    download("sebiston-"+(isOffice?"ofis":"zvonki")+"-"+todayISO()+".csv", csvText(head, body));
  });

  function pick(){
    var q=f(root,"q").value.trim().toLowerCase();
    return S.leads.filter(function(l){
      if(l.kind!==(isOffice?"office":"call")) return false;
      if(!q) return true;
      return [l.fio,l.tel,l.note,l.topic,l.city,(l.objects||[]).join(" ")].join(" ").toLowerCase().indexOf(q)>=0;
    });
  }

  function renderList(){
    var rows=pick();
    var hot=rows.filter(function(l){return l.stage==="Горячий";}).length;
    var mset=rows.filter(function(l){return l.meetDate;}).length;
    var mheld=rows.filter(function(l){return l.meetHeld;}).length;
    var rej=rows.filter(function(l){return l.stage==="Отказ";}).length;
    f(root,"stats").innerHTML =
      '<div class="stat"><div class="n">'+rows.length+'</div><div class="t">контактов</div></div>'+
      '<div class="stat hot"><div class="n">'+hot+'</div><div class="t">горячих</div></div>'+
      '<div class="stat"><div class="n">'+mset+'</div><div class="t">встреч назначено</div></div>'+
      '<div class="stat"><div class="n">'+mheld+'</div><div class="t">проведено</div></div>'+
      '<div class="stat"><div class="n">'+rej+'</div><div class="t">отказов</div></div>';

    if(!rows.length){
      f(root,"tblw").outerHTML = '<div class="empty" data-f="tblw"><b>Пока пусто</b>Сохранённые контакты появятся здесь.</div>';
      return;
    }
    var html='<table><thead><tr><th>Дата</th><th>ФИО</th><th>Телефон</th><th>Тема</th><th>Объект</th><th>Этап</th><th>Встреча</th>'+
      (isOffice?'<th>Решение</th>':'')+'<th>Примечание</th><th>Менеджер</th><th></th></tr></thead><tbody>'+
      rows.map(function(l){
        var cls=l.stage==="Горячий"?"hot":(l.stage==="Отказ"?"no":"");
        var meet = l.meetDate
          ? fmtDate(l.meetDate)+(l.meetTime?" "+l.meetTime:"")+' <button class="lnk '+(l.meetHeld?"ok":"")+'" data-held="'+l.id+'">'+(l.meetHeld?"проведена":"отметить")+'</button>'
          : "—";
        return '<tr><td>'+esc(fmtDate(l.date))+(l.time?' '+esc(l.time):'')+'</td>'+
          '<td>'+esc(l.fio)+'</td>'+
          '<td><a href="tel:'+esc(digits(l.tel))+'">'+esc(l.tel)+'</a></td>'+
          '<td class="wrap">'+esc(l.topic||"—")+'</td>'+
          '<td class="wrap">'+esc((l.objects||[]).join(", ")||"—")+'</td>'+
          '<td><span class="badge '+cls+'">'+esc(l.stage)+'</span>'+(l.reject?'<br><span class="hint">'+esc(l.reject)+'</span>':'')+'</td>'+
          '<td>'+meet+'</td>'+
          (isOffice?'<td class="wrap">'+esc(l.decision||"—")+'</td>':'')+
          '<td class="wrap">'+esc(l.note||"—")+'</td>'+
          '<td>'+esc(l.mgr)+'</td>'+
          '<td><button class="lnk" data-del="'+l.id+'">удалить</button></td></tr>';
      }).join("")+'</tbody></table>';
    var w=f(root,"tblw");
    if(!w.classList.contains("tbl-wrap")){ var nw=el('<div class="tbl-wrap" data-f="tblw"></div>'); w.parentNode.replaceChild(nw,w); w=nw; }
    w.innerHTML=html;
    w.onclick=function(ev){
      var h=ev.target.closest("[data-held]"), d=ev.target.closest("[data-del]");
      if(h){
        var L=S.leads.find(function(x){return x.id===h.dataset.held;});
        if(L){ L.meetHeld=!L.meetHeld; persist(); push("leads",L.id,L); renderList(); }
      } else if(d){
        var i=S.leads.findIndex(function(x){return x.id===d.dataset.del;});
        if(i>=0){ var id=S.leads[i].id; S.leads.splice(i,1); persist(); drop("leads",id); renderList(); toast("Запись удалена"); }
      }
    };
  }

  root._render = renderList;
  reset(lsGet(LS_MGR)||"");
  renderList();
}

function delDeal(id){
  var i=S.deals.findIndex(function(x){return x.id===id;});

/* площадь + (цена за м² ИЛИ общая сумма). Итог можно вписать сразу — как в отчётах менеджеров */
function bindMoney(root){
  var manual=false;
  function upd(src){
    var a=num(fv(root,"area")), p=num(fv(root,"price"));
    if(src==="total"){ manual = fv(root,"total")!==""; }
    if(src==="price"){ manual=false; }
    if(!manual){ f(root,"total").value = (a&&p) ? String(Math.round(a*p*100)/100) : ""; }
    var t=num(fv(root,"total"));
    var hint=f(root,"priceHint");
    if(hint) hint.textContent = (manual && a && t) ? "≈ "+Math.round(t/a).toLocaleString("ru-RU")+" $ за м²" : "";
    var paid=f(root,"paid"), rest=f(root,"rest");
    if(rest) rest.textContent = money(t - (paid?num(paid.value):0));
  }
  ["area","price","total","paid"].forEach(function(n){
    var e=f(root,n); if(e) e.addEventListener("input", function(){ upd(n); });
  });
  return { reset:function(){ manual=false; upd(); }, upd:upd };
}

/* ==================================================================
   ОБЩЕЕ ДЛЯ ОТЧЁТОВ
   ================================================================== */
function inMonth(iso, mon){ return !mon || (iso||"").slice(0,7)===mon; }
function namesText(s){ return String(s==null?"":s).split(/[,;\n]+/).map(function(x){return x.trim();}).filter(function(x){return x && !/^\d+$/.test(x);}).join(", "); }
function namesCount(s){
  var t=String(s==null?"":s).trim();
  if(/^\d+$/.test(t)) return parseInt(t,10);          /* в старых отчётах вместо ФИО стоит число */
  return t.split(/[,;\n]+/).map(function(x){return x.trim();}).filter(function(x){return x && !/^\d+$/.test(x);}).length;
}
function leadAgg(list, deals){
  var rej = list.filter(function(l){return l.stage==="Отказ";});
  var causes={};
  rej.forEach(function(l){ var k=l.reject||"без причины"; causes[k]=(causes[k]||0)+1; });
  var causeText = Object.keys(causes).sort(function(a,b){return causes[b]-causes[a];})
    .map(function(k){return k+" — "+causes[k];}).join("; ");
  return {
    worked: list.length,
    set: list.filter(function(l){return l.meetDate;}).length,
    held: list.filter(function(l){return l.meetHeld;}).length,
    rej: rej.length, causes: causeText,
    bron: deals.filter(function(d){return d.status==="Бронь";}).length,
    sold: deals.filter(function(d){return d.status==="Продажа";}).length,
    money: deals.filter(function(d){return d.status==="Продажа";}).reduce(function(s,d){return s+d.total;},0)
  };
}
/* дневные отчёты менеджеров за месяц → те же поля, что у сводки */
function dailyAgg(list){
  return {
    worked: list.reduce(function(s,r){return s+num(r.worked);},0),
    set:    list.reduce(function(s,r){return s+num(r.set);},0),
    held:   list.reduce(function(s,r){return s+num(r.held);},0),
    rej:    list.reduce(function(s,r){return s+num(r.rej);},0),
    causes: list.map(function(r){return r.rejReason;}).filter(Boolean).join("; "),
    bron:   list.reduce(function(s,r){return s+namesCount(r.bronNames);},0),
    sold:   list.reduce(function(s,r){return s+namesCount(r.soldNames);},0),
    money:  0
  };
}

  });

      '<div class="stat"><div class="n">'+a.rej+'</div><div class="t">отказов</div></div>'+
      '<div class="stat hot"><div class="n">'+a.bron+'</div><div class="t">броней</div></div>'+
      '<div class="stat money"><div class="n">'+a.sold+'</div><div class="t">продаж</div></div>';
    var w=f(root,"tblw");
    if(!rr.length){ w.innerHTML='<div class="empty" style="border:0"><b>Отчётов за месяц нет</b>Заполните форму выше — каждый сохранённый день появится здесь строкой.</div>'; return; }
    w.innerHTML='<table><thead><tr><th>Дата</th><th>Обработано</th><th class="num">Назначенные встречи</th><th>Проведено встреч</th>'+
      '<th>Отказано (причина отказа)</th><th>Бронь (ФИО покупателей)</th><th>Продаж (ФИО покупателей)</th><th></th></tr></thead><tbody>'+
      rr.map(function(r){
        var flag = num(r.held)>num(r.set) ? ' class="flagged"' : '';
        var wk=[]; if(r.worked!=="") wk.push("<b>"+esc(r.worked)+"</b>");
        if(num(r.calls)) wk.push(esc(r.calls)+" звонк.");
        if(num(r.comments)) wk.push(esc(r.comments)+" комм.");
        var held = (r.held!==""?"<b>"+esc(r.held)+"</b>":"—")+(r.heldNote?'<br><span class="hint">'+esc(r.heldNote)+'</span>':'');
        var rej = (num(r.rej)?"<b>"+esc(r.rej)+"</b> — ":"")+(esc(r.rejReason)||(num(r.rej)?"":"нет"));
        var bron = r.bronNames ? esc(r.bronNames) : "нет";
        var sold = (r.soldNames ? esc(r.soldNames) : "нет")+(r.saleNote?'<br><span class="hint">'+esc(r.saleNote)+'</span>':'');
        return '<tr'+flag+'><td>'+esc(fmtDate(r.date))+'</td><td class="wrap">'+(wk.join(" · ")||"—")+'</td>'+
          '<td class="num">'+(r.set!==""?esc(r.set):"—")+'</td><td class="wrap">'+held+'</td>'+
          '<td class="wrap">'+rej+'</td><td class="wrap">'+bron+'</td><td class="wrap">'+sold+'</td>'+
          '<td style="white-space:nowrap"><button class="lnk ok" data-edit="'+r.id+'">изменить</button> &nbsp;<button class="lnk" data-del="'+r.id+'">удалить</button></td></tr>';
      }).join("")+'</tbody><tfoot><tr><td>Итого</td><td>'+a.worked+'</td><td class="num">'+a.set+'</td><td>'+a.held+'</td>'+
      '<td>'+a.rej+'</td><td>'+a.bron+'</td><td>'+a.sold+'</td><td></td></tr></tfoot></table>';
    w.onclick=function(ev){
      var e=ev.target.closest("[data-edit]"), d=ev.target.closest("[data-del]");
      if(e){ var r=S.daily.find(function(x){return x.id===e.dataset.edit;}); if(r){ load(r); root.scrollIntoView({block:"start",behavior:"smooth"}); } }
      else if(d){
        var i=S.daily.findIndex(function(x){return x.id===d.dataset.del;});
        if(i>=0){ var id=S.daily[i].id; S.daily.splice(i,1); persist(); drop("daily",id); if(editing===id) reset(); render(); toast("День удалён"); }
      }
    };
  }
  root._render=render;
  reset(); render();
}

      '<div class="field"><label class="lbl">Дата <span class="req">•</span></label><input type="date" data-f="dt"></div>'+
      '<div class="field"><label class="lbl">Обработано</label><input type="number" data-f="worked" min="0" inputmode="numeric" placeholder="0"></div>'+
      '<div class="field"><label class="lbl">Назначенные встречи</label><input type="number" data-f="set" min="0" inputmode="numeric" placeholder="0"></div>'+
      '<div class="field"><label class="lbl">Проведено встреч</label><input type="number" data-f="held" min="0" inputmode="numeric" placeholder="0"></div>'+
      '<div class="field"><label class="lbl">Отказано</label><input type="number" data-f="rej" min="0" inputmode="numeric" placeholder="0"></div>'+
      '<div class="field span3"><label class="lbl">Частая причина отказа</label><input type="text" data-f="rejReason" list="rejlist2" placeholder="например: высокая стоимость, вариант не по бюджету"></div>'+
      '<div class="field span3"><label class="lbl">Бронь — ФИО покупателей</label><input type="text" data-f="bronNames" placeholder="ФИО через запятую или число"><p class="hint" data-f="bronCnt"></p></div>'+
      '<div class="field span3"><label class="lbl">Продажа — ФИО покупателей</label><input type="text" data-f="soldNames" placeholder="ФИО через запятую или число"><p class="hint" data-f="soldCnt"></p></div>'+
    '</div>'+
    '<datalist id="rejlist2">'+REJECTS.map(function(r){return '<option value="'+esc(r)+'"></option>';}).join("")+'</datalist>'+
    '<div class="warn" data-f="heldWarn" hidden style="margin-top:4px"><span aria-hidden="true">⚑</span><div>Проведено встреч больше, чем назначено. Проверьте цифры — или укажите, что встреча была без предварительной записи.</div></div>'+
    '<div class="actions"><div class="sum" data-f="sum"></div>'+
      '<button class="btn btn-ghost" data-f="clear" type="button">Очистить</button>'+
      '<button class="btn btn-main" data-f="save" type="button">Сохранить</button></div>'+
  '</div>'+
  '<div class="warn" data-f="warn" hidden><span aria-hidden="true">⚑</span><div data-f="warnText"></div></div>'+
  '<div class="stats" data-f="stats"></div>'+
  '<div class="tbl-wrap" data-f="tblw"></div>';

  var FIELDS=["worked","set","held","rej","rejReason","bronNames","soldNames"];
  var NUMF=["worked","set","held","rej"];
  var editing=null;

  f(root,"pday").value=todayISO();
  f(root,"pmon").value=thisMonth();
  f(root,"dt").value=todayISO();
  var lastM=lsGet(LS_MGR); if(lastM && MGRS.indexOf(lastM)>=0) f(root,"mgr").value=lastM;

  function isDay(){ return f(root,"mode").value==="day"; }
  f(root,"mode").addEventListener("change", function(){
    f(root,"pday").hidden=!isDay(); f(root,"pmon").hidden=isDay(); render();
  });
  f(root,"pday").addEventListener("change", function(){ f(root,"dt").value=this.value; reset(true); render(); });
  f(root,"pmon").addEventListener("change", render);

  function find(m,d){ return S.daily.find(function(r){return r.mgr===m && r.date===d;}); }
  function live(){
    var b=namesCount(fv(root,"bronNames")), s=namesCount(fv(root,"soldNames"));
    f(root,"bronCnt").textContent = b ? "броней: "+b : "";
    f(root,"soldCnt").textContent = s ? "продаж: "+s : "";
    f(root,"heldWarn").hidden = !(num(fv(root,"held"))>num(fv(root,"set")));
    f(root,"sum").textContent = f(root,"mgr").value+" · "+(f(root,"dt").value?fmtDate(f(root,"dt").value):"без даты")+(editing?" · правка":"");
  }
  FIELDS.forEach(function(n){ f(root,n).addEventListener("input", live); });
  function tryLoad(){
    var ex=find(f(root,"mgr").value, f(root,"dt").value);
    if(ex){ load(ex); toast("У "+ex.mgr+" за "+fmtDate(ex.date)+" уже есть данные — открыты для правки"); }
    else if(editing){ editing=null; f(root,"formTitle").textContent="Добавить менеджера в отчёт"; }
    live();
  }
  f(root,"mgr").addEventListener("change", tryLoad);

  function load(r){

    FIELDS.forEach(function(n){ f(root,n).value = r[n]==null ? "" : r[n]; });
    f(root,"formTitle").textContent="Правка: "+r.mgr+", "+fmtDate(r.date);
    live();
  }
  function reset(keepDate){
    editing=null;
    FIELDS.forEach(function(n){ f(root,n).value=""; });
    if(!keepDate) f(root,"dt").value = isDay() ? f(root,"pday").value : todayISO();
    f(root,"formTitle").textContent="Добавить менеджера в отчёт";
    live();
  }

  f(root,"save").addEventListener("click", function(){
    var m=f(root,"mgr").value, d=f(root,"dt").value;
    if(!d){ toast("Укажите дату"); return; }
    var rec=find(m,d);
    if(!rec && editing){ rec=S.daily.find(function(x){return x.id===editing;}); }
    if(!rec){ rec={ id:uid(), createdAt:new Date().toISOString() }; S.daily.push(rec); }
    rec.mgr=m; rec.date=d;
    /* поля, которых нет в сводной форме (звонки, комментарии) — не трогаем */
    FIELDS.forEach(function(n){ var v=fv(root,n); rec[n] = NUMF.indexOf(n)>=0 ? (v===""?"":num(v)) : v; });
    persist(); push("daily",rec.id,rec);
    if(isDay()) f(root,"pday").value=d; else f(root,"pmon").value=d.slice(0,7);
    toast((editing?"Исправлено: ":"Добавлено: ")+m+", "+fmtDate(d));
    var nextIdx=MGRS.indexOf(m)+1;
    reset(true);
    /* следующий менеджер — чтобы сводный за день заполнялся подряд */
    for(var i=nextIdx;i<MGRS.length;i++){ if(!find(MGRS[i],d)){ f(root,"mgr").value=MGRS[i]; break; } }
    live(); render();
  });
  f(root,"clear").addEventListener("click", function(){ reset(true); toast("Форма очищена"); });

  function rowsFor(){
    var list = isDay()
      ? S.daily.filter(function(r){return r.date===f(root,"pday").value;})
      : S.daily.filter(function(r){return inMonth(r.date,f(root,"pmon").value);});
    return MGRS.map(function(m){
      var L=list.filter(function(r){return r.mgr===m;});
      if(!L.length) return null;
      var a=dailyAgg(L);
      return { mgr:m, recs:L, worked:a.worked, set:a.set, held:a.held, rej:a.rej, causes:a.causes,
        bronNames:L.map(function(r){return namesText(r.bronNames);}).filter(Boolean).join(", "),
        soldNames:L.map(function(r){return namesText(r.soldNames);}).filter(Boolean).join(", "),
        bron:a.bron, sold:a.sold, days:L.length };
    }).filter(Boolean);
  }

  f(root,"exp").addEventListener("click", function(){
    var rr=rowsFor(); if(!rr.length){ toast("Нечего выгружать"); return; }
    var per = isDay()? f(root,"pday").value : f(root,"pmon").value;
    var head=["Менеджер","Обработано","Назначенные встречи","Проведено встреч","Отказано","Частая причина отказа","Бронь (ФИО покупателей)","Броней","Продаж (ФИО покупателей)","Продаж"];
    var body=rr.map(function(r){return [r.mgr,r.worked,r.set,r.held,r.rej,r.causes,r.bronNames,r.bron,r.soldNames,r.sold];});
    var T=tot(rr); body.push(["ИТОГО",T.worked,T.set,T.held,T.rej,"","",T.bron,"",T.sold]);
    download("sebiston-lidy-otdel-"+per+".csv", csvText(head, body));
  });

  function tot(rr){ return rr.reduce(function(s,r){ ["worked","set","held","rej","bron","sold"].forEach(function(k){s[k]+=r[k];}); return s; },{worked:0,set:0,held:0,rej:0,bron:0,sold:0}); }

  function render(){
    var rr=rowsFor(), T=tot(rr), day=isDay();

      '<div class="stat"><div class="n">'+rr.length+' / '+MGRS.length+'</div><div class="t">менеджеров в отчёте</div></div>'+
      '<div class="stat"><div class="n">'+T.worked+'</div><div class="t">обработано</div></div>'+
      '<div class="stat"><div class="n">'+T.set+' / '+T.held+'</div><div class="t">встреч назначено / проведено</div></div>'+
      '<div class="stat"><div class="n">'+T.rej+'</div><div class="t">отказов</div></div>'+
      '<div class="stat hot"><div class="n">'+T.bron+'</div><div class="t">броней</div></div>'+
      '<div class="stat money"><div class="n">'+T.sold+'</div><div class="t">продаж</div></div>';

    var bad=rr.filter(function(r){return r.held>r.set;});
    var missing = day ? MGRS.filter(function(m){ return !rr.some(function(r){return r.mgr===m;}); }) : [];
    var msgs=[];
    if(bad.length) msgs.push("Проведено встреч больше, чем назначено, у: <b>"+esc(bad.map(function(r){return r.mgr;}).join(", "))+"</b>.");
    if(day && rr.length && missing.length) msgs.push("Ещё не сдали отчёт за "+esc(fmtDate(f(root,"pday").value))+": "+esc(missing.join(", "))+".");
    if(msgs.length){ f(root,"warnText").innerHTML=msgs.join("<br>"); f(root,"warn").hidden=false; } else f(root,"warn").hidden=true;

    var w=f(root,"tblw");
    if(!rr.length){
      w.innerHTML='<div class="empty" style="border:0"><b>'+(day?"За этот день данных нет":"За этот месяц данных нет")+'</b>Заполните форму выше — после сохранения форма сама переключится на следующего менеджера.</div>';
      return;
    }
    w.innerHTML='<table><thead><tr><th>Менеджер</th>'+(day?'':'<th class="num">Дней</th>')+
      '<th class="num">Обработано</th><th class="num">Назначенные встречи</th><th class="num">Проведено встреч</th>'+
      '<th>Отказано (частая причина отказа)</th><th>Бронь (ФИО покупателей)</th><th>Продаж (ФИО покупателей)</th><th></th></tr></thead><tbody>'+
      rr.map(function(r){
        var flag=r.held>r.set?' class="flagged"':'';
        var rej=(r.rej?"<b>"+r.rej+"</b>"+(r.causes?" — ":""):"")+(esc(r.causes)||(r.rej?"":"0"));
        var bron=r.bron?"<b>"+r.bron+"</b>"+(r.bronNames?" — "+esc(r.bronNames):""):"0";
        var sold=r.sold?"<b>"+r.sold+"</b>"+(r.soldNames?" — "+esc(r.soldNames):""):"0";
        var act = day
          ? '<button class="lnk ok" data-edit="'+r.recs[0].id+'">изменить</button> &nbsp;<button class="lnk" data-del="'+r.recs[0].id+'">удалить</button>'
          : '<button class="lnk ok" data-open="'+esc(r.mgr)+'">по дням</button>';
        return '<tr'+flag+'><td>'+esc(r.mgr)+'</td>'+(day?'':'<td class="num">'+r.days+'</td>')+
          '<td class="num">'+r.worked+'</td><td class="num">'+r.set+'</td><td class="num">'+r.held+'</td>'+
          '<td class="wrap">'+rej+'</td><td class="wrap">'+bron+'</td><td class="wrap">'+sold+'</td>'+
          '<td style="white-space:nowrap">'+act+'</td></tr>';
      }).join("")+'</tbody><tfoot><tr><td>Итого</td>'+(day?'':'<td></td>')+'<td class="num">'+T.worked+'</td><td class="num">'+T.set+'</td>'+
      '<td class="num">'+T.held+'</td><td>'+T.rej+'</td><td>'+T.bron+'</td><td>'+T.sold+'</td><td></td></tr></tfoot></table>';
    w.onclick=function(ev){
      var e=ev.target.closest("[data-edit]"), d=ev.target.closest("[data-del]"), o=ev.target.closest("[data-open]");
      if(e){ var r=S.daily.find(function(x){return x.id===e.dataset.edit;}); if(r){ load(r); root.scrollIntoView({block:"start",behavior:"smooth"}); } }
      else if(d){
        var i=S.daily.findIndex(function(x){return x.id===d.dataset.del;});
        if(i>=0){ var id=S.daily[i].id; S.daily.splice(i,1); persist(); drop("daily",id); if(editing===id) reset(true); render(); toast("Удалено"); }
      } else if(o){
        lsSet(LS_MGR,o.dataset.open);
        var pr=PANELS.rday.node;
        open("rday");
        var sel=pr.querySelector('[data-f="mgr"]'), mo=pr.querySelector('[data-f="mon"]');
        if(sel){ sel.value=o.dataset.open; } if(mo){ mo.value=f(root,"pmon").value; }
        if(sel) sel.dispatchEvent(new Event("change"));
      }
    };
  }
  root._render=render;
  reset(); render();
}

/* ==================================================================
   ВКЛАДКА 7 · ИТОГ ПО ПРОДАЖАМ — в формате «Итогового отчёта менеджеров»
   ================================================================== */
function initRSale(root){
  root.innerHTML =
  '<p class="lede">Итоговый отчёт менеджеров по продажам — те же колонки, что в вашем документе. <b>Каждая квартира — отдельная строка</b>, общий объём и общая сумма по менеджеру складываются сами. Квартиры можно добавлять прямо здесь — они же появятся во вкладке «Продажи».</p>'+
  '<div class="block entry"><div class="block-h"><h2>Добавить квартиру</h2></div>'+
    '<div class="formgrid">'+
      '<div class="field"><label class="lbl">Менеджер <span class="req">•</span></label><select data-f="mgr">'+MGRS.map(function(m){return '<option>'+esc(m)+'</option>';}).join("")+'</select></div>'+
      '<div class="field span2"><label class="lbl">Объект <span class="req">•</span></label><select data-f="obj">'+OBJECTS.map(function(o){return '<option>'+esc(o)+'</option>';}).join("")+'</select></div>'+
      '<div class="field"><label class="lbl">Блок</label><input type="text" data-f="block" placeholder="А"></div>'+
      '<div class="field"><label class="lbl">Этаж</label><input type="number" data-f="floor" min="0" inputmode="numeric"></div>'+
      '<div class="field"><label class="lbl">Площадь м² <span class="req">•</span></label><input type="number" data-f="area" min="0" step="0.01" inputmode="decimal"></div>'+
      '<div class="field"><label class="lbl">Метод</label><select data-f="method"><option value="">—</option>'+METHODS.map(function(m){return '<option>'+esc(m)+'</option>';}).join("")+'</select></div>'+
      '<div class="field"><label class="lbl">Цена за м², $</label><input type="number" data-f="price" min="0" inputmode="numeric"></div>'+
      '<div class="field"><label class="lbl">Сумма, $ <span class="req">•</span></label><input type="number" data-f="total" min="0" inputmode="numeric"><p class="hint" data-f="priceHint"></p></div>'+
      '<div class="field"><label class="lbl">Внесено, $</label><input type="number" data-f="paid" min="0" inputmode="numeric"></div>'+
      '<div class="field"><label class="lbl">Статус</label><select data-f="status"><option>Продажа</option><option>Бронь</option></select></div>'+
      '<div class="field"><label class="lbl">Дата</label><input type="date" data-f="dt"></div>'+
      '<div class="field span2"><label class="lbl">Покупатель</label><input type="text" data-f="buyer"></div>'+
      '<div class="field span2"><label class="lbl">Примечание</label><input type="text" data-f="note" placeholder="например: остаток до конца сентября"></div>'+
    '</div>'+
    '<p class="err" data-f="e-num" hidden>Нужны площадь и сумма (или цена за м²)</p>'+
    '<div class="actions"><div class="sum">Остаток: <b data-f="rest">0 $</b></div>'+
      '<button class="btn btn-main" data-f="add" type="button">Добавить квартиру</button></div>'+
  '</div>'+
  '<div class="tools"><input type="month" data-f="mon" aria-label="Месяц">'+
    '<select data-f="st" aria-label="Статус"><option value="">Продажи и брони</option><option>Продажа</option><option>Бронь</option></select>'+
    '<button class="btn btn-ghost btn-sm" data-f="exp" type="button">Выгрузить в Excel</button></div>'+
  '<div class="stats" data-f="stats"></div>'+
  '<div class="tbl-wrap" data-f="tblw"></div>'+
  '<div class="cols" style="margin-top:24px">'+
    '<div><div class="block-h"><h2>По объектам</h2></div><div class="tbl-wrap" data-f="objw"></div></div>'+
    '<div><div class="block-h"><h2>По методу оплаты</h2></div><div class="tbl-wrap" data-f="metw"></div></div>'+
  '</div>';

  var mon=bindMoney(root);
  f(root,"mon").value=thisMonth();
  f(root,"dt").value=todayISO();
  var lastM=lsGet(LS_MGR); if(lastM && MGRS.indexOf(lastM)>=0) f(root,"mgr").value=lastM;
  f(root,"mon").addEventListener("change", render);
  f(root,"st").addEventListener("change", render);

  f(root,"add").addEventListener("click", function(){
    var a=num(fv(root,"area")), t=num(fv(root,"total")), pd=num(fv(root,"paid"));
    if(!a||!t){ f(root,"e-num").hidden=false; toast("Нужны площадь и сумма"); return; }
    f(root,"e-num").hidden=true;
    var rec={ id:uid(), date:f(root,"dt").value||todayISO(), mgr:f(root,"mgr").value, buyer:fv(root,"buyer"),
      object:f(root,"obj").value, block:fv(root,"block"), floor:fv(root,"floor"),
      area:a, price:num(fv(root,"price"))||t/a, total:t, paid:pd, rest:t-pd,
      method:f(root,"method").value, term:"", status:f(root,"status").value, note:fv(root,"note"),
      createdAt:new Date().toISOString() };
    saveDeal(rec);
    f(root,"mon").value=rec.date.slice(0,7);
    ["block","floor","area","price","total","paid","buyer","note"].forEach(function(n){ f(root,n).value=""; });
    mon.reset(); render();
    toast(rec.mgr+": "+rec.object+", "+money(rec.total));
    f(root,"area").focus();
  });

  function pick(){
    var mo=f(root,"mon").value, st=f(root,"st").value;
    return S.deals.filter(function(d){ return inMonth(d.date,mo) && (!st || d.status===st); })
      .sort(function(a,b){ return (a.createdAt||"").localeCompare(b.createdAt||""); });
  }
  function byMgr(D){
    return MGRS.map(function(m){
      var list=D.filter(function(d){return d.mgr===m;});
      return { mgr:m, list:list,
        m2:list.reduce(function(s,d){return s+d.area;},0),
        total:list.reduce(function(s,d){return s+d.total;},0),
        paid:list.reduce(function(s,d){return s+d.paid;},0) };
    }).filter(function(g){return g.list.length;});
  }
  function r2(n){ return (Math.round(n*100)/100).toLocaleString("ru-RU"); }

  f(root,"exp").addEventListener("click", function(){
    var G=byMgr(pick()); if(!G.length){ toast("Нечего выгружать"); return; }
    var head=["ФИО менеджера","Объект","Блок","Этаж","Площадь м²","Метод","Сумма $","Внесено $","Статус","Общий объём м² (менеджер)","Общая сумма $ (менеджер)"];
    var body=[];
    G.forEach(function(g){
      g.list.forEach(function(d,i){
        body.push([i===0?g.mgr:"", d.object, d.block, d.floor, d.area, d.method, d.total, d.paid, d.status,
                   i===0?Math.round(g.m2*100)/100:"", i===0?Math.round(g.total):""]);
      });
    });
    var T=G.reduce(function(s,g){return {n:s.n+g.list.length,m2:s.m2+g.m2,t:s.t+g.total};},{n:0,m2:0,t:0});
    body.push(["ИТОГО","квартир: "+T.n,"","","","","","","",Math.round(T.m2*100)/100,Math.round(T.t)]);
    download("sebiston-itog-prodazh-"+f(root,"mon").value+".csv", csvText(head, body));
  });

  function render(){
    var D=pick(), G=byMgr(D);
    var T={n:0,m2:0,total:0,paid:0};
    G.forEach(function(g){ T.n+=g.list.length; T.m2+=g.m2; T.total+=g.total; T.paid+=g.paid; });
    f(root,"stats").innerHTML=
      '<div class="stat"><div class="n">'+T.n+'</div><div class="t">квартир</div></div>'+
      '<div class="stat"><div class="n">'+r2(T.m2)+'</div><div class="t">общий объём, м²</div></div>'+
      '<div class="stat money"><div class="n">'+money(T.total)+'</div><div class="t">общая сумма</div></div>'+
      '<div class="stat"><div class="n">'+money(T.paid)+'</div><div class="t">внесено</div></div>'+
      '<div class="stat"><div class="n">'+money(T.total-T.paid)+'</div><div class="t">остаток</div></div>';

    var w=f(root,"tblw");
    if(!G.length){ w.innerHTML='<div class="empty" style="border:0"><b>Квартир за месяц нет</b>Добавьте первую через форму выше.</div>'; }
    else{
      var html='<table class="report"><thead><tr><th>ФИО менеджера</th><th>Объект</th><th>Блок</th><th class="num">Этаж</th>'+
        '<th class="num">Площадь м²</th><th>Сумма по квартире</th><th class="num">Общий объём, м²</th><th class="num">Общая сумма</th><th></th></tr></thead><tbody>';
      G.forEach(function(g){
        var n=g.list.length;
        g.list.forEach(function(d,i){
          html+='<tr class="'+(i===0?"grp-first":"")+'">';
          if(i===0) html+='<td rowspan="'+n+'" class="grp"><b>'+esc(g.mgr)+'</b></td>';
          html+='<td>'+esc(d.object)+(d.status==="Бронь"?' <span class="badge bron">бронь</span>':'')+'</td>'+
            '<td>'+esc(d.block||"—")+'</td><td class="num">'+esc(d.floor||"—")+'</td><td class="num">'+r2(d.area)+'</td>'+
            '<td>'+(d.method?esc(d.method)+" — ":"")+money(d.total)+(d.paid&&d.paid<d.total?'<br><span class="hint">внесено '+money(d.paid)+'</span>':'')+'</td>';
          if(i===0) html+='<td rowspan="'+n+'" class="num grp">'+r2(g.m2)+'</td><td rowspan="'+n+'" class="num grp"><b>'+money(g.total)+'</b></td>';
          html+='<td><button class="lnk" data-del="'+d.id+'">удалить</button></td></tr>';
        });
      });
      html+='</tbody><tfoot><tr><td>ИТОГО</td><td colspan="3">квартир: '+T.n+'</td><td></td><td></td>'+
        '<td class="num">'+r2(T.m2)+'</td><td class="num">'+money(T.total)+'</td><td></td></tr></tfoot></table>';
      w.innerHTML=html;
      w.onclick=function(ev){
        var b=ev.target.closest("[data-del]"); if(!b) return;
        if(delDeal(b.dataset.del)){ render(); toast("Квартира удалена"); }
      };
    }

    function slice(key, box, label){
      var m={};
      D.forEach(function(d){ var k=d[key]||"не указан"; var r=m[k]||(m[k]={n:0,m2:0,total:0}); r.n++; r.m2+=d.area; r.total+=d.total; });
      var ks=Object.keys(m).sort(function(a,b){return m[b].total-m[a].total;});
      if(!ks.length){ f(root,box).innerHTML='<div class="empty" style="border:0">Нет данных</div>'; return; }
      f(root,box).innerHTML='<table><thead><tr><th>'+esc(label)+'</th><th class="num">Квартир</th><th class="num">м²</th><th class="num">Сумма</th></tr></thead><tbody>'+
        ks.map(function(k){ return '<tr><td class="wrap">'+esc(k)+'</td><td class="num">'+m[k].n+'</td><td class="num">'+r2(m[k].m2)+'</td><td class="num">'+money(m[k].total)+'</td></tr>'; }).join("")+'</tbody></table>';
    }
    slice("object","objw","Объект");
    slice("method","metw","Метод");
  }
  root._render=render; render();
}

/* ==================================================================
   ВКЛАДКИ
   ================================================================== */
var PANELS = {
  call:  {node:$("p-call"),   init:function(n){initLeadPanel(n,"call");}},
  office:{node:$("p-office"), init:function(n){initLeadPanel(n,"office");}},
  sales: {node:$("p-sales"),  init:initSales},
  time:  {node:$("p-time"),   init:initTime},
  rday:  {node:$("p-rday"),   init:initRDay},
  rmgr:  {node:$("p-rmgr"),   init:initRMgr},
  rsale: {node:$("p-rsale"),  init:initRSale}
};
var current="call";
function open(key){
  Object.keys(PANELS).forEach(function(k){ PANELS[k].node.hidden = (k!==key); });
  Array.prototype.forEach.call($("tabs").querySelectorAll(".tab"),function(b){
    b.setAttribute("aria-selected", b.dataset.p===key ? "true":"false");
  });
  current=key;
  var p=PANELS[key];
  if(!p.node.dataset.ready){ p.init(p.node); p.node.dataset.ready="1"; }
  else if(p.node._render) p.node._render();
  window.scrollTo({top:0});
}
$("tabs").addEventListener("click", function(ev){
  var b=ev.target.closest(".tab"); if(!b) return; open(b.dataset.p);
});
function refreshAll(){
  Object.keys(PANELS).forEach(function(k){
    var n=PANELS[k].node;
    if(n.dataset.ready && n._render) n._render();
  });
}

/* ==================================================================
   ПОДКЛЮЧЕНИЕ ОБЩЕЙ БАЗЫ
   ================================================================== */
function merge(arrName, docs){
  var seen={}; S[arrName].forEach(function(x){seen[x.id]=1;});
  var added=0;
  docs.forEach(function(d){ if(d&&d.id&&!seen[d.id]){ S[arrName].push(d); seen[d.id]=1; added++; } });
  S[arrName].sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
  if(added) persist();
  return added;
}
async function connect(){
  if(!window.claude || typeof window.claude.use!=="function"){
    $("sync").textContent="Записи хранятся только в этом браузере."; return;
  }
  try{ userCap=await window.claude.use("user"); }catch(e){}
  try{ dlCap=await window.claude.use("downloads"); }catch(e){}
  try{ db=await window.claude.use("db"); }catch(e){ db=null; }
  if(userCap){ try{ var me=await userCap.me(); if(me&&me.name) $("who").textContent=me.name; }catch(e){} }
  if(!db){ $("sync").textContent="Общая база недоступна — записи хранятся только в этом браузере."; return; }
  $("sync").textContent="Общая база подключена: записи видны всем менеджерам.";
  try{
    db.collection("ovr").onSnapshot(function(snap){
      var ch=false;
      (snap&&snap.docs?snap.docs:[]).forEach(function(d){
        var v=d.data?d.data():d;
        if(v&&v.id==="all"&&v.map&&typeof v.map==="object"){ Object.assign(S.ovr,v.map); ch=true; }
      });
      if(ch){ persist(); refreshAll(); }
    });
  }catch(e){}
  try{
    db.collection("results").onSnapshot(function(snap){
      var ch=false;
      (snap&&snap.docs?snap.docs:[]).forEach(function(d){ var v=d.data?d.data():d; if(v&&v.id&&v.map){ S.results[v.id]=v.map; ch=true; } });
      if(ch){ persist(); refreshAll(); }
    });
  }catch(e){}
  [["leads","leads"],["deals","deals"],["tlog","tlog"],["daily","daily"]].forEach(function(p){
    try{
      db.collection(p[0]).onSnapshot(function(snap){
        var docs=[];
        (snap&&snap.docs?snap.docs:[]).forEach(function(d){ var v=d.data?d.data():d; if(v&&v.id) docs.push(v); });
        if(docs.length && merge(p[1],docs)) refreshAll();
      });
    }catch(e){}
  });
}

/* ==================================================================
   СТАРТ
   ================================================================== */
restore();
open("call");
connect();

})();
</script>
