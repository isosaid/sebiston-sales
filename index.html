<style>
:root{
  --paper:#F7F8F5; --card:#FFFFFF; --ink:#14281F; --ink-2:#4A5C51; --ink-3:#7B8A81;
  --line:#DCE3DC; --line-2:#EDF0EC;
  --green:#0E6D23; --green-d:#0A5019; --green-soft:#E7F1E9; --brand:#0E6D23;
  --amber:#B45309; --amber-soft:#FBF0E2;
  --red:#A32B2B; --red-soft:#F8EAEA;
  --focus:#0E6D23;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1712; --card:#16211B; --ink:#E8EFE9; --ink-2:#A9B8AE; --ink-3:#7E8F84;
    --line:#2A3A31; --line-2:#1E2C24;
    --green:#4CBF6C; --green-d:#7FD69A; --green-soft:#1B3325; --brand:#6FCB84;
    --amber:#E0A458; --amber-soft:#332613;
    --red:#E07A7A; --red-soft:#33201F;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1712;--card:#16211B;--ink:#E8EFE9;--ink-2:#A9B8AE;--ink-3:#7E8F84;
  --line:#2A3A31;--line-2:#1E2C24;--green:#4CBF6C;--green-d:#7FD69A;--green-soft:#1B3325;--brand:#6FCB84;
  --amber:#E0A458;--amber-soft:#332613;--red:#E07A7A;--red-soft:#33201F;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Golos Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* шапка */
.top{position:sticky;top:0;z-index:40;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 18px 0;display:flex;align-items:center;gap:12px}
.mark{display:flex;align-items:center}
.mark .logo{height:28px;width:auto;display:block}
.mark .logo path{fill:var(--brand)}
@media (max-width:480px){.mark .logo{height:22px}}
.who{margin-left:auto;font-size:13px;color:var(--ink-3);text-align:right;line-height:1.3}
.tabs{max-width:1080px;margin:0 auto;padding:10px 18px 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.tabs::-webkit-scrollbar{height:0}
.tab{
  appearance:none;border:0;background:none;padding:0 10px 10px;cursor:pointer;font:inherit;
  font-size:14.5px;font-weight:600;color:var(--ink-3);white-space:nowrap;
  border-bottom:2px solid transparent;margin-bottom:-1px;
}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.tabsep{flex:none;width:1px;background:var(--line);margin:0 8px 12px;align-self:stretch}

main{max-width:1080px;margin:0 auto;padding:22px 18px 40px}
.panel[hidden]{display:none}
.lede{font-size:14px;color:var(--ink-3);margin:0 0 20px;max-width:70ch;line-height:1.5}
.lede b{color:var(--ink-2);font-weight:600}

.cols{display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:start}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}

.block{margin:0 0 24px}
.block-h{display:flex;align-items:baseline;gap:10px;margin:0 0 13px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.block-h h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.block-h .note{font-size:12.5px;color:var(--ink-3);margin-left:auto}

.field{margin:0 0 14px}
label.lbl{display:block;font-size:13.5px;font-weight:500;color:var(--ink-2);margin:0 0 6px}
.req{color:var(--green);font-weight:600}

input[type=text],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=month],input[type=password],input[type=search],textarea,select{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;
}
textarea{resize:vertical;min-height:68px;line-height:1.4}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--green)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input[aria-invalid="true"]{border-color:var(--red);background:var(--red-soft)}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  appearance:none;font:inherit;font-size:14px;font-weight:500;cursor:pointer;
  background:var(--card);color:var(--ink-2);border:1px solid var(--line);
  border-radius:999px;padding:7px 13px;transition:background .12s,border-color .12s,color .12s;
}
.chip:hover{border-color:var(--ink-3)}
.chip:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green);color:var(--green-d);font-weight:600}
.chip.hot[aria-pressed="true"]{background:var(--amber-soft);border-color:var(--amber);color:var(--amber)}
.chip.no[aria-pressed="true"]{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.chips.invalid{outline:2px solid var(--red);outline-offset:4px;border-radius:12px}

.hint{font-size:12.5px;color:var(--ink-3);margin:6px 0 0}
.err{font-size:13px;color:var(--red);margin:6px 0 0;font-weight:500}
.err[hidden]{display:none}
.dup{display:flex;gap:10px;align-items:flex-start;margin:8px 0 0;padding:10px 12px;background:var(--amber-soft);border:1px solid var(--amber);border-radius:10px;font-size:13.5px;line-height:1.4}
.dup[hidden]{display:none}
.dup b{color:var(--amber)}
.cond{margin:12px 0 0;padding:13px;border-radius:12px;background:var(--line-2);border:1px solid var(--line)}
.cond[hidden]{display:none}
.other{margin-top:10px}
.check{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:14.5px;color:var(--ink-2);margin:8px 0 0}
.check input{width:19px;height:19px;accent-color:var(--green);margin:0;flex:none}

.btn{appearance:none;font:inherit;font-size:15px;font-weight:600;cursor:pointer;border-radius:10px;padding:11px 20px;border:1px solid transparent;white-space:nowrap}
.btn-main{background:var(--green);color:#fff}
.btn-main:hover{background:var(--green-d)}
.btn-ghost{background:transparent;color:var(--ink-2);border-color:var(--line)}
.btn-ghost:hover{border-color:var(--ink-3);color:var(--ink)}
.btn-sm{font-size:13.5px;padding:7px 13px;border-radius:9px}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.actions{display:flex;gap:10px;align-items:center;margin:4px 0 0}
.actions .sum{font-size:12.5px;color:var(--ink-3);flex:1;min-width:0;line-height:1.3}

/* вычисленное значение */
.calc{
  display:flex;align-items:baseline;gap:10px;padding:11px 13px;border-radius:10px;
  background:var(--green-soft);border:1px solid var(--green);margin:0 0 14px;flex-wrap:wrap;
}
.calc .k{font-size:13px;color:var(--green-d)}
.calc .v{font-size:19px;font-weight:700;letter-spacing:-.02em;color:var(--green-d);margin-left:auto}

/* таблицы */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line-2);vertical-align:top;white-space:nowrap}
thead th{background:var(--green-d);color:#fff;font-weight:600;font-size:12.5px;position:sticky;top:0}
:root[data-theme="dark"] thead th{color:#0F1712}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) thead th{color:#0F1712}}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--line-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:180px}
tfoot td{font-weight:700;background:var(--line-2);border-top:2px solid var(--line)}
.flagged{background:var(--amber-soft)!important}
.flagged td:first-child::after{content:" ⚑";color:var(--amber)}

.tab[hidden],.tabsep[hidden]{display:none!important}
.badge{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--green-soft);color:var(--green-d);display:inline-block}
.badge.hot{background:var(--amber-soft);color:var(--amber)}
.badge.no{background:var(--red-soft);color:var(--red)}
.badge.bron{background:var(--amber-soft);color:var(--amber)}

.stats{display:flex;gap:20px;flex-wrap:wrap;padding:14px 15px;margin:0 0 16px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.stat .n{font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.stat .t{font-size:12.5px;color:var(--ink-3)}
.stat.hot .n{color:var(--amber)}
.stat.money .n{color:var(--green-d)}

.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 16px}
.tools input[type=text]{flex:1;min-width:160px}
.tools input[type=month],.tools input[type=date],.tools select{width:auto;min-width:150px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:0 12px}
.formgrid .field{margin-bottom:12px}
.formgrid .span2{grid-column:span 2}
.formgrid .span3{grid-column:span 3}
@media (max-width:560px){.formgrid .span2,.formgrid .span3{grid-column:1/-1}}
.block.entry{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px}
table.report td.grp{background:var(--line-2);vertical-align:middle}
table.report tr.grp-first td{border-top:2px solid var(--line)}
table.report tbody tr:first-child td{border-top:0}

.empty{border:1px dashed var(--line);border-radius:12px;padding:32px 22px;text-align:center;color:var(--ink-3);font-size:14px;line-height:1.55}
.empty b{display:block;color:var(--ink);font-size:15.5px;font-weight:600;margin:0 0 6px}

.warn{
  display:flex;gap:10px;align-items:flex-start;margin:0 0 16px;padding:12px 14px;
  background:var(--amber-soft);border:1px solid var(--amber);border-radius:11px;font-size:13.5px;line-height:1.5;
}
.warn b{color:var(--amber)}
.warn[hidden]{display:none}

/* полоса доли времени */
.bar-track{height:7px;border-radius:999px;background:var(--line-2);overflow:hidden;min-width:90px;display:block}
.bar-fill{height:100%;background:var(--green);display:block;border-radius:999px}
.bar-fill.warnc{background:var(--amber)}

.sync{font-size:12.5px;color:var(--ink-3);margin:0 0 16px}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);z-index:60;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  background:var(--green-d);color:#fff;font-size:14.5px;font-weight:500;padding:11px 18px;border-radius:999px;
  box-shadow:0 6px 24px rgba(20,40,31,.25);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;
  max-width:calc(100% - 36px);text-align:center;
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.lnk{appearance:none;background:none;border:0;padding:0;font:inherit;font-size:12.5px;color:var(--red);cursor:pointer;text-decoration:underline}
.lnk:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.lnk.ok{color:var(--green-d)}
input.cell{
  width:100%;min-width:62px;font:inherit;font-size:13.5px;color:var(--ink);
  background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 6px;
  font-variant-numeric:tabular-nums;
}
input.cell:hover{border-color:var(--line)}
input.cell:focus-visible{outline:2px solid var(--focus);outline-offset:0;border-color:var(--green);background:var(--card)}
input.cell.n{text-align:right}
input.cell.edited{background:var(--amber-soft);border-color:var(--amber);color:var(--amber);font-weight:600}
td.has-auto{position:relative}
.auto{display:block;font-size:11px;color:var(--ink-3);text-align:right;margin-top:1px}
.legend{font-size:12.5px;color:var(--ink-3);margin:0 0 14px;line-height:1.5;max-width:80ch}
.legend .sw{display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--amber-soft);border:1px solid var(--amber);vertical-align:-1px;margin-right:4px}

/* вход */
html.locked .top, html.locked main{display:none}
.login{display:none;min-height:100vh;min-height:100dvh;align-items:center;justify-content:center;padding:24px 18px}
html.locked .login{display:flex}
.login-card{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 24px}
.login-card .logo{height:30px;width:auto;display:block;margin:0 0 22px}
.login-card .logo path{fill:var(--brand)}
.login-card h1{font-size:19px;margin:0 0 4px;font-weight:700}
.login-card p.sub{font-size:13.5px;color:var(--ink-3);margin:0 0 20px}
.login-card .btn{width:100%;margin-top:6px}
.logout{appearance:none;border:1px solid var(--line);background:none;color:var(--ink-2);font:inherit;font-size:12.5px;border-radius:8px;padding:5px 10px;cursor:pointer;margin-left:10px}
.logout:hover{border-color:var(--ink-3);color:var(--ink)}
.logout:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ===== адаптация под размер экрана ===== */
.chip{max-width:100%;overflow-wrap:anywhere;text-align:left;min-height:36px}
.block-h{flex-wrap:wrap}
.actions{flex-wrap:wrap}
.tools>*{max-width:100%}
.stats{row-gap:12px}
/* большие мониторы — шире рабочая область */
@media (min-width:1400px){ main,.top-in,.tabs{max-width:1320px} .cols{grid-template-columns:minmax(0,460px) minmax(0,1fr)} }
@media (min-width:1900px){ main,.top-in,.tabs{max-width:1560px} }
.cols-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
@media (max-width:700px){.cols-2{grid-template-columns:minmax(0,1fr)}}
/* планшеты */
@media (max-width:860px){ main{padding:18px 16px 36px} }
/* телефоны */
@media (max-width:600px){
  main{padding:16px 14px 32px}
  .top-in{padding:10px 14px 0}
  .tabs{padding:6px 10px 0;gap:4px 0;flex-wrap:wrap;overflow:visible}
  .tab{font-size:14px;padding:0 8px 9px}
  .tabsep{display:none}
  .bar-track{min-width:50px}
  th,td{padding:8px 9px}
  .who{font-size:12px}
  .logout{padding:6px 10px;margin-left:8px}
  .chip{font-size:14px;padding:8px 12px;min-height:40px}
  .btn{min-height:46px}
  .actions .btn{flex:1 1 auto}
  .actions .sum{flex:1 1 100%;order:-1}
  .tools{gap:8px}
  .tools input[type=text],.tools input[type=month],.tools input[type=date],.tools select{flex:1 1 100%;width:100%;min-width:0}
  .tools .btn{flex:1 1 auto}
  .stats{gap:14px;padding:12px}
  .stat .n{font-size:20px}
  .stats>*{flex:1 1 28%}
  .formgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{flex-wrap:wrap}
  .row>*{flex:1 1 130px}
  .login-card{padding:24px 18px}
}
@media (max-width:360px){ .tab{font-size:13.5px;padding:0 6px 9px} .stats>*{flex:1 1 40%} }

/* форма «Новый день» */
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.dsec{background:var(--paper);border:1px solid var(--line-2);border-radius:12px;padding:14px 16px 4px;min-width:0}
.dsec.d-date{grid-column:1/-1;background:none;border:0;padding:0}
.dsec.d-date .field{max-width:220px;margin:0}
.dsec-h{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px}
.dg{display:grid;gap:0 12px;align-items:start}
.dg-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.dg-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.dg-num{grid-template-columns:minmax(80px,110px) minmax(0,1fr)}
.dg .full{grid-column:1/-1}
.dg .field{margin-bottom:12px;min-width:0}
.dg .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dg input{min-width:0}
.dg input[type=number]{font-variant-numeric:tabular-nums}
.dg .hint:empty{display:none}
@media (max-width:760px){.dgrid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:600px){.dg-names{grid-template-columns:minmax(0,1fr)}}
@media (max-width:360px){.dg-3{grid-template-columns:repeat(3,minmax(0,1fr));gap:0 6px}.dsec{padding:12px 10px 2px}}

/* ===== фильтр списков ===== */
input[type=search]{-webkit-appearance:none;appearance:none}
input[type=search]::-webkit-search-cancel-button{cursor:pointer}
.fbar{display:flex;flex-direction:column;gap:10px;margin:0 0 14px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.fsearch{position:relative}
.fsearch svg{position:absolute;left:12px;top:50%;width:17px;height:17px;transform:translateY(-50%);fill:none;stroke:var(--ink-3);stroke-width:1.8;stroke-linecap:round;pointer-events:none}
.fsearch input{padding-left:38px}
.fline{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.frange{display:flex;align-items:center;gap:6px;flex:1 1 290px;min-width:0}
.frange span{font-size:13px;color:var(--ink-3);white-space:nowrap}
.frange input{flex:1 1 0;min-width:0;padding:8px 10px;font-size:15px}
.fline select{width:auto;flex:1 1 140px;min-width:0;padding:8px 10px;font-size:15px}
.fline .btn{flex:none}
.fpresets{display:flex;flex-wrap:wrap;gap:6px}
.fp{appearance:none;font:inherit;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:var(--paper);color:var(--ink-2);border-radius:999px;padding:5px 11px;cursor:pointer}
.fp:hover{border-color:var(--ink-3)}
.fp[aria-pressed="true"]{background:var(--green-soft);border-color:var(--green);color:var(--green-d);font-weight:600}
.fp:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.fmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3)}
/* правка записи */
.editbar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:11px 13px;margin:0 0 16px;border-radius:12px;background:var(--amber-soft);border:1px solid var(--amber);font-size:13.5px;line-height:1.35}
.editbar b{color:var(--amber)}
.editbar .who2{color:var(--ink-2)}
tr.editing td{background:var(--amber-soft)}
.rowact{white-space:nowrap}
.rowact .lnk+.lnk{margin-left:12px}
.lnk.ed{color:var(--green-d)}
.upd{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
/* отмена удаления */
.toast.act{pointer-events:auto}
.toast .undo{appearance:none;background:rgba(255,255,255,.2);border:0;color:#fff;font:inherit;font-weight:700;border-radius:999px;padding:4px 11px;margin-left:10px;cursor:pointer}
@media (max-width:600px){
  .fbar{padding:10px}
  .frange{flex:1 1 100%}
  .fline select{flex:1 1 45%}
  .fline .btn{flex:1 1 100%}
  .rowact .lnk{padding:6px 0}
}

/* кнопки «изменить / удалить» всегда видны справа, даже в широкой таблице */
.tbl-wrap td.rowact{position:sticky;right:0;background:var(--card);box-shadow:-10px 0 10px -10px rgba(20,40,31,.25)}
.tbl-wrap tr.editing td.rowact{background:var(--amber-soft)}
.tbl-wrap tr.flagged td.rowact{background:inherit}

.expgrp{display:inline-flex;gap:6px;flex:none}
@media (max-width:600px){ .expgrp{flex:1 1 100%} .expgrp .btn{flex:1 1 0} }

/* ===== переключатель темы ===== */
.theme-sw{position:relative;flex:none;display:inline-flex;align-items:center;justify-content:space-between;width:64px;height:32px;padding:0 8px;margin-left:10px;
  border:1px solid var(--line);border-radius:999px;background:var(--paper);cursor:pointer;-webkit-tap-highlight-color:transparent}
.theme-sw:hover{border-color:var(--ink-3)}
.theme-sw:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ts-ic{position:relative;z-index:1;width:16px;height:16px;display:grid;place-items:center;transition:color .25s}
.ts-ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ts-moon svg{fill:currentColor;stroke:none}
.ts-sun{color:#fff}.ts-moon{color:var(--ink-3)}
.ts-knob{position:absolute;top:3px;left:3px;width:26px;height:24px;border-radius:999px;background:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .28s cubic-bezier(.3,.7,.3,1),background .25s}
.theme-sw[aria-checked="true"] .ts-knob{transform:translateX(30px)}
.theme-sw[aria-checked="true"] .ts-sun{color:var(--ink-3)}
.theme-sw[aria-checked="true"] .ts-moon{color:#0F1712}
.login-card{position:relative}
.login-card .theme-sw{position:absolute;top:18px;right:18px;margin:0}
html.theme-anim, html.theme-anim *{transition:background-color .3s ease,border-color .3s ease,color .3s ease!important}
@media (prefers-reduced-motion: reduce){.ts-knob{transition:none}html.theme-anim,html.theme-anim *{transition:none!important}}
@media (max-width:600px){.theme-sw{width:58px;height:30px;margin-left:8px}.ts-knob{width:23px;height:22px}.theme-sw[aria-checked="true"] .ts-knob{transform:translateX(27px)}}

/* ===== тёмная тема: доводка контраста ===== */
a{color:var(--green-d)}
@media (prefers-color-scheme: dark){
:root:not([data-theme="light"]) thead th{background:#1D3527;color:#E8EFE9;border-bottom:1px solid #2F4A39}

}
:root[data-theme="dark"] thead th{background:#1D3527;color:#E8EFE9;border-bottom:1px solid #2F4A39}

:root[data-theme="dark"] .tbl-wrap tr.editing td,.tbl-wrap tr.editing td.rowact{background:#2E2715}
:root[data-theme="dark"] .dsec{background:#122019}

.sync[data-state]{display:inline-flex;align-items:center;gap:7px}
.sync[data-state]::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.sync[data-state="busy"]::before{background:var(--ink-3)}
.sync[data-state="off"]{color:var(--amber)}
.sync[data-state="off"]::before{background:var(--amber)}

/* окно «Файл готов» */
.dlbox{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:20px;background:rgba(10,20,14,.45);backdrop-filter:blur(2px)}
.dlcard{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.25);display:grid;grid-template-columns:auto 1fr;gap:10px 14px;align-items:center}
.dlico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;background:var(--brand)}
.dl-xlsx{background:#1D6F42}.dl-docx{background:#2B579A}
.dlbody h3{margin:0 0 2px;font-size:17px}
.dlname{margin:0;font-size:13.5px;color:var(--ink-2);word-break:break-word}
.dlmeta{margin:2px 0 0;font-size:12px;color:var(--ink-3)}
.dlbtn{grid-column:1/-1;display:flex;align-items:center;justify-content:center;text-decoration:none;min-height:46px;margin-top:6px}
.dlclose{grid-column:1/-1}
.dlhint{grid-column:1/-1;margin:2px 0 0;font-size:12px;color:var(--ink-3);text-align:center}

#updbar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:300;display:flex;gap:12px;align-items:center;
  background:var(--brand);color:#fff;padding:10px 12px 10px 16px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;max-width:calc(100% - 24px)}
#updbar button{appearance:none;border:0;border-radius:999px;background:#fff;color:#0E6D23;font:inherit;font-weight:700;padding:7px 14px;cursor:pointer}

.dlother{grid-column:1/-1;justify-self:center;font-size:13px;padding:4px 6px}

#hbar{position:fixed;bottom:0;z-index:40;overflow-x:auto;overflow-y:hidden;height:16px;display:none;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 10px -6px rgba(20,40,31,.3);border-radius:0 0 12px 12px}
#hbar div{height:1px}
@media (pointer:coarse){#hbar{display:none!important}}
</style>

<script>
/* Адрес общей базы (Google Apps Script). Пусто — записи только в браузере. */
window.SB_API="https://script.google.com/macros/s/AKfycbwks7urRdEQoYMv50LhP5YDIWNcMUBQ8n-CxYqG590dCWd8Zzv_gAmT_2sDPI2hCAdG/exec";
</script>
<script>
(function(){try{var t=localStorage.getItem("sb_theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>
<script>
/* автообновление: сайт сам замечает новую версию (при открытии, каждые 3 минуты и при возврате на вкладку) */
(function(){try{
  var mine=(document.querySelector('meta[name="build"]')||{}).content, shown=false;
  function fresh(b){ location.replace(location.pathname+"?v="+b); }
  function banner(b){
    if(shown) return; shown=true;
    var d=document.createElement("div"); d.id="updbar"; d.setAttribute("role","status");
    d.innerHTML='<span>Вышла новая версия сайта.</span> <button type="button">Обновить</button>';
    d.querySelector("button").onclick=function(){ fresh(b); };
    document.addEventListener("DOMContentLoaded",function(){ document.body.appendChild(d); });
    if(document.body) document.body.appendChild(d);
  }
  function check(first){
    fetch(location.pathname.split("?")[0],{cache:"no-cache"}).then(function(r){return r.text();}).then(function(t){
      var m=t.match(/<meta name="build" content="([^"]+)"/); if(!m||m[1]===mine) return;
      if(first && sessionStorage.getItem("sb_reload")!==m[1]){ sessionStorage.setItem("sb_reload",m[1]); fresh(m[1]); return; }
      banner(m[1]);
    }).catch(function(){});
  }
  check(true);
  setInterval(function(){ if(!document.hidden) check(false); },180000);
  document.addEventListener("visibilitychange",function(){ if(!document.hidden) check(false); });
}catch(e){}})();
</script>
<script>
(function(){try{var a=JSON.parse(localStorage.getItem("sb_auth")||"null");if(!a||!a.exp||a.exp<Date.now()||(window.SB_API&&!a.t))document.documentElement.classList.add("locked");}catch(e){document.documentElement.classList.add("locked");}})();
</script>

<script>
(function(){
"use strict";

/* ============ справочники ============ */
/* убраны из отдела — не показываются нигде, даже если остались в списке сотрудников */
var EX_MGRS = ["Зарина","Заррина","Адам","Асламджон"];
/* другие написания имени одного и того же менеджера → основное имя */
var MGR_ALIAS = {"Зарина":"Олимова З.","Заррина":"Олимова З."};
function fixAliases(){
  ["leads","deals","tlog","daily"].forEach(function(c){ (S[c]||[]).forEach(function(x){ if(x && MGR_ALIAS[x.mgr]) x.mgr=MGR_ALIAS[x.mgr]; }); });
  Object.keys(S.results||{}).forEach(function(k){
    var p=k.split("|"); if(p.length===2 && MGR_ALIAS[p[1]]){ var nk=p[0]+"|"+MGR_ALIAS[p[1]]; if(!S.results[nk]) S.results[nk]=S.results[k]; delete S.results[k]; }
  });
}
function exMgr(list){ return (list||[]).filter(function(n){ return EX_MGRS.indexOf(n)<0; }); }
var MGRS = exMgr(["Азиз","Амира","Бахора","Гесу","Манижа","Нозия","Фарзона","Фарход"]);
/* список менеджеров приходит с сервера (лист «Пользователи»); здесь — последний известный */
(function(){ try{ var st=exMgr(JSON.parse(localStorage.getItem("sebiston.staff")||"null")); if(st && st.length) MGRS=st; }catch(e){} })();
var OBJECTS = ["Бульвар Скандинавия","ADDRESS Residence","Ахрори","Пулоди","Гиссар Молл","Варзоб Ривьера"];
var TOPICS = ["Квадратуры и цены","Рассрочка","Ипотека","Полная оплата","Коммерческое помещение","Другое"];
var STAGES = ["Горячий","Потенциальный","Думает","Отказ"];
var REJECTS = ["Высокая цена","Нет нужной площади","Нет нижних этажей","Локация не подошла","Клиент не в Таджикистане","Другое"];
var METHODS = ["Ипотека","Рассрочка","Полная оплата","Наличные"];
var CATS = ["Работа с лидами","Звонки","Встречи / показы","Переговоры / работа с клиентом","CRM и отчётность","Совещания","Административная работа","Ожидание / простой","Перерывы","Прочее"];
var IDLE = ["Ожидание / простой","Перерывы"];
var CITIES = [
 ["Душанбе","Таджикистан"],["Худжанд","Таджикистан"],["Бохтар","Таджикистан"],["Куляб","Таджикистан"],
 ["Истаравшан","Таджикистан"],["Исфара","Таджикистан"],["Канибадам","Таджикистан"],["Пенджикент","Таджикистан"],
 ["Турсунзаде","Таджикистан"],["Вахдат","Таджикистан"],["Гиссар","Таджикистан"],["Рудаки","Таджикистан"],
 ["Яван","Таджикистан"],["Нурек","Таджикистан"],["Дангара","Таджикистан"],["Шахринав","Таджикистан"],
 ["Файзабад","Таджикистан"],["Рогун","Таджикистан"],["Бустон","Таджикистан"],["Левакант","Таджикистан"],
 ["Спитамен","Таджикистан"],["Зафарабад","Таджикистан"],["Ашт","Таджикистан"],["Восе","Таджикистан"],
 ["Фархор","Таджикистан"],["Хорог","Таджикистан"],["Рашт","Таджикистан"],
 ["Москва","Россия"],["Санкт-Петербург","Россия"],["Екатеринбург","Россия"],["Новосибирск","Россия"],
 ["Казань","Россия"],["Нижний Новгород","Россия"],["Самара","Россия"],["Красноярск","Россия"],
 ["Тюмень","Россия"],["Сургут","Россия"],["Краснодар","Россия"],["Ростов-на-Дону","Россия"],
 ["Уфа","Россия"],["Челябинск","Россия"],["Пермь","Россия"],["Воронеж","Россия"],["Волгоград","Россия"],
 ["Дубай","ОАЭ"],["Абу-Даби","ОАЭ"],["Стамбул","Турция"],["Алматы","Казахстан"],["Астана","Казахстан"],
 ["Ташкент","Узбекистан"],["Бишкек","Кыргызстан"],["Кабул","Афганистан"]
];
var RESULT_FIELDS = [
 ["newLeads","Новых лидов получено"],["worked","Лидов обработано"],["outCalls","Исходящих звонков"],
 ["contacts","Состоявшихся контактов"],["meetSet","Назначено встреч"],["meetHeld","Проведено встреч"],
 ["shows","Проведено показов"],["repeat","Повторных контактов"],["bron","Брони"],["deals","Договоров"]
];

/* ============ состояние ============ */
var S = { leads:[], deals:[], tlog:[], daily:[], results:{}, ovr:{} };
var LS = "sebiston.sales.v2";
var LS_MGR = "sebiston.mgr";
/* кто вошёл на сайт — записывается в «Менеджер» для звонков и офиса */
/* роли: admin — может удалять; manager — только добавлять и исправлять */
var ADMINS=["saidov","manuchehr"];
function authSess(){ try{ return JSON.parse(localStorage.getItem("sb_auth")||"null")||{}; }catch(e){ return {}; } }
function authRole(){ var a=authSess(); return a.r || (ADMINS.indexOf(a.u)>=0 ? "admin" : "manager"); }
function canDelete(){ return authRole()==="admin"; }
function delBtn(id){ return canDelete() ? '<button class="lnk" data-del="'+id+'">удалить</button>' : ''; }
function authName(){ try{ var a=JSON.parse(localStorage.getItem("sb_auth")||"null"); return a&&a.n?a.n:""; }catch(e){ return ""; } }
var db=null, userCap=null, dlCap=null;

function lsGet(k){ try{return localStorage.getItem(k);}catch(e){return null;} }
function lsSet(k,v){ try{localStorage.setItem(k,v);}catch(e){} }
function persist(){ lsSet(LS, JSON.stringify(S)); }
/* менеджер видит только свои записи, руководитель — все */
function own(arr){
  if(!Array.isArray(arr)) return [];
  var a=authSess(); if(!a.t || a.r==="admin") return arr;
  var me=a.n||""; return arr.filter(function(x){ return x && x.mgr===me; });
}
function restore(){
  var raw = lsGet(LS); if(!raw) return;
  try{
    var o = JSON.parse(raw);
    if(o && typeof o==="object"){
      S.leads = Array.isArray(o.leads)?o.leads:[];
      S.deals = Array.isArray(o.deals)?o.deals:[];
      S.tlog  = Array.isArray(o.tlog)?o.tlog:[];
      S.results = o.results && typeof o.results==="object" ? o.results : {};
      S.ovr = o.ovr && typeof o.ovr==="object" ? o.ovr : {};
      S.daily = Array.isArray(o.daily)?o.daily:[];
      fixAliases();
      ["leads","deals","tlog","daily"].forEach(function(c){ S[c]=own(S[c]); });
    }
  }catch(e){}
}

/* ============ утилиты ============ */
function $(id){ return document.getElementById(id); }
function el(html){ var d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
function digits(s){ return (s||"").replace(/\D+/g,""); }
function pad(n){ return n<10?"0"+n:""+n; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function uid(){ return String(Date.now())+"-"+Math.random().toString(36).slice(2,8); }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function nowHM(){ var d=new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function thisMonth(){ return todayISO().slice(0,7); }
var MON=["янв","фев","мар","апр","мая","июн","июл","авг","сен","окт","ноя","дек"];
function fmtDate(iso){ if(!iso) return ""; var p=iso.split("-"); if(p.length!==3) return iso; return parseInt(p[2],10)+" "+MON[parseInt(p[1],10)-1]; }
function num(v){ var n=parseFloat(String(v).replace(",",".")); return isFinite(n)?n:0; }
function money(n){ return Math.round(n).toLocaleString("ru-RU")+" $"; }
function area(n){ return (Math.round(n*100)/100).toLocaleString("ru-RU")+" м²"; }
function toast(m){ var t=$("toast"); t.textContent=m; t.classList.remove("act"); t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove("on");},2600); }
function mins(hm){ if(!hm) return null; var p=hm.split(":"); if(p.length<2) return null; return parseInt(p[0],10)*60+parseInt(p[1],10); }
function hhmm(m){ if(m==null) return "—"; var s=m<0?"-":""; m=Math.abs(m); return s+Math.floor(m/60)+" ч "+pad(m%60)+" мин"; }

function chipsHTML(name, list, sel, cls){
  return '<div class="chips" data-g="'+name+'" role="group">'+list.map(function(v){
    var extra = cls && cls[v] ? " "+cls[v] : "";
    return '<button type="button" class="chip'+extra+'" data-v="'+esc(v)+'" aria-pressed="'+(v===sel?"true":"false")+'">'+esc(v)+'</button>';
  }).join("")+'</div>';
}
function bindChips(root){
  root.addEventListener("click", function(ev){
    var b = ev.target.closest(".chip"); if(!b) return;
    var g = b.closest(".chips"); if(!g || !root.contains(g)) return;
    var on = b.getAttribute("aria-pressed")==="true";
    if(g.dataset.multi==="1"){ b.setAttribute("aria-pressed", on?"false":"true"); }
    else{
      Array.prototype.forEach.call(g.querySelectorAll(".chip"),function(c){c.setAttribute("aria-pressed","false");});
      b.setAttribute("aria-pressed", on?"false":"true");
    }
    g.classList.remove("invalid");
    root.dispatchEvent(new CustomEvent("chipchange",{detail:{group:g.dataset.g},bubbles:false}));
  });
}
function gv(root,name){ var b=root.querySelector('[data-g="'+name+'"] .chip[aria-pressed="true"]'); return b?b.dataset.v:""; }
function gvs(root,name){ return Array.prototype.map.call(root.querySelectorAll('[data-g="'+name+'"] .chip[aria-pressed="true"]'),function(b){return b.dataset.v;}); }
function gset(root,name,v){
  Array.prototype.forEach.call(root.querySelectorAll('[data-g="'+name+'"] .chip'),function(c){
    c.setAttribute("aria-pressed", c.dataset.v===v?"true":"false");
  });
}
function f(root,name){ return root.querySelector('[data-f="'+name+'"]'); }
function fv(root,name){ var e=f(root,name); return e?e.value.trim():""; }

/* ===== удаление с возможностью отменить ===== */
function toastUndo(m, undo){
  var t=$("toast"); t.innerHTML=esc(m)+'<button type="button" class="undo">Отменить</button>';
  t.classList.add("on","act"); clearTimeout(t._t);
  t.querySelector(".undo").onclick=function(){ clearTimeout(t._t); t.classList.remove("on","act"); undo(); toast("Восстановлено"); };
  t._t=setTimeout(function(){ t.classList.remove("on","act"); },7000);
}
function removeWithUndo(coll, id, label, after){
  if(!canDelete()){ toast("Удалять записи может только руководитель. Ошибку можно исправить кнопкой «изменить»"); return; }
  var arr=S[coll], i=arr.findIndex(function(x){return x.id===id;}); if(i<0) return;
  var rec=arr[i]; arr.splice(i,1); persist(); drop(coll,id); after();
  toastUndo(label, function(){ arr.splice(Math.min(i,arr.length),0,rec); persist(); push(coll,rec.id,rec); after(); });
}
function stampEdit(rec){ rec.updatedAt=new Date().toISOString(); rec.updatedBy=authName(); }
function updNote(r){ return r.updatedAt ? '<span class="upd">изм. '+esc(fmtDate(r.updatedAt.slice(0,10)))+(r.updatedBy?' · '+esc(r.updatedBy):'')+'</span>' : ''; }

/* ===== фильтр списков: поиск + период ===== */
var PRESETS=[["today","Сегодня"],["week","7 дней"],["month","Этот месяц"],["prev","Прошлый месяц"],["all","Всё время"]];
function isoOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function presetRange(k){
  var t=new Date(), b=isoOf(t), a;
  if(k==="today") a=b;
  else if(k==="week"){ var x=new Date(t); x.setDate(x.getDate()-6); a=isoOf(x); }
  else if(k==="month") a=b.slice(0,8)+"01";
  else if(k==="prev"){ a=isoOf(new Date(t.getFullYear(),t.getMonth()-1,1)); b=isoOf(new Date(t.getFullYear(),t.getMonth(),0)); }
  else { a=""; b=""; }
  return [a,b];
}

/* ============ синхронизация с общей базой (Google Таблица) ============ */
var API=window.SB_API||"", OUT_KEY="sebiston.outbox", syncing=false, syncAgain=false, lastOk=null, lastSnap="";
function resId(k){ return "r_"+Array.prototype.map.call(String(k),function(ch){ return /[0-9A-Za-z_\-.]/.test(ch)?ch:"_"+ch.charCodeAt(0).toString(36); }).join(""); }
function outbox(){ try{ return JSON.parse(localStorage.getItem(OUT_KEY)||"[]"); }catch(e){ return []; } }
function saveOut(o){ lsSet(OUT_KEY, JSON.stringify(o)); }
function enqueue(op){
  var o=outbox().filter(function(x){ return !(x.coll===op.coll && x.id===op.id); });
  op.k=Date.now().toString(36)+Math.random().toString(36).slice(2,7); o.push(op); saveOut(o);
}
async function push(coll, id, doc){ if(!API) return; enqueue({op:"put",coll:coll,id:id,doc:doc}); sync(); }
async function drop(coll, id){ if(!API) return; enqueue({op:"del",coll:coll,id:id}); sync(); }
function setSync(state){
  var el=$("sync"); if(!el) return;
  if(!API){ el.hidden=true; return; }
  el.hidden=false; el.dataset.state=state;
  var n=outbox().length;
  el.textContent = state==="busy" ? "Сохраняю в общую базу…"
    : state==="off" ? "Нет связи с базой"+(n?" — "+n+" изм. отправятся автоматически, когда появится интернет":"")
    : "Общая база · обновлено "+(lastOk?pad(lastOk.getHours())+":"+pad(lastOk.getMinutes()):"");
}
function applyServer(d){
  var pend=outbox();
  ["leads","deals","tlog","daily"].forEach(function(c){
    var arr=(d[c]||[]).map(function(x){ delete x.__id; return x; });
    pend.forEach(function(op){
      if(op.coll!==c) return;
      var i=arr.findIndex(function(x){ return x.id===op.id; });
      if(op.op==="del"){ if(i>=0) arr.splice(i,1); } else if(i>=0) arr[i]=op.doc; else arr.push(op.doc);
    });
    arr.sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
    S[c]=own(arr);
  });
  var res={}; (d.results||[]).forEach(function(x){ if(x && x.id && x.map) res[x.id]=x.map; });
  var ovr={}; (d.ovr||[]).forEach(function(x){ if(x && x.id==="all" && x.map) ovr=x.map; });
  pend.forEach(function(op){ if(op.op!=="put") return; if(op.coll==="results" && op.doc) res[op.doc.id]=op.doc.map; if(op.coll==="ovr" && op.doc) ovr=op.doc.map||{}; });
  S.results=res; S.ovr=ovr;
  fixAliases();
  var snap=JSON.stringify(S);
  if(snap!==lastSnap){ lastSnap=snap; persist(); refreshAll(); }
}
async function sync(){
  if(!API) return;
  var tok=authSess().t; if(!tok) return;
  if(syncing){ syncAgain=true; return; }
  syncing=true; setSync("busy");
  var ops=outbox();
  try{
    var res=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({a:"sync",t:tok,ops:ops})});
    var j=await res.json();
    if(!j.ok){
      if(j.err==="auth"){ try{ localStorage.removeItem("sb_auth"); }catch(e){} toast("Сеанс истёк — войдите снова"); setTimeout(function(){ location.reload(); },1200); syncing=false; return; }
      throw new Error(j.err||"sync");
    }
    var done={}; (j.done||[]).concat(j.denied||[]).forEach(function(k){ done[k]=1; });
    saveOut(outbox().filter(function(x){ return !done[x.k]; }));
    if(j.denied && j.denied.length) toast("Удалять записи может только руководитель");
    if(j.me) applyMe(j.me);
    if(j.staff) applyStaff(j.staff);
    lastOk=new Date(); applyServer(j.data||{}); setSync("ok");
  }catch(e){ setSync("off"); }
  syncing=false;
  if(syncAgain){ syncAgain=false; sync(); }
}
/* первый вход с этого устройства — всё, что уже было введено здесь, уходит в общую базу */
function migrateLocal(){
  var a=authSess(); if(!API || !a.t) return;
  var key="sebiston.migrated."+a.u; if(lsGet(key)) return;
  ["leads","deals","tlog","daily"].forEach(function(c){ S[c].forEach(function(r){ if(r && r.id) enqueue({op:"put",coll:c,id:r.id,doc:r}); }); });
  Object.keys(S.results||{}).forEach(function(k){ enqueue({op:"put",coll:"results",id:resId(k),doc:{id:k,map:S.results[k]}}); });
  if(S.ovr && Object.keys(S.ovr).length) enqueue({op:"put",coll:"ovr",id:"all",doc:{id:"all",map:S.ovr}});
  lsSet(key,"1");
}
window.sbAfterLogin=function(){ applyRole(); migrateLocal(); sync(); };

/* роль и имя могли поменять в «Доступе» — подхватываем без перезахода */
function applyMe(me){
  var a=authSess(); if(!a.t) return;
  if(a.r!==me.r || a.n!==me.n){
    a.r=me.r; a.n=me.n; lsSet("sb_auth", JSON.stringify(a));
    var w=$("who"); if(w && w.firstChild && w.firstChild.nodeType===3) w.firstChild.nodeValue=a.n+(a.r==="admin"?"":" · менеджер");
    applyRole();
  }
}
function applyStaff(list){
  var names=[];
  list.forEach(function(x){ if(x && x.r!=="admin" && x.n && names.indexOf(x.n)<0) names.push(x.n); });
  names=exMgr(names);
  names.sort(function(a,b){ return a.localeCompare(b,"ru"); });
  if(!isAdmin() && authName()) names=[authName()];
  if(!names.length || JSON.stringify(names)===JSON.stringify(MGRS)) return;
  MGRS=names; lsSet("sebiston.staff", JSON.stringify(names));
  /* списки менеджеров в формах обновятся при следующем открытии вкладки — текущую форму не трогаем */
  Object.keys(PANELS).forEach(function(k){ if(k!==current && PANELS[k].node.dataset.ready){ PANELS[k].node.dataset.ready=""; PANELS[k].node.innerHTML=""; } });
  if(current==="stats" && PANELS.stats.node._render) PANELS.stats.node._render();
}
function isAdmin(){ return authRole()==="admin"; }
function applyRole(){
  var adm=isAdmin();
  if(!adm && authName() && !(MGRS.length===1 && MGRS[0]===authName())){
    MGRS=[authName()];
    ["leads","deals","tlog","daily"].forEach(function(c){ S[c]=own(S[c]); });
    if(typeof PANELS!=="undefined") Object.keys(PANELS).forEach(function(k){ if(k!==current && PANELS[k].node.dataset.ready){ PANELS[k].node.dataset.ready=""; PANELS[k].node.innerHTML=""; } });
  }
  Array.prototype.forEach.call(document.querySelectorAll("#tabs .adm"),function(b){ b.hidden=!adm; });
  if(!adm && current==="stats") open("call");
}
async function api(a, extra){
  var body=Object.assign({a:a, t:authSess().t}, extra||{});
  var res=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  var j=await res.json();
  if(!j.ok && j.err==="auth"){ try{ localStorage.removeItem("sb_auth"); }catch(e){} toast("Сеанс истёк — войдите снова"); setTimeout(function(){ location.reload(); },1200); }
  return j;
}

window.sbLogout=function(){
  var t=authSess().t;
  if(API && t) try{ fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({a:"logout",t:t}),keepalive:true}); }catch(e){}

function saveDeal(rec){
  S.deals.unshift(rec); persist(); lsSet(LS_MGR, rec.mgr);
  push("deals", rec.id, rec);
}
function delDeal(id){
  var i=S.deals.findIndex(function(x){return x.id===id;});
  if(i<0) return false;
  S.deals.splice(i,1); persist(); drop("deals",id); return true;
}
/* площадь + (цена за м² ИЛИ общая сумма). Итог можно вписать сразу — как в отчётах менеджеров */
function bindMoney(root){
  var manual=false;
  function upd(src){
    var a=num(fv(root,"area")), p=num(fv(root,"price"));
    if(src==="total"){ manual = fv(root,"total")!==""; }
    if(src==="price"){ manual=false; }
    if(!manual){ f(root,"total").value = (a&&p) ? String(Math.round(a*p*100)/100) : ""; }
    var t=num(fv(root,"total"));
    var hint=f(root,"priceHint");
    if(hint) hint.textContent = (manual && a && t) ? "≈ "+Math.round(t/a).toLocaleString("ru-RU")+" $ за м²" : "";
    var paid=f(root,"paid"), rest=f(root,"rest");
    if(rest) rest.textContent = money(t - (paid?num(paid.value):0));
  }
  ["area","price","total","paid"].forEach(function(n){
    var e=f(root,n); if(e) e.addEventListener("input", function(){ upd(n); });
  });
  return { reset:function(){ manual=false; upd(); }, upd:upd };
}

/* ==================================================================
   ОБЩЕЕ ДЛЯ ОТЧЁТОВ
   ================================================================== */
function inMonth(iso, mon){ return !mon || (iso||"").slice(0,7)===mon; }
function namesText(s){ return String(s==null?"":s).split(/[,;\n]+/).map(function(x){return x.trim();}).filter(function(x){return x && !/^\d+$/.test(x);}).join(", "); }
function namesCount(s){
  var t=String(s==null?"":s).trim();
  if(/^\d+$/.test(t)) return parseInt(t,10);          /* в старых отчётах вместо ФИО стоит число */
  return t.split(/[,;\n]+/).map(function(x){return x.trim();}).filter(function(x){return x && !/^\d+$/.test(x);}).length;
}
function leadAgg(list, deals){
  var rej = list.filter(function(l){return l.stage==="Отказ";});
  var causes={};
  rej.forEach(function(l){ var k=l.reject||"без причины"; causes[k]=(causes[k]||0)+1; });
  var causeText = Object.keys(causes).sort(function(a,b){return causes[b]-causes[a];})
    .map(function(k){return k+" — "+causes[k];}).join("; ");
  return {
    worked: list.length,
    set: list.filter(function(l){return l.meetDate;}).length,
    held: list.filter(function(l){return l.meetHeld;}).length,
    rej: rej.length, causes: causeText,
    bron: deals.filter(function(d){return d.status==="Бронь";}).length,
    sold: deals.filter(function(d){return d.status==="Продажа";}).length,
    money: deals.filter(function(d){return d.status==="Продажа";}).reduce(function(s,d){return s+d.total;},0)
  };
}
/* дневные отчёты менеджеров за месяц → те же поля, что у сводки */
function dailyAgg(list){
  return {
    worked: list.reduce(function(s,r){return s+num(r.worked);},0),
    set:    list.reduce(function(s,r){return s+num(r.set);},0),
    held:   list.reduce(function(s,r){return s+num(r.held);},0),
    rej:    list.reduce(function(s,r){return s+num(r.rej);},0),
    causes: list.map(function(r){return r.rejReason;}).filter(Boolean).join("; "),
    bron:   list.reduce(function(s,r){return s+namesCount(r.bronNames);},0),
    sold:   list.reduce(function(s,r){return s+namesCount(r.soldNames);},0),
    money:  0
  };
}

      '<div class="stat money"><div class="n">'+a.sold+'</div><div class="t">продаж</div></div>';

    w.innerHTML='<table><thead><tr><th>Дата</th><th>Обработано</th><th class="num">Назначенные встречи</th><th>Проведено встреч</th>'+
      '<th>Отказано (причина отказа)</th><th>Бронь (ФИО покупателей)</th><th>Продаж (ФИО покупателей)</th><th></th></tr></thead><tbody>'+
      rr.map(function(r){
        var flag = num(r.held)>num(r.set) ? ' class="flagged"' : '';
        var wk=[]; if(r.worked!=="") wk.push("<b>"+esc(r.worked)+"</b>");
        if(num(r.calls)) wk.push(esc(r.calls)+" звонк.");
        if(num(r.comments)) wk.push(esc(r.comments)+" комм.");
        var held = (r.held!==""?"<b>"+esc(r.held)+"</b>":"—")+(r.heldNote?'<br><span class="hint">'+esc(r.heldNote)+'</span>':'');
        var rej = (num(r.rej)?"<b>"+esc(r.rej)+"</b> — ":"")+(esc(r.rejReason)||(num(r.rej)?"":"нет"));
        var bron = r.bronNames ? esc(r.bronNames) : "нет";
        var sold = (r.soldNames ? esc(r.soldNames) : "нет")+(r.saleNote?'<br><span class="hint">'+esc(r.saleNote)+'</span>':'');
        if(r.id===editing) flag=' class="editing"';
        return '<tr'+flag+'><td>'+esc(fmtDate(r.date))+updNote(r)+'</td><td class="wrap">'+(wk.join(" · ")||"—")+'</td>'+
          '<td class="num">'+(r.set!==""?esc(r.set):"—")+'</td><td class="wrap">'+held+'</td>'+
          '<td class="wrap">'+rej+'</td><td class="wrap">'+bron+'</td><td class="wrap">'+sold+'</td>'+
          '<td class="rowact"><button class="lnk ed" data-edit="'+r.id+'">изменить</button>'+delBtn(r.id)+'</td></tr>';
      }).join("")+'</tbody><tfoot><tr><td>Итого</td><td>'+a.worked+'</td><td class="num">'+a.set+'</td><td>'+a.held+'</td>'+
      '<td>'+a.rej+'</td><td>'+a.bron+'</td><td>'+a.sold+'</td><td></td></tr></tfoot></table>';
    w.onclick=function(ev){
      var e=ev.target.closest("[data-edit]"), d=ev.target.closest("[data-del]");
      if(e){ var r=S.daily.find(function(x){return x.id===e.dataset.edit;}); if(r){ load(r); root.querySelector(".block.entry").scrollIntoView({block:"start",behavior:"smooth"}); } }
      else if(d){
        if(editing===d.dataset.del) reset();
        removeWithUndo("daily", d.dataset.del, "День удалён", render);
      }
    };
  }
  root._render=render;
  reset(); render();
}

/* ==================================================================
   ВКЛАДКА 6 · ЛИДЫ: ВСЕ МЕНЕДЖЕРЫ — сводный отчёт, ввод как у дневного
   ================================================================== */
function initRMgr(root){
  root.innerHTML =
  '<p class="lede">Сводный «Отчёт по обработке лидов» — строка на менеджера, как в вашем документе. Заполняется формой; это те же записи, что во вкладке «Лиды по дням», поэтому <b>день, введённый здесь, появится у менеджера, и наоборот</b>. Бронь и продажи — ФИО покупателей.</p>'+

    '<input type="month" data-f="pmon" aria-label="Месяц" hidden>'+

      '<div class="field"><label class="lbl">Дата <span class="req">•</span></label><input type="date" data-f="dt"></div>'+
      '<div class="field"><label class="lbl">Обработано</label><input type="number" data-f="worked" min="0" inputmode="numeric" placeholder="0"></div>'+
      '<div class="field"><label class="lbl">Назначенные встречи</label><input type="number" data-f="set" min="0" inputmode="numeric" placeholder="0"></div>'+
      '<div class="field"><label class="lbl">Проведено встреч</label><input type="number" data-f="held" min="0" inputmode="numeric" placeholder="0"></div>'+
      '<div class="field"><label class="lbl">Отказано</label><input type="number" data-f="rej" min="0" inputmode="numeric" placeholder="0"></div>'+
      '<div class="field span3"><label class="lbl">Частая причина отказа</label><input type="text" data-f="rejReason" list="rejlist2" placeholder="например: высокая стоимость, вариант не по бюджету"></div>'+
      '<div class="field span3"><label class="lbl">Бронь — ФИО покупателей</label><input type="text" data-f="bronNames" placeholder="ФИО через запятую или число"><p class="hint" data-f="bronCnt"></p></div>'+
      '<div class="field span3"><label class="lbl">Продажа — ФИО покупателей</label><input type="text" data-f="soldNames" placeholder="ФИО через запятую или число"><p class="hint" data-f="soldCnt"></p></div>'+
    '</div>'+
    '<datalist id="rejlist2">'+REJECTS.map(function(r){return '<option value="'+esc(r)+'"></option>';}).join("")+'</datalist>'+
    '<div class="warn" data-f="heldWarn" hidden style="margin-top:4px"><span aria-hidden="true">⚑</span><div>Проведено встреч больше, чем назначено. Проверьте цифры — или укажите, что встреча была без предварительной записи.</div></div>'+
    '<div class="actions"><div class="sum" data-f="sum"></div>'+
      '<button class="btn btn-ghost" data-f="clear" type="button">Очистить</button>'+
      '<button class="btn btn-main" data-f="save" type="button">Сохранить</button></div>'+
  '</div>'+
  '<div class="warn" data-f="warn" hidden><span aria-hidden="true">⚑</span><div data-f="warnText"></div></div>'+
  '<div class="stats" data-f="stats"></div>'+
  '<div class="tbl-wrap" data-f="tblw"></div>';

  var FIELDS=["worked","set","held","rej","rejReason","bronNames","soldNames"];
  var NUMF=["worked","set","held","rej"];
  var editing=null;

  f(root,"pday").value=todayISO();
  f(root,"pmon").value=thisMonth();
  f(root,"dt").value=todayISO();
  var lastM=lsGet(LS_MGR); if(lastM && MGRS.indexOf(lastM)>=0) f(root,"mgr").value=lastM;

  function isDay(){ return f(root,"mode").value==="day"; }
  f(root,"mode").addEventListener("change", function(){
    f(root,"pday").hidden=!isDay(); f(root,"pmon").hidden=isDay(); render();
  });
  f(root,"pday").addEventListener("change", function(){ f(root,"dt").value=this.value; reset(true); render(); });
  f(root,"pmon").addEventListener("change", render);

  function find(m,d){ return S.daily.find(function(r){return r.mgr===m && r.date===d;}); }
  function live(){
    var b=namesCount(fv(root,"bronNames")), s=namesCount(fv(root,"soldNames"));
    f(root,"bronCnt").textContent = b ? "броней: "+b : "";
    f(root,"soldCnt").textContent = s ? "продаж: "+s : "";
    f(root,"heldWarn").hidden = !(num(fv(root,"held"))>num(fv(root,"set")));
    f(root,"sum").textContent = f(root,"mgr").value+" · "+(f(root,"dt").value?fmtDate(f(root,"dt").value):"без даты")+(editing?" · правка":"");
  }
  FIELDS.forEach(function(n){ f(root,n).addEventListener("input", live); });
  function tryLoad(){
    var ex=find(f(root,"mgr").value, f(root,"dt").value);
    if(ex){ load(ex); toast("У "+ex.mgr+" за "+fmtDate(ex.date)+" уже есть данные — открыты для правки"); }
    else if(editing){ editing=null; f(root,"formTitle").textContent="Добавить менеджера в отчёт"; }
    live();
  }
  f(root,"mgr").addEventListener("change", tryLoad);
  f(root,"dt").addEventListener("change", tryLoad);

  function load(r){
    editing=r.id; f(root,"mgr").value=r.mgr; f(root,"dt").value=r.date;
    FIELDS.forEach(function(n){ f(root,n).value = r[n]==null ? "" : r[n]; });
    f(root,"formTitle").textContent="Правка: "+r.mgr+", "+fmtDate(r.date);
    live();
  }
  function reset(keepDate){
    editing=null;
    FIELDS.forEach(function(n){ f(root,n).value=""; });
    if(!keepDate) f(root,"dt").value = isDay() ? f(root,"pday").value : todayISO();
    f(root,"formTitle").textContent="Добавить менеджера в отчёт";
    live();
  }

  f(root,"save").addEventListener("click", function(){
    var m=f(root,"mgr").value, d=f(root,"dt").value;
    if(!d){ toast("Укажите дату"); return; }
    var rec=find(m,d);
    if(!rec && editing){ rec=S.daily.find(function(x){return x.id===editing;}); }
    if(!rec){ rec={ id:uid(), createdAt:new Date().toISOString() }; S.daily.push(rec); }
    rec.mgr=m; rec.date=d;
    /* поля, которых нет в сводной форме (звонки, комментарии) — не трогаем */
    FIELDS.forEach(function(n){ var v=fv(root,n); rec[n] = NUMF.indexOf(n)>=0 ? (v===""?"":num(v)) : v; });
    persist(); push("daily",rec.id,rec);
    if(isDay()) f(root,"pday").value=d; else f(root,"pmon").value=d.slice(0,7);
    toast((editing?"Исправлено: ":"Добавлено: ")+m+", "+fmtDate(d));
    var nextIdx=MGRS.indexOf(m)+1;
    reset(true);
    /* следующий менеджер — чтобы сводный за день заполнялся подряд */
    for(var i=nextIdx;i<MGRS.length;i++){ if(!find(MGRS[i],d)){ f(root,"mgr").value=MGRS[i]; break; } }
    live(); render();
  });
  f(root,"clear").addEventListener("click", function(){ reset(true); toast("Форма очищена"); });

  function rowsFor(){
    var list = isDay()
      ? S.daily.filter(function(r){return r.date===f(root,"pday").value;})
      : S.daily.filter(function(r){return inMonth(r.date,f(root,"pmon").value);});
    return MGRS.map(function(m){
      var L=list.filter(function(r){return r.mgr===m;});
      if(!L.length) return null;
      var a=dailyAgg(L);
      return { mgr:m, recs:L, worked:a.worked, set:a.set, held:a.held, rej:a.rej, causes:a.causes,
        bronNames:L.map(function(r){return namesText(r.bronNames);}).filter(Boolean).join(", "),
        soldNames:L.map(function(r){return namesText(r.soldNames);}).filter(Boolean).join(", "),
        bron:a.bron, sold:a.sold, days:L.length };
    }).filter(Boolean);
  }

  f(root,"exp").addEventListener("click", function(){
    var rr=rowsFor(); if(!rr.length){ toast("Нечего выгружать"); return; }
    var per = isDay()? f(root,"pday").value : f(root,"pmon").value;
    var head=["Менеджер","Обработано","Назначенные встречи","Проведено встреч","Отказано","Частая причина отказа","Бронь (ФИО покупателей)","Броней","Продаж (ФИО покупателей)","Продаж"];
    var body=rr.map(function(r){return [r.mgr,r.worked,r.set,r.held,r.rej,r.causes,r.bronNames,r.bron,r.soldNames,r.sold];});
    var T=tot(rr); body.push(["ИТОГО",T.worked,T.set,T.held,T.rej,"","",T.bron,"",T.sold]);
    download("sebiston-lidy-otdel-"+per+".csv", csvText(head, body));
  });

  function tot(rr){ return rr.reduce(function(s,r){ ["worked","set","held","rej","bron","sold"].forEach(function(k){s[k]+=r[k];}); return s; },{worked:0,set:0,held:0,rej:0,bron:0,sold:0}); }

  function render(){
    var rr=rowsFor(), T=tot(rr), day=isDay();
    f(root,"stats").innerHTML=
      '<div class="stat"><div class="n">'+rr.length+' / '+MGRS.length+'</div><div class="t">менеджеров в отчёте</div></div>'+
      '<div class="stat"><div class="n">'+T.worked+'</div><div class="t">обработано</div></div>'+
      '<div class="stat"><div class="n">'+T.set+' / '+T.held+'</div><div class="t">встреч назначено / проведено</div></div>'+
      '<div class="stat"><div class="n">'+T.rej+'</div><div class="t">отказов</div></div>'+
      '<div class="stat hot"><div class="n">'+T.bron+'</div><div class="t">броней</div></div>'+
      '<div class="stat money"><div class="n">'+T.sold+'</div><div class="t">продаж</div></div>';

    var bad=rr.filter(function(r){return r.held>r.set;});
    var missing = day ? MGRS.filter(function(m){ return !rr.some(function(r){return r.mgr===m;}); }) : [];
    var msgs=[];
    if(bad.length) msgs.push("Проведено встреч больше, чем назначено, у: <b>"+esc(bad.map(function(r){return r.mgr;}).join(", "))+"</b>.");
    if(day && rr.length && missing.length) msgs.push("Ещё не сдали отчёт за "+esc(fmtDate(f(root,"pday").value))+": "+esc(missing.join(", "))+".");
    if(msgs.length){ f(root,"warnText").innerHTML=msgs.join("<br>"); f(root,"warn").hidden=false; } else f(root,"warn").hidden=true;

    var w=f(root,"tblw");
    if(!rr.length){
      w.innerHTML='<div class="empty" style="border:0"><b>'+(day?"За этот день данных нет":"За этот месяц данных нет")+'</b>Заполните форму выше — после сохранения форма сама переключится на следующего менеджера.</div>';
      return;
    }
    w.innerHTML='<table><thead><tr><th>Менеджер</th>'+(day?'':'<th class="num">Дней</th>')+
      '<th class="num">Обработано</th><th class="num">Назначенные встречи</th><th class="num">Проведено встреч</th>'+
      '<th>Отказано (частая причина отказа)</th><th>Бронь (ФИО покупателей)</th><th>Продаж (ФИО покупателей)</th><th></th></tr></thead><tbody>'+
      rr.map(function(r){
        var flag=r.held>r.set?' class="flagged"':'';
        var rej=(r.rej?"<b>"+r.rej+"</b>"+(r.causes?" — ":""):"")+(esc(r.causes)||(r.rej?"":"0"));
        var bron=r.bron?"<b>"+r.bron+"</b>"+(r.bronNames?" — "+esc(r.bronNames):""):"0";
        var sold=r.sold?"<b>"+r.sold+"</b>"+(r.soldNames?" — "+esc(r.soldNames):""):"0";
        var act = day
          ? '<button class="lnk ok" data-edit="'+r.recs[0].id+'">изменить</button> &nbsp;<button class="lnk" data-del="'+r.recs[0].id+'">удалить</button>'
          : '<button class="lnk ok" data-open="'+esc(r.mgr)+'">по дням</button>';
        return '<tr'+flag+'><td>'+esc(r.mgr)+'</td>'+(day?'':'<td class="num">'+r.days+'</td>')+
          '<td class="num">'+r.worked+'</td><td class="num">'+r.set+'</td><td class="num">'+r.held+'</td>'+
          '<td class="wrap">'+rej+'</td><td class="wrap">'+bron+'</td><td class="wrap">'+sold+'</td>'+
          '<td style="white-space:nowrap">'+act+'</td></tr>';
      }).join("")+'</tbody><tfoot><tr><td>Итого</td>'+(day?'':'<td></td>')+'<td class="num">'+T.worked+'</td><td class="num">'+T.set+'</td>'+
      '<td class="num">'+T.held+'</td><td>'+T.rej+'</td><td>'+T.bron+'</td><td>'+T.sold+'</td><td></td></tr></tfoot></table>';
    w.onclick=function(ev){
      var e=ev.target.closest("[data-edit]"), d=ev.target.closest("[data-del]"), o=ev.target.closest("[data-open]");
      if(e){ var r=S.daily.find(function(x){return x.id===e.dataset.edit;}); if(r){ load(r); root.scrollIntoView({block:"start",behavior:"smooth"}); } }
      else if(d){
        var i=S.daily.findIndex(function(x){return x.id===d.dataset.del;});
        if(i>=0){ var id=S.daily[i].id; S.daily.splice(i,1); persist(); drop("daily",id); if(editing===id) reset(true); render(); toast("Удалено"); }
      } else if(o){
        lsSet(LS_MGR,o.dataset.open);
        var pr=PANELS.rday.node;
        open("rday");
        var sel=pr.querySelector('[data-f="mgr"]'), mo=pr.querySelector('[data-f="mon"]');
        if(sel){ sel.value=o.dataset.open; } if(mo){ mo.value=f(root,"pmon").value; }
        if(sel) sel.dispatchEvent(new Event("change"));
      }
    };
  }
  root._render=render;
  reset(); render();
}

    var rec={ id:uid(), date:f(root,"dt").value||todayISO(), mgr:f(root,"mgr").value, buyer:fv(root,"buyer"),
      object:f(root,"obj").value, block:fv(root,"block"), floor:fv(root,"floor"),
      area:a, price:num(fv(root,"price"))||t/a, total:t, paid:pd, rest:t-pd,
      method:f(root,"method").value, term:"", status:f(root,"status").value, note:fv(root,"note"),
      createdAt:new Date().toISOString() };
    saveDeal(rec);
    f(root,"mon").value=rec.date.slice(0,7);
    ["block","floor","area","price","total","paid","buyer","note"].forEach(function(n){ f(root,n).value=""; });
    mon.reset(); render();
    toast(rec.mgr+": "+rec.object+", "+money(rec.total));
    f(root,"area").focus();
  });

  function pick(){
    var mo=f(root,"mon").value, st=f(root,"st").value;
    return S.deals.filter(function(d){ return inMonth(d.date,mo) && (!st || d.status===st); })
      .sort(function(a,b){ return (a.createdAt||"").localeCompare(b.createdAt||""); });
  }
  function byMgr(D){
    return MGRS.map(function(m){
      var list=D.filter(function(d){return d.mgr===m;});
      return { mgr:m, list:list,
        m2:list.reduce(function(s,d){return s+d.area;},0),
        total:list.reduce(function(s,d){return s+d.total;},0),
        paid:list.reduce(function(s,d){return s+d.paid;},0) };
    }).filter(function(g){return g.list.length;});
  }
  function r2(n){ return (Math.round(n*100)/100).toLocaleString("ru-RU"); }

  f(root,"exp").addEventListener("click", function(){
    var G=byMgr(pick()); if(!G.length){ toast("Нечего выгружать"); return; }
    var head=["ФИО менеджера","Объект","Блок","Этаж","Площадь м²","Метод","Сумма $","Внесено $","Статус","Общий объём м² (менеджер)","Общая сумма $ (менеджер)"];
    var body=[];
    G.forEach(function(g){
      g.list.forEach(function(d,i){
        body.push([i===0?g.mgr:"", d.object, d.block, d.floor, d.area, d.method, d.total, d.paid, d.status,
                   i===0?Math.round(g.m2*100)/100:"", i===0?Math.round(g.total):""]);
      });
    });
    var T=G.reduce(function(s,g){return {n:s.n+g.list.length,m2:s.m2+g.m2,t:s.t+g.total};},{n:0,m2:0,t:0});
    body.push(["ИТОГО","квартир: "+T.n,"","","","","","","",Math.round(T.m2*100)/100,Math.round(T.t)]);
    download("sebiston-itog-prodazh-"+f(root,"mon").value+".csv", csvText(head, body));
  });

  function render(){
    var D=pick(), G=byMgr(D);
    var T={n:0,m2:0,total:0,paid:0};
    G.forEach(function(g){ T.n+=g.list.length; T.m2+=g.m2; T.total+=g.total; T.paid+=g.paid; });
    f(root,"stats").innerHTML=
      '<div class="stat"><div class="n">'+T.n+'</div><div class="t">квартир</div></div>'+
      '<div class="stat"><div class="n">'+r2(T.m2)+'</div><div class="t">общий объём, м²</div></div>'+
      '<div class="stat money"><div class="n">'+money(T.total)+'</div><div class="t">общая сумма</div></div>'+
      '<div class="stat"><div class="n">'+money(T.paid)+'</div><div class="t">внесено</div></div>'+
      '<div class="stat"><div class="n">'+money(T.total-T.paid)+'</div><div class="t">остаток</div></div>';

    var w=f(root,"tblw");
    if(!G.length){ w.innerHTML='<div class="empty" style="border:0"><b>Квартир за месяц нет</b>Добавьте первую через форму выше.</div>'; }
    else{
      var html='<table class="report"><thead><tr><th>ФИО менеджера</th><th>Объект</th><th>Блок</th><th class="num">Этаж</th>'+
        '<th class="num">Площадь м²</th><th>Сумма по квартире</th><th class="num">Общий объём, м²</th><th class="num">Общая сумма</th><th></th></tr></thead><tbody>';
      G.forEach(function(g){
        var n=g.list.length;
        g.list.forEach(function(d,i){
          html+='<tr class="'+(i===0?"grp-first":"")+'">';
          if(i===0) html+='<td rowspan="'+n+'" class="grp"><b>'+esc(g.mgr)+'</b></td>';
          html+='<td>'+esc(d.object)+(d.status==="Бронь"?' <span class="badge bron">бронь</span>':'')+'</td>'+
            '<td>'+esc(d.block||"—")+'</td><td class="num">'+esc(d.floor||"—")+'</td><td class="num">'+r2(d.area)+'</td>'+
            '<td>'+(d.method?esc(d.method)+" — ":"")+money(d.total)+(d.paid&&d.paid<d.total?'<br><span class="hint">внесено '+money(d.paid)+'</span>':'')+'</td>';
          if(i===0) html+='<td rowspan="'+n+'" class="num grp">'+r2(g.m2)+'</td><td rowspan="'+n+'" class="num grp"><b>'+money(g.total)+'</b></td>';
          html+='<td>'+delBtn(d.id)+'</td></tr>';
        });
      });
      html+='</tbody><tfoot><tr><td>ИТОГО</td><td colspan="3">квартир: '+T.n+'</td><td></td><td></td>'+
        '<td class="num">'+r2(T.m2)+'</td><td class="num">'+money(T.total)+'</td><td></td></tr></tfoot></table>';
      w.innerHTML=html;
      w.onclick=function(ev){
        var b=ev.target.closest("[data-del]"); if(!b) return;
        if(delDeal(b.dataset.del)){ render(); toast("Квартира удалена"); }
      };
    }

    function slice(key, box, label){
      var m={};
      D.forEach(function(d){ var k=d[key]||"не указан"; var r=m[k]||(m[k]={n:0,m2:0,total:0}); r.n++; r.m2+=d.area; r.total+=d.total; });
      var ks=Object.keys(m).sort(function(a,b){return m[b].total-m[a].total;});
      if(!ks.length){ f(root,box).innerHTML='<div class="empty" style="border:0">Нет данных</div>'; return; }
      f(root,box).innerHTML='<table><thead><tr><th>'+esc(label)+'</th><th class="num">Квартир</th><th class="num">м²</th><th class="num">Сумма</th></tr></thead><tbody>'+
        ks.map(function(k){ return '<tr><td class="wrap">'+esc(k)+'</td><td class="num">'+m[k].n+'</td><td class="num">'+r2(m[k].m2)+'</td><td class="num">'+money(m[k].total)+'</td></tr>'; }).join("")+'</tbody></table>';
    }
    slice("object","objw","Объект");
    slice("method","metw","Метод");
  }
  root._render=render; render();
}

/* ==================================================================
   ТОЛЬКО ДЛЯ РУКОВОДИТЕЛЕЙ · СТАТИСТИКА ПО МЕНЕДЖЕРАМ
   ================================================================== */
function initStats(root){
  root.innerHTML =
  '<p class="lede">Сводка по каждому менеджеру за выбранный период. Считается автоматически из всех вкладок: <b>«Лиды по дням»</b> (обработано, звонки, ответы, встречи, отказы, брони и продажи по ФИО), <b>«Звонки»</b> и <b>«Офис»</b> (обращения), <b>«Продажи»</b> (суммы). Если одно и то же записано в двух местах, за день берётся большее число — дважды ничего не считается.</p>'+
  filterBarHTML("Поиск по имени менеджера", expBtns())+
  '<div class="stats" data-f="stats"></div>'+
  '<div class="tbl-wrap" data-f="tblw"></div>';

  var flt=bindFilter(root, render, "month");

  /* не показывать в статистике */
  var STATS_HIDE=["Азиз"];
  var KEYS=["calls","office","worked","dcalls","comments","set","held","rej","bron","sold","sum","paid"];
  function blank(name){ var o={mgr:name}; KEYS.forEach(function(k){ o[k]=0; }); return o; }

  /* сводка за каждый день каждого менеджера */
  function days(F){
    var D={};
    function day(m,d){ m=m||"Без менеджера"; var k=m+"|"+d; return D[k]||(D[k]={mgr:m,date:d,calls:0,office:0,lset:0,lheld:0,lrej:0,dbron:0,dsold:0,sum:0,paid:0,daily:null}); }
    S.leads.forEach(function(x){
      if(!inRange(x.date,F.from,F.to)) return;
      var r=day(x.mgr,x.date);
      if(x.kind==="office") r.office++; else r.calls++;
      if(x.meetDate) r.lset++;
      if(x.meetHeld) r.lheld++;
      if(x.stage==="Отказ") r.lrej++;
    });
    S.deals.forEach(function(x){
      if(!inRange(x.date,F.from,F.to)) return;
      var r=day(x.mgr,x.date);
      if(x.status==="Бронь") r.dbron++; else { r.dsold++; r.sum+=num(x.total); r.paid+=num(x.paid); }
    });
    S.daily.forEach(function(x){
      if(!inRange(x.date,F.from,F.to)) return;
      var r=day(x.mgr,x.date), d=r.daily||(r.daily={worked:0,calls:0,comments:0,set:0,held:0,rej:0,bron:0,sold:0,heldNote:[],rejReason:[],bronNames:[],soldNames:[],saleNote:[]});
      ["worked","calls","comments","set","held","rej"].forEach(function(k){ d[k]+=num(x[k]); });
      d.bron+=namesCount(x.bronNames); d.sold+=namesCount(x.soldNames);
      ["heldNote","rejReason","saleNote"].forEach(function(k){ if(x[k]) d[k].push(x[k]); });
      if(namesText(x.bronNames)) d.bronNames.push(namesText(x.bronNames));
      if(namesText(x.soldNames)) d.soldNames.push(namesText(x.soldNames));
    });
    return Object.keys(D).map(function(k){
      var r=D[k], d=r.daily||{};
      return { mgr:r.mgr, date:r.date, hasDaily:!!r.daily,
        calls:r.calls, office:r.office, worked:num(d.worked), dcalls:num(d.calls), comments:num(d.comments),
        set:Math.max(r.lset,num(d.set)), held:Math.max(r.lheld,num(d.held)), rej:Math.max(r.lrej,num(d.rej)),
        bron:Math.max(r.dbron,num(d.bron)), sold:Math.max(r.dsold,num(d.sold)), sum:r.sum, paid:r.paid,
        heldNote:(d.heldNote||[]).join("; "), rejReason:(d.rejReason||[]).join("; "),
        bronNames:(d.bronNames||[]).join(", "), soldNames:(d.soldNames||[]).join(", "), saleNote:(d.saleNote||[]).join("; ") };
    });
  }
  function collect(){
    var F=flt.get(), map={}, order=[];
    function row(name){ name=name||"Без менеджера"; if(!map[name]){ map[name]=blank(name); order.push(name); } return map[name]; }
    MGRS.forEach(row);
    var dd=days(F);
    dd.forEach(function(x){ var r=row(x.mgr); KEYS.forEach(function(k){ r[k]+=x[k]; }); });
    var q=normTxt(F.q||"").trim();
    var vis=function(m){ return STATS_HIDE.indexOf(m)<0 && (!q || normTxt(m).indexOf(q)>=0); };
    var all=order.filter(function(k){ return STATS_HIDE.indexOf(k)<0; }).map(function(k){ return map[k]; });
    var rows=all.filter(function(r){ return vis(r.mgr); });
    rows.sort(function(a,b){ return b.sum-a.sum || b.sold-a.sold || b.worked-a.worked || (b.calls+b.office)-(a.calls+a.office) || a.mgr.localeCompare(b.mgr,"ru"); });
    var det=dd.filter(function(x){ return vis(x.mgr); }).sort(function(a,b){ return a.date.localeCompare(b.date) || a.mgr.localeCompare(b.mgr,"ru"); });
    return {rows:rows, total:all.length, days:det};
  }
  function base(r){ return r.worked || (r.calls+r.office); }
  function conv(r){ var c=base(r); return c ? (r.sold/c*100).toFixed(1).replace(".",",")+" %" : "—"; }
  function totals(rr){ return rr.reduce(function(s,r){ KEYS.forEach(function(k){ s[k]+=r[k]; }); return s; }, blank("ИТОГО")); }

  function render(){
    var c=collect(), rr=c.rows, T=totals(rr);
    f(root,"stats").innerHTML=
      '<div class="stat"><div class="n">'+T.worked+'</div><div class="t">лидов обработано</div></div>'+
      '<div class="stat"><div class="n">'+(T.calls+T.office)+'</div><div class="t">обращений (звонки + офис)</div></div>'+
      '<div class="stat"><div class="n">'+T.set+' / '+T.held+'</div><div class="t">встреч назначено / проведено</div></div>'+
      '<div class="stat"><div class="n">'+T.rej+'</div><div class="t">отказов</div></div>'+
      '<div class="stat hot"><div class="n">'+T.bron+'</div><div class="t">броней</div></div>'+
      '<div class="stat money"><div class="n">'+T.sold+'</div><div class="t">продаж</div></div>'+
      '<div class="stat money"><div class="n">'+money(T.sum)+'</div><div class="t">сумма продаж</div></div>';
    flt.meta(rr.length, c.total);
    var w=f(root,"tblw");
    if(!rr.length){ w.innerHTML='<div class="empty" style="border:0"><b>Ничего не найдено</b>Измените период или запрос.</div>'; return; }
    function tr(r){
      return '<tr><td>'+esc(r.mgr)+'</td>'+
        [r.worked,r.dcalls,r.comments,r.calls,r.office,r.set,r.held,r.rej,r.bron,r.sold].map(function(v){ return '<td class="num">'+v+'</td>'; }).join("")+
        '<td class="num">'+money(r.sum)+'</td><td class="num">'+money(r.paid)+'</td><td class="num">'+conv(r)+'</td></tr>';
    }
    w.innerHTML='<table><thead><tr><th>Менеджер</th><th class="num">Обработано лидов</th><th class="num">Звонков</th><th class="num">Ответов</th>'+
      '<th class="num">Звонки (карточки)</th><th class="num">Офис</th><th class="num">Встреч назначено</th><th class="num">Встреч проведено</th><th class="num">Отказы</th>'+
      '<th class="num">Брони</th><th class="num">Продажи</th><th class="num">Сумма продаж</th><th class="num">Внесено</th><th class="num">Конверсия в продажу</th></tr></thead><tbody>'+
      rr.map(tr).join("")+'</tbody><tfoot>'+tr(T)+'</tfoot></table>';
  }
  bindExport(root, function(){
    var c=collect(), rr=c.rows; if(!rr.length){ toast("Нечего выгружать"); return null; }
    var g=flt.get(), T=totals(rr);
    function cv(r){ var k=base(r); return k ? r.sold/k : ""; }
    var meta=[["Период",periodLabel(g.from,g.to)]]; if(g.q.trim()) meta.push(["Поиск",g.q.trim()]);
    var cols=[{h:"Менеджер",w:18},{h:"Обработано лидов",w:11,t:"n"},{h:"Звонков",w:9,t:"n"},{h:"Ответов",w:9,t:"n"},
      {h:"Звонки (карточки)",w:10,t:"n"},{h:"Офис",w:8,t:"n"},{h:"Встреч назначено",w:11,t:"n"},{h:"Встреч проведено",w:11,t:"n"},{h:"Отказы",w:9,t:"n"},
      {h:"Брони",w:8,t:"n"},{h:"Продажи",w:9,t:"n"},{h:"Сумма продаж, $",w:14,t:"m"},{h:"Внесено, $",w:13,t:"m"},{h:"Конверсия в продажу",w:12,t:"p"}];
    function line(r){ return [r.mgr,r.worked,r.dcalls,r.comments,r.calls,r.office,r.set,r.held,r.rej,r.bron,r.sold,r.sum,r.paid,cv(r)]; }
    var dcols=[{h:"Дата",w:11,t:"d"},{h:"Менеджер",w:16},{h:"Обработано",w:10,t:"n"},{h:"Звонков",w:8,t:"n"},{h:"Ответов",w:8,t:"n"},
      {h:"Обращения (звонки + офис)",w:11,t:"n"},{h:"Назначено встреч",w:10,t:"n"},{h:"Проведено встреч",w:10,t:"n"},{h:"Комментарий к встречам",w:22},
      {h:"Отказы",w:8,t:"n"},{h:"Причина отказа",w:20},{h:"Брони",w:7,t:"n"},{h:"Бронь — ФИО",w:20},{h:"Продажи",w:8,t:"n"},{h:"Продажа — ФИО",w:20},
      {h:"Сумма продаж, $",w:13,t:"m"},{h:"Комментарий по продажам",w:20}];
    var drows=c.days.map(function(x){ return [x.date,x.mgr,x.worked,x.dcalls,x.comments,x.calls+x.office,x.set,x.held,x.heldNote,x.rej,x.rejReason,x.bron,x.bronNames,x.sold,x.soldNames,x.sum,x.saleNote]; });
    var dT=c.days.reduce(function(s,x){ ["worked","dcalls","comments","set","held","rej","bron","sold","sum"].forEach(function(k){ s[k]+=x[k]; }); s.obr+=x.calls+x.office; return s; },{worked:0,dcalls:0,comments:0,set:0,held:0,rej:0,bron:0,sold:0,sum:0,obr:0});
    return { title:"Статистика отдела продаж", file:"Sebiston — Статистика — "+periodLabel(g.from,g.to), meta:meta, signLeft:"Составил",
      kpis:[["лидов обработано",T.worked],["обращений",T.calls+T.office],["встреч назначено / проведено",T.set+" / "+T.held],["отказов",T.rej],["броней / продаж",T.bron+" / "+T.sold],["сумма продаж",fmtCell(T.sum,"m")]],
      tables:[
        {sheet:"По менеджерам",heading:"По менеджерам",cols:cols,rows:rr.map(line),total:line(T)},
        {sheet:"По дням",heading:"По дням",cols:dcols,rows:drows,
          total:["Итого","",dT.worked,dT.dcalls,dT.comments,dT.obr,dT.set,dT.held,"",dT.rej,"",dT.bron,"",dT.sold,"",dT.sum,""],
          word:{cols:[{h:"Дата",w:10,t:"d"},{h:"Менеджер",w:15},{h:"Обработано",w:9,t:"n"},{h:"Звонков",w:8,t:"n"},{h:"Встречи назн. / пров.",w:11,al:"center"},
              {h:"Отказы (причина)",w:20},{h:"Брони (ФИО)",w:18},{h:"Продажи (ФИО)",w:18},{h:"Сумма, $",w:11,t:"m"}],
            rows:c.days.map(function(x){ return [x.date,x.mgr,x.worked,x.dcalls,x.set+" / "+x.held,
              x.rej?(x.rej+(x.rejReason?" — "+x.rejReason:"")):"", x.bron?(x.bronNames?x.bronNames+" ("+x.bron+")":String(x.bron)):"",
              x.sold?(x.soldNames?x.soldNames+" ("+x.sold+")":String(x.sold)):"", x.sum]; }),
            total:["Итого","",dT.worked,dT.dcalls,dT.set+" / "+dT.held,String(dT.rej),String(dT.bron),String(dT.sold),dT.sum]}}
      ] };
  });
  root._render=render; render();
}

   ВКЛАДКИ

var PANELS = {
  call:  {node:$("p-call"),   init:function(n){initLeadPanel(n,"call");}},
  office:{node:$("p-office"), init:function(n){initLeadPanel(n,"office");}},
  sales: {node:$("p-sales"),  init:initSales},
  time:  {node:$("p-time"),   init:initTime},
  rday:  {node:$("p-rday"),   init:initRDay},
  stats: {node:$("p-stats"),  init:initStats}
};
var current="call";
function open(key){
  Object.keys(PANELS).forEach(function(k){ PANELS[k].node.hidden = (k!==key); });
  Array.prototype.forEach.call($("tabs").querySelectorAll(".tab"),function(b){
    b.setAttribute("aria-selected", b.dataset.p===key ? "true":"false");
  });
  current=key;
  var p=PANELS[key];
  if(!p.node.dataset.ready){ p.init(p.node); p.node.dataset.ready="1"; }
  else if(p.node._render) p.node._render();
  window.scrollTo({top:0});
}
$("tabs").addEventListener("click", function(ev){
  var b=ev.target.closest(".tab"); if(!b || b.hidden) return; open(b.dataset.p);
});
function refreshAll(){
  Object.keys(PANELS).forEach(function(k){
    var n=PANELS[k].node;
    if(n.dataset.ready && n._render) n._render();
  });
}

/* ==================================================================
   ПОДКЛЮЧЕНИЕ ОБЩЕЙ БАЗЫ
   ================================================================== */
function merge(arrName, docs){
  var seen={}; S[arrName].forEach(function(x){seen[x.id]=1;});
  var added=0;
  docs.forEach(function(d){ if(d&&d.id&&!seen[d.id]){ S[arrName].push(d); seen[d.id]=1; added++; } });
  S[arrName].sort(function(a,b){ return (b.createdAt||"").localeCompare(a.createdAt||""); });
  if(added) persist();
  return added;
}
async function connect(){
  setSync("ok");
  if(!API) return;
  migrateLocal(); sync();
  setInterval(function(){ if(!document.hidden) sync(); }, 30000);
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) sync(); });
  window.addEventListener("online", sync);
}

/* ==================================================================
   СТАРТ
   ================================================================== */
restore();
applyRole();
open("call");
connect();

})();

<script>
/* ТЕМА: светлая / тёмная. Выбор запоминается; без выбора — как в системе */
(function(){
var root=document.documentElement, mq=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):null;
function saved(){ try{ return localStorage.getItem("sb_theme"); }catch(e){ return null; } }
function isDark(){ var t=saved(); return t ? t==="dark" : !!(mq&&mq.matches); }
function paint(){
  var d=isDark();
  Array.prototype.forEach.call(document.querySelectorAll("[data-theme-sw]"),function(b){
    b.setAttribute("aria-checked",d?"true":"false"); b.setAttribute("aria-label",d?"Включить светлую тему":"Включить тёмную тему");
  });
  var m=document.querySelector('meta[name="theme-color"]');
  if(!m){ m=document.createElement("meta"); m.name="theme-color"; document.head.appendChild(m); }
  m.content=d?"#16211B":"#FFFFFF";
}
function set(t){
  root.classList.add("theme-anim");
  root.setAttribute("data-theme",t); try{ localStorage.setItem("sb_theme",t); }catch(e){}
  paint(); setTimeout(function(){ root.classList.remove("theme-anim"); },350);
}
document.addEventListener("click",function(ev){ var b=ev.target.closest("[data-theme-sw]"); if(b) set(isDark()?"light":"dark"); });
if(mq&&mq.addEventListener) mq.addEventListener("change",function(){ if(!saved()) paint(); });
paint();
})();
</script>

<script>
/* закреплённая горизонтальная прокрутка таблиц */
(function(){
  var bar=document.createElement("div"); bar.id="hbar"; bar.innerHTML="<div></div>"; document.body.appendChild(bar);
  var spacer=bar.firstChild, cur=null, lock=false, raf=0;
  function pick(){
    var ws=document.querySelectorAll(".tbl-wrap"), vh=window.innerHeight;
    for(var i=0;i<ws.length;i++){
      var w=ws[i]; if(w.scrollWidth<=w.clientWidth+1) continue;
      var r=w.getBoundingClientRect();
      if(r.width>0 && r.top<vh-60 && r.bottom>vh-2) return w;
    }
    return null;
  }
  function upd(){
    raf=0; var w=pick();
    if(!w){ bar.style.display="none"; cur=null; return; }
    cur=w; var r=w.getBoundingClientRect();
    bar.style.display="block"; bar.style.left=r.left+"px"; bar.style.width=r.width+"px";
    spacer.style.width=w.scrollWidth+"px";
    if(Math.abs(bar.scrollLeft-w.scrollLeft)>1){ lock=true; bar.scrollLeft=w.scrollLeft; }
  }
  function sched(){ if(!raf) raf=requestAnimationFrame(upd); }
  bar.addEventListener("scroll",function(){ if(lock){lock=false;return;} if(cur){ cur.scrollLeft=bar.scrollLeft; } });
  document.addEventListener("scroll",function(e){ if(cur && e.target===cur && Math.abs(bar.scrollLeft-cur.scrollLeft)>1){ lock=true; bar.scrollLeft=cur.scrollLeft; } else sched(); },true);
  window.addEventListener("scroll",sched,{passive:true});
  window.addEventListener("resize",sched);
  setInterval(sched,400);
  sched();
})();
</script>
