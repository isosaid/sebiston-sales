/* All coordinates below are taken 1:1 from the design (1377x1025 frame). */
:root{
  --bg:#f2f3f7; --ink:#252525; --muted:#6a6a6a; --ph:#9498aa; --line:#e4e5ea;
  --g-dark:#2f9446; --g:#27aa45; --g-soft:#f1f8f2; --g-tick:#e7f5e9; --seg-ink:#167338;
  --off-label:#a7a7a7; --off-ph:#d4d5dd; --disabled:#9498aa; --lang-off:#d9d9d9; --dd:#212121;
  --splash-green:#6aa55c;
  --page-bg:#0e0f12;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --page-bg:#0e0f12; } }
:root[data-theme="dark"]{ --page-bg:#0e0f12; }
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);overflow:hidden;
  -webkit-font-smoothing:antialiased;font-feature-settings:"cv11" 0}
button,input{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
.abs{position:absolute}
.t{position:absolute;white-space:nowrap}

#frame{position:fixed;inset:0;overflow:hidden;overflow:clip}
/* the stage always fills the whole window: extra width/height (--dx/--dy) is absorbed by the photo and the background */
#stage{position:absolute;left:0;top:0;width:1377px;height:1025px;--dx:0px;--dy:0px;background:var(--bg);overflow:hidden;overflow:clip;transform-origin:0 0}
.wrap{position:absolute;inset:0;transform:translate(var(--dx),calc(var(--dy) / 2))}
.screen{position:absolute;inset:0;overflow:hidden;overflow:clip;opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s}
.screen.on{opacity:1;visibility:visible}

/* ---------- Splash ---------- */
#splash{background:var(--bg);cursor:pointer}
#splash .biglogo{position:absolute;left:60px;top:45px;height:268px;width:auto}
#splash .panel{position:absolute;left:60px;right:60px;top:344px;bottom:32px;background:var(--splash-green);border-radius:50px}
#splash .bld{position:absolute;left:-22px;right:-22px;top:196px;width:calc(100% + 44px);height:calc(100% - 196px);object-fit:cover;object-position:50% 0}
#splash .arc{position:absolute;left:calc(50% - 475px);bottom:-792px;width:950px;height:950px;border-radius:50%;background:#fff}
#splash .enter{position:absolute;left:0;right:0;bottom:69px;text-align:center;font:600 30px/30px Inter,sans-serif;letter-spacing:-.6px;color:var(--ink)}
/* ---------- Splash: оживление — движение вверх, все фигуры двигаются ---------- */
#splash .biglogo{will-change:transform;animation:sbLogoIn .9s cubic-bezier(.2,.8,.2,1) both, sbFloatLogo 6s ease-in-out 1s infinite}
#splash .panel{transform-origin:50% 100%;will-change:transform;animation:sbPanelIn .8s cubic-bezier(.2,.8,.2,1) both, sbBreathe 7s ease-in-out 1.1s infinite}
#splash .bld{transform-origin:50% 60%;will-change:transform;animation:sbBldIn 1.1s ease .15s both, sbKenBurns 18s ease-in-out 1.3s infinite alternate}
#splash .arc{will-change:transform;animation:sbArcIn 1s cubic-bezier(.2,.8,.2,1) .2s both, sbFloatArc 8s ease-in-out 1.2s infinite}
#splash .enter{will-change:transform;animation:sbEnterIn .6s ease .9s both, sbEnterPulse 2.6s ease-in-out 1.6s infinite}
@keyframes sbLogoIn{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
@keyframes sbFloatLogo{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
@keyframes sbPanelIn{from{opacity:0;transform:scaleY(.86)}to{opacity:1;transform:scaleY(1)}}
@keyframes sbBreathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.02)}}
@keyframes sbBldIn{from{opacity:0}to{opacity:1}}
@keyframes sbKenBurns{0%{transform:scale(1.02) translateY(0)}100%{transform:scale(1.09) translateY(-3%)}}
@keyframes sbArcIn{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:translateY(0)}}
@keyframes sbFloatArc{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes sbEnterIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes sbEnterPulse{0%,100%{opacity:.78;transform:translateY(0) scale(1)}50%{opacity:1;transform:translateY(-6px) scale(1.06)}}
@media (prefers-reduced-motion:reduce){#splash .biglogo,#splash .panel,#splash .bld,#splash .arc,#splash .enter{animation:none}}

#attract{position:absolute;inset:0;z-index:30;background:#000;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility .6s;cursor:pointer}
#attract.on{opacity:1;visibility:visible}
#attract video{width:100%;height:100%;object-fit:cover;display:block}
#attract .tap{position:absolute;left:0;right:0;bottom:56px;display:flex;justify-content:center}
#attract .tap span{background:rgba(255,255,255,.92);color:#222;font-weight:700;font-size:22px;padding:16px 34px;border-radius:40px;animation:pulse 2.4s ease-in-out infinite;box-shadow:0 8px 30px rgba(0,0,0,.25)}
@keyframes pulse{50%{transform:scale(1.06)}}

/* ---------- card & fields ---------- */
.card{left:482px;width:835px;background:#fff;border-radius:10px}
.lab{position:absolute;font:500 16px/16px Inter,sans-serif;letter-spacing:-.36px;color:var(--ink);white-space:nowrap}
.box{position:absolute;height:71px;border:1px solid var(--line);border-radius:10px;background:#fff;display:block}
.box input{position:absolute;left:23px;right:12px;top:0;bottom:0;border:0;outline:0;background:transparent;font:500 16px Inter,sans-serif;letter-spacing:-.46px;color:var(--ink);width:auto}
.box input::placeholder{color:var(--ph);opacity:1}
.box.code input::placeholder{color:var(--ink)}
.box:focus-within{border-color:var(--g)}
.box.bad{border-color:#e5484d}
.box .ph,.box .val{position:absolute;left:23px;right:64px;top:27px;font:500 16px/16px Inter,sans-serif;letter-spacing:-.46px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.box .ph{color:var(--ph)}.box .val{color:var(--ink)}
.box .chev{position:absolute;right:28px;top:29px;width:22px;height:12px}
.pick{cursor:pointer;text-align:left}
.off .lab,.lab.off{color:var(--off-label)}
.box.off{pointer-events:none}.box.off .ph{color:var(--off-ph)}.box.off .chev path{stroke:#c9cad3}
.phone .pre{position:absolute;left:24px;top:27px;font:500 16px/16px Inter,sans-serif;letter-spacing:-.46px;color:var(--ink)}
.phone input{left:70px}
.phone .mask{position:absolute;left:70px;top:26px;font:500 16px/16px Inter,sans-serif;color:var(--ph);pointer-events:none;white-space:pre}
.phone .mask i{position:absolute;top:0;font-style:normal}
.phone .mask u{position:absolute;top:14px;width:15.7px;height:1.2px;background:#c3c5d0}
.btn{position:absolute;border-radius:10px;background:var(--g);color:#fff;font:600 20px/66px Inter,sans-serif;letter-spacing:.48px;text-align:center;height:66px}
.btn:active{filter:brightness(.93)}
.btn.dis{background:var(--disabled);cursor:not-allowed;filter:none}
.note{position:absolute;font:500 14px/14px Inter,sans-serif;letter-spacing:.29px;color:var(--ph);white-space:nowrap}
.note.c{left:482px;width:835px;text-align:center}

.person{position:absolute;left:501px;width:797px;height:161px;background:var(--g-soft);border-radius:10px}
.person .nm{position:absolute;left:39px;top:50px;font:600 25px/25px Inter,sans-serif;letter-spacing:-.51px;color:var(--ink);white-space:nowrap}
.person .ln{position:absolute;left:38px;top:92px;font:400 20px/20px Inter,sans-serif;letter-spacing:-.22px;color:var(--muted);white-space:nowrap}
.person .ck{position:absolute;left:571px;top:64px;width:34px;height:34px;border-radius:50%;background:var(--g-dark);display:grid;place-items:center}
.person .ok{position:absolute;left:617px;top:71px;font:600 16px/16px Inter,sans-serif;letter-spacing:-.47px;color:var(--ink);white-space:nowrap}
.pline{position:absolute;left:501px;width:797px;display:flex;justify-content:space-between;font:500 16px/16px Inter,sans-serif;letter-spacing:-.46px;color:var(--ink)}

/* ---------- dropdown (справочники) ---------- */
#ddCatch{position:absolute;inset:-3000px;z-index:20;display:none}
#ddCatch.on{display:block}
#dd{position:absolute;z-index:21;width:799px;background:var(--dd);border-radius:22px;color:#fff;padding:21px 0 12px;display:none;
  box-shadow:0 18px 50px rgba(0,0,0,.28)}
#dd.on{display:block;animation:ddin .16s ease-out}
@keyframes ddin{from{opacity:0;transform:translateY(-6px)}}
#dd .hd{position:relative;height:16px;margin:0 0 13px 24px;font:700 16px/16px Inter,sans-serif;letter-spacing:-.52px;cursor:pointer}
#dd .ok{position:absolute;right:33px;top:-2px;width:18px;height:20px;cursor:pointer}
#dd .ok::before{content:"";position:absolute;inset:-14px -16px}
#dd .opt{position:relative;display:block;width:100%;height:41px;padding:12px 0 0 24px;font:400 16px/16px Inter,sans-serif;letter-spacing:-.24px;color:#fff;cursor:pointer;white-space:nowrap}
#dd .opt svg{position:absolute;right:33px;top:10px;width:16px;height:18px;opacity:0}
#dd .opt.sel svg{opacity:1}
#dd .opt:active{color:#cfe9d5}

/* ---------- success ---------- */
.okcard{left:482px;top:114px;width:835px;height:866px;background:#fff;border-radius:10px}
.tick{position:absolute;width:83px;height:83px;border-radius:50%;background:var(--g-tick);display:grid;place-items:center;left:858px}
.oktitle{left:482px;width:835px;text-align:center;font:700 25px/25px Inter,sans-serif;letter-spacing:-.7px;color:var(--ink)}
.oktext{left:600px;width:600px;text-align:center;font:400 16px/19px Inter,sans-serif;letter-spacing:-.24px;color:var(--ink);white-space:normal}
.okbtn{left:591px;width:617px}
</style>
</head>

      ? [F("name",391,423,501,394),F("phone",391,423,906,392),F("agency",521,554,501,797,72),F("jk",651,684),F("goal",779,812)]
      : [F("name",391,423,501,394),F("phone",391,423,906,392),F("company",521,554,501,394,72),F("email",521,554,906,394,72),F("dir",651,684),F("goal",779,812)];
  }
  return L;
}

function phoneBox(f,off){
  const empty=!data.phone;
  return `<div class="box phone${off}${bad(f.k)}" style="left:${f.x}px;top:${f.inp}px;width:${f.w}px">
    <span class="pre">+992</span>
    <span class="mask" style="${empty?"":"display:none"}"><i style="left:0">(</i><i style="left:46px">)</i><u style="left:70px"></u><u style="left:104px"></u><u style="left:138px"></u></span>
    <input id="i_phone" inputmode="numeric" autocomplete="off" value="${esc(fmtPhone(data.phone))}" aria-label="${t("phone")}"></div>`;
}
function bad(k){
  if(!tried) return "";
  const ok={name:data.name.trim().length>1, phone:phoneOk(), vphone:phoneOk(), email:emailOk(), agency:!!data.agency.trim(), company:!!data.company.trim(),
            jk:data.jk.length>0, goal:data.goal!=null, dir:data.dir!=null, code:true}[k];
  return ok===false ? " bad":"";
}
function field(f,locked){
  const lockMe = locked && (f.k==="jk"||f.k==="goal");
  const off = lockMe ? " off":"";
  const lab = {name:"name",phone:"phone",vphone:"phone",code:"code",email:"email",agency:"agency",company:"company",jk:"jk",goal:"goal",dir:"dir"}[f.k];
  let h=`<div class="lab${lockMe?" off":""}" style="left:${f.x}px;top:${f.lab}px">${t(lab)}</div>`;
  const st=`left:${f.x}px;top:${f.inp}px;width:${f.w}px;height:${f.h}px`;
  const inp=(id,val,ph,type="text",extra="")=>`<div class="box${off}${bad(f.k)} ${extra}" style="${st}"><input id="${id}" type="${type}" autocomplete="off" placeholder="${esc(ph)}" value="${esc(val)}"></div>`;
  switch(f.k){
    case "name": h+=inp("i_name",data.name,t("name_ph")); break;
    case "email": h+=inp("i_email",data.email,role==="partner"?t("email_ph2"):t("email_ph"),"email"); break;
    case "agency": h+=inp("i_agency",data.agency,t("agency_ph")); break;
    case "company": h+=inp("i_company",data.company,t("company_ph")); break;
    case "phone": case "vphone": h+=phoneBox(f,off); break;
    case "code": h+=`<div class="box code" style="${st}"><input id="i_code" type="password" inputmode="numeric" autocomplete="one-time-code" placeholder="**********" value="${esc(data.code)}"></div>`; break;
    case "jk": case "goal": case "dir": {
      const val = f.k==="jk" ? data.jk.join(", ") : f.k==="goal" ? (data.goal!=null?T[lang].goals[role][data.goal]:"") : (data.dir!=null?T[lang].dirs[data.dir]:"");
      const ph = t(f.k+"_ph");
      h+=`<button type="button" class="box pick${off}${bad(f.k)}" data-pick="${f.k}" style="${st}">${val?`<span class="val">${esc(val)}</span>`:`<span class="ph">${ph}</span>`}${CHEV}</button>`;
    }
  }
  return h;
}

function render(){
  const L=layout();
  const tabCol = (role==="buyer"||role==="client") ? "var(--g-dark)" : "var(--g)";
  $$("#tabs .tab").forEach(b=>{const on=b.dataset.role===role; b.classList.toggle("on",on); b.style.background=on?tabCol:"#fff";});
  const hasSeg = role==="broker"||role==="partner";
  $("#segs").style.display = hasSeg ? "" : "none";
  $$("#segs .seg").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));
  let h=`<div class="abs card" style="top:${L.card[0]}px;height:${L.card[1]}px"></div>`;
  for(const f of L.items){
    if(f.k==="confirm"){ h+=`<button class="btn" id="verify" style="left:501px;top:${f.y}px;width:797px">${t("code_btn")}</button>`; continue; }
    if(f.k==="person"){ const p=DEMO_PROFILE[role];
      h+=`<div class="person" style="top:${f.y}px"><div class="nm">${esc(p.name)}</div><div class="ln">${esc(p.line())}</div>
          <div class="ck">${TICK_W}</div><div class="ok">${t("confirmed")}</div></div>`; continue; }
    if(f.k==="pline"){ h+=`<div class="pline" style="top:${f.y}px"><span>${t("yourphone")}</span><span>${esc(maskPhone(data.phone))}</span></div>`; continue; }
    h+=field(f,L.locked);
  }
  if(L.note){ h+= L.note.c ? `<div class="note c" style="top:${L.note.y}px">${t(L.note.k)}</div>`
                           : `<div class="note" style="left:${L.note.x}px;top:${L.note.y}px">${t(L.note.k)}</div>`; }
  $("#body").innerHTML=h;
  const sb=$("#submit"); sb.textContent=t("submit"); sb.classList.toggle("dis",L.submitOff);
  bind();
}

/* ---------- phone helpers ---------- */
function digits(s){return String(s).replace(/\D/g,"").slice(0,9);}
function fmtPhone(d){d=digits(d);let o="";if(d.length){o="("+d.slice(0,2);if(d.length>=2)o+=")";if(d.length>2)o+=" "+d.slice(2,5);if(d.length>5)o+=" "+d.slice(5,7);if(d.length>7)o+=" "+d.slice(7,9);}return o;}
function maskPhone(d){d=digits(d);return d.length===9?`+992 ${d.slice(0,2)} *** ** ${d.slice(7)}`:"+992 ** *** ** **";}

/* ---------- validation ---------- */
const phoneOk=()=>digits(data.phone).length===9;
const emailOk=()=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(data.email);
function valid(){
  if(role==="buyer") return data.name.trim().length>1&&phoneOk()&&emailOk()&&data.jk.length&&data.goal!=null;
  if(role==="client") return verified&&data.jk.length>0&&data.goal!=null;
  if(mode==="reg") return verified&&(role==="broker"?data.jk.length>0:data.goal!=null);
  if(role==="broker") return data.name.trim().length>1&&phoneOk()&&data.agency.trim()&&data.jk.length&&data.goal!=null;
  return data.name.trim().length>1&&phoneOk()&&data.company.trim()&&emailOk()&&data.dir!=null&&data.goal!=null;
}

function bind(){
  const on=(id,fn)=>{const e=$(id); if(e) e.addEventListener("input",fn);};
  const clr=e=>e.target.closest(".box")&&e.target.closest(".box").classList.remove("bad");
  on("#i_name",e=>{data.name=e.target.value;clr(e);});
  on("#i_email",e=>{data.email=e.target.value;clr(e);});
  on("#i_agency",e=>{data.agency=e.target.value;clr(e);});
  on("#i_company",e=>{data.company=e.target.value;clr(e);});
  on("#i_code",e=>{data.code=e.target.value;clr(e);});
  const ph=$("#i_phone");
  if(ph) ph.addEventListener("input",e=>{data.phone=digits(e.target.value);e.target.value=fmtPhone(data.phone);
     const m=ph.parentNode.querySelector(".mask"); if(m) m.style.display=data.phone?"none":""; clr(e);});
  const vb=$("#verify");
  if(vb) vb.addEventListener("click",()=>{
    if(!phoneOk()){ph.closest(".box").classList.add("bad");ph.focus();return;}
    if(!codeSent){ codeSent=true; $("#i_code").focus(); }            // DEMO: SMS with a code would be requested here
    if(data.code.trim().length<4){ const c=$("#i_code"); c.closest(".box").classList.add("bad"); c.focus(); return; }
    verified=true; render();                                         // DEMO: any 4+ character code is accepted
  });
  $$("[data-pick]").forEach(b=>b.addEventListener("click",()=>openDD(b.dataset.pick,b)));
}

/* ---------- dropdown lists (справочники) ---------- */
let ddKey=null;
function openDD(k,anchor){
  ddKey=k; const L=T[lang];
  const title = k==="jk"?L.jk_title : k==="goal"?L.goal_title : L.dir_title;
  const items = k==="jk"?JK : k==="goal"?L.goals[role] : L.dirs;
  const sel=i=> k==="jk"?data.jk.includes(JK[i]) : k==="goal"?data.goal===i : data.dir===i;
  const dd=$("#dd");
  dd.innerHTML=`<div class="hd" id="ddOk">${esc(title)}<span class="ok">${CHECK_DD}</span></div>`+
    items.map((n,i)=>`<div role="option" tabindex="0" class="opt${sel(i)?" sel":""}" data-i="${i}">${esc(n)}${CHECK_DD}</div>`).join("");
  const h = 21+16+13+items.length*41+12;
  const top = Math.max(10, Math.min(parseInt(anchor.style.top), 1025-10-h));
  dd.style.left="500px"; dd.style.top=top+"px";
  dd.classList.add("on"); $("#ddCatch").classList.add("on");
  $("#ddOk").addEventListener("click",closeDD);
  $$("#dd .opt").forEach(b=>b.addEventListener("click",()=>{
    const i=+b.dataset.i;
    if(k==="jk"){ const n=JK[i]; data.jk=data.jk.includes(n)?data.jk.filter(x=>x!==n):[...data.jk,n]; b.classList.toggle("sel"); }
    else { if(k==="goal") data.goal=i; else data.dir=i; closeDD(); }
  }));
}
function closeDD(){ $("#dd").classList.remove("on"); $("#ddCatch").classList.remove("on"); ddKey=null; render(); }
$("#ddCatch").addEventListener("click",closeDD);

/* ---------- отправка визитов ----------
   Визиты уходят в тот же Google Apps Script, что и основное приложение,
   в лист «Визиты». При плохом интернете они копятся в очереди (localStorage)
   и досылаются сами. BITRIX_WEBHOOK можно вписать позже — тогда визит
   продублируется и в Битрикс как лид (crm.lead.add). */
const SHEET_API="https://script.google.com/macros/s/AKfycbwAwrts4_R3JlbBpfUKtaGtwRTDNDSb_BX3C-CQ0-ZtHm3KBJEWVT4t8NnSwH04RKra/exec";
const CONFIG={ BITRIX_WEBHOOK:"" };
const ROLE_RU={buyer:"Покупатель",client:"Клиент",broker:"Брокер",partner:"Партнёр"};
const QKEY="sebiston_visit_queue";
const getQ=()=>{try{return JSON.parse(localStorage.getItem(QKEY)||"[]");}catch(e){return [];}};
const setQ=q=>{try{localStorage.setItem(QKEY,JSON.stringify(q));}catch(e){}};
function buildVisit(){
  const ru=T.ru, isReg = role!=="buyer" && (role==="client" || mode==="reg");
  const goal = data.goal!=null ? ru.goals[role][data.goal] : "";
  const dir  = data.dir!=null ? ru.dirs[data.dir] : "";
  const who  = verified ? DEMO_PROFILE[role].name : data.name.trim();
  const id   = Date.now()+"-"+Math.random().toString(36).slice(2,7);
  const phone= "+992"+digits(data.phone);
  const lines=[ "Роль: "+ROLE_RU[role], (role!=="buyer"?"Режим: "+(isReg?"уже зарегистрирован":"первый визит"):""),
    data.jk.length?"Интересующие ЖК: "+data.jk.join(", "):"", goal?"Цель визита: "+goal:"",
    data.agency?"Агентство: "+data.agency:"", data.company?"Компания: "+data.company:"", dir?"Направление: "+dir:"",
    "Язык интерфейса: "+lang.toUpperCase(), "Время визита: "+new Date().toISOString() ].filter(Boolean);
  return { id:id,
    /* плоская запись для листа «Визиты» в Google-таблице */
    v:{ id:id, at:new Date().toISOString(), role:ROLE_RU[role],
        mode: role!=="buyer" ? (isReg?"уже зарегистрирован":"первый визит") : "",
        name:who, phone:phone, email:data.email?data.email.trim():"",
        jk:(data.jk||[]).slice(), goal:goal, agency:data.agency||"", company:data.company||"",
        dir:dir, lang:lang.toUpperCase() },
    /* запасной формат — если позже впишут BITRIX_WEBHOOK (crm.lead.add) */
    fields:{ TITLE:"Визит в офис: "+ROLE_RU[role]+" — "+(who||data.phone), NAME:who,
      PHONE:[{VALUE:phone,VALUE_TYPE:"WORK"}],
      ...(data.email?{EMAIL:[{VALUE:data.email.trim(),VALUE_TYPE:"WORK"}]}:{}),
      SOURCE_DESCRIPTION:"Киоск регистрации визита", COMMENTS:lines.join("\n") } };
}
async function sendOne(v){
  let okSheet=false;
  if(SHEET_API){
    try{ const r=await fetch(SHEET_API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({a:"visit",v:v.v})});
         const j=await r.json(); okSheet=!!(r.ok&&j&&j.ok); }catch(e){ okSheet=false; }
  }
  if(CONFIG.BITRIX_WEBHOOK){
    try{ await fetch(CONFIG.BITRIX_WEBHOOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:v.fields,params:{REGISTER_SONET_EVENT:"N"}})}); }catch(e){}
  }
  /* успехом считаем запись в таблицу; если таблица не задана — ориентируемся на Битрикс */
  return SHEET_API ? okSheet : false;
}
let flushing=false;
async function flush(){ if(flushing||!(SHEET_API||CONFIG.BITRIX_WEBHOOK)) return; flushing=true;
  try{ let q=getQ(); const rest=[]; for(const v of q){ if(!(await sendOne(v))) rest.push(v); } setQ(rest); }finally{ flushing=false; } }
addEventListener("online",flush); setInterval(flush,60000); flush();

/* ---------- success screen ---------- */
function showDone(){
  const P = role==="buyer" ? {c:339,ti:451,tx:509,b:690} : {c:326,ti:438,tx:496,b:797};
  $("#okTick").style.top=P.c+"px"; $("#okTitle").style.top=P.ti+"px";
  const tx=$("#okText"); tx.style.top=P.tx+"px"; tx.innerHTML=t("ok_"+role);
  const fb=$("#finish"); fb.style.top=P.b+"px";
  show("done"); doneT=setTimeout(goHome,20000);
}
let doneT=null;

/* ---------- navigation ---------- */
function show(id){ $$(".screen").forEach(s=>s.classList.toggle("on",s.id===id)); }
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.dataset.role===role)return; role=b.dataset.role;mode="reg";reset();render();});
$("#segs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b||b.dataset.mode===mode)return; mode=b.dataset.mode;reset();render();});
$("#submit").addEventListener("click",()=>{
  if($("#submit").classList.contains("dis")) return;
  if(!valid()){ tried=true; render(); return; }
  const v=buildVisit(); setQ([...getQ(),v]); flush();   // queued first, so a visit is never lost on a bad connection
  showDone(); });
$("#finish").addEventListener("click",goHome);
function goHome(){ clearTimeout(doneT); reset(); role="buyer"; mode="reg"; render(); show("splash"); armAttract(); }

let idle=null;
function bump(){ clearTimeout(idle); idle=setTimeout(()=>{ if($("#form").classList.contains("on")) goHome(); },90000); }
["pointerdown","keydown","input"].forEach(ev=>document.addEventListener(ev,bump,{passive:true}));

$("#splash").addEventListener("click",()=>{ show("form"); bump(); clearAttract(); });

/* attract mode: after ATTRACT_AFTER seconds on the splash screen the construction video plays;
   the first touch only wakes the screen. Replace attract.mp4 with your own video any time. */
const ATTRACT_AFTER=15;
const av=$("#attractVideo"), ao=$("#attract");
let aT=null, aBroken=false;
av.addEventListener("error",()=>{aBroken=true;},true);
function clearAttract(){ clearTimeout(aT); aT=null; }
function armAttract(){ clearAttract(); if(aBroken) return;
  aT=setTimeout(()=>{ if(!$("#splash").classList.contains("on")) return;
    ao.classList.add("on"); const p=av.play(); if(p&&p.catch) p.catch(()=>{ao.classList.remove("on");aBroken=true;}); },ATTRACT_AFTER*1000); }
function wake(){ ao.classList.remove("on"); setTimeout(()=>{ if(!ao.classList.contains("on")) av.pause(); },650); armAttract(); }
ao.addEventListener("pointerdown",e=>{ e.stopPropagation(); e.preventDefault(); wake(); });
document.addEventListener("pointerdown",()=>{ if($("#splash").classList.contains("on")&&!ao.classList.contains("on")) armAttract(); },{passive:true});
armAttract();

/* language */
function setLang(l){ lang=l; document.documentElement.lang=l==="tg"?"tg":"ru";
  $$("[data-lang]").forEach(b=>b.classList.toggle("on",b.dataset.lang===l));
  $$("[data-i]").forEach(el=>{ if(T[l][el.dataset.i]!==undefined) el.textContent=T[l][el.dataset.i]; });
  render(); if($("#done").classList.contains("on")) $("#okText").innerHTML=t("ok_"+role); }
document.addEventListener("click",e=>{const b=e.target.closest("[data-lang]"); if(b) setLang(b.dataset.lang);});

/* never let focus scroll the fixed kiosk layout */
["#frame","#stage",".screen"].forEach(q=>$$(q).forEach(el=>el.addEventListener("scroll",()=>{el.scrollTop=0;el.scrollLeft=0;})));
addEventListener("scroll",()=>scrollTo(0,0));
/* fit the 1377x1025 stage to the window */
function fit(){ const w=innerWidth,h=innerHeight, s=Math.min(w/1377,h/1025), st=$("#stage");
  const W=w/s, H=h/s; st.style.width=W+"px"; st.style.height=H+"px"; st.style.transform=`scale(${s})`;
  st.style.setProperty("--dx",(W-1377)+"px"); st.style.setProperty("--dy",(H-1025)+"px"); }
addEventListener("resize",fit); fit();

setLang("ru");
</script>
