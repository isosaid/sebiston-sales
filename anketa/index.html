<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sebiston — анкета</title>
<meta name="theme-color" content="#f2f3f7">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#27aa45;--g-dark:#1f8a3a;--g-soft:#eaf6ee;--ink:#1d1d1f;--ph:#8b8fa0;--line:#e4e5ea;--bg:#f2f3f7;--card:#fff;--err:#e5484d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.4 Inter,system-ui,sans-serif}
.page{max-width:880px;margin:0 auto;padding:28px 20px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}
.top img{height:38px}
.langs{display:flex;gap:8px}
.langs button{border:0;border-radius:12px;padding:11px 16px;font:700 15px/1 Inter,sans-serif;background:#e2e3e8;color:#222;cursor:pointer}
.langs button.on{background:var(--g);color:#fff}
.qtop{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:16px;margin-bottom:18px;background:linear-gradient(120deg,#eaf6ee 0%,#f6fbf7 60%,#fff 100%);border:1px solid #d3ecd9}
.qico{width:52px;height:52px;border-radius:14px;background:var(--g);display:grid;place-items:center;flex:none;box-shadow:0 6px 16px rgba(39,170,69,.28)}
.qtxt{flex:1;min-width:0}
.qhd{font:700 22px/27px Inter,sans-serif;letter-spacing:-.5px}
.qsub{font:500 14px/19px Inter,sans-serif;color:#6b6f80;margin-top:3px}
.qprog{flex:none;text-align:right;font:600 13px/16px Inter,sans-serif;color:#4c8f5f}
.qprog b{display:block;font:700 24px/28px Inter,sans-serif;color:var(--g)}
.qbar{height:4px;width:96px;border-radius:4px;background:#d3ecd9;margin-top:6px;overflow:hidden}
.qbar i{display:block;height:100%;width:0;background:var(--g);border-radius:4px;transition:width .35s}
.card{background:var(--card);border-radius:16px;padding:22px 22px 6px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,30,50,.04)}
.who{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.lab{display:block;font:500 14px/18px Inter,sans-serif;margin-bottom:8px}
.inp{width:100%;height:56px;border:1px solid var(--line);border-radius:12px;padding:0 18px;font:500 17px Inter,sans-serif;color:var(--ink);background:#fff;outline:none}
.inp:focus{border-color:var(--g)}
.inp.bad{border-color:var(--err)}
.ph{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;height:56px;padding-left:18px;background:#fff}
.ph:focus-within{border-color:var(--g)}
.ph.bad{border-color:var(--err)}
.ph span{font:500 17px Inter,sans-serif;color:#333;margin-right:6px}
.ph input{border:0;outline:0;flex:1;height:100%;font:500 17px Inter,sans-serif;background:transparent;min-width:0}
.qblock{margin-bottom:24px}
.qq{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qn{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 13px/1 Inter;color:#7a7e8e;background:#eef0f4;transition:.2s}
.qblock.done .qn{background:var(--g);color:#fff}
.qq .q{font:600 16px/21px Inter,sans-serif;letter-spacing:-.3px}
.chips{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:10px}
.chip{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;min-height:58px;padding:8px 28px;border:1.5px solid #dfe1e8;border-radius:12px;background:#fff;
  font:500 15px/19px Inter,sans-serif;color:var(--ink);cursor:pointer;transition:background-color .18s,border-color .18s,color .18s,box-shadow .18s,transform .1s}
.chip:active{transform:scale(.97)}
.chip i{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;border:1.5px solid #cfd2db;display:grid;place-items:center;background:#fff;transition:.18s}
.chip.on{background:linear-gradient(180deg,#f1faf3,#e6f5ea);border-color:var(--g);color:#14632f;font-weight:600;box-shadow:0 4px 14px rgba(39,170,69,.16)}
.chip.on i{background:var(--g);border-color:var(--g)}
.chip i svg{opacity:0}.chip.on i svg{opacity:1}
.send{width:100%;height:62px;border:0;border-radius:12px;background:var(--g);color:#fff;font:700 18px Inter,sans-serif;letter-spacing:.3px;cursor:pointer;margin-top:4px}
.send:disabled{opacity:.6}
.msg{min-height:22px;text-align:center;font:500 14px Inter,sans-serif;color:var(--err);margin:10px 0 0}
.note{text-align:center;font:500 12.5px/17px Inter,sans-serif;color:var(--ph);margin-top:10px}
.fin{display:none;text-align:center;background:#fff;border-radius:18px;padding:56px 24px}
.fin .tick{width:84px;height:84px;border-radius:50%;background:#e7f4ea;display:grid;place-items:center;margin:0 auto 22px}
.fin h2{margin:0 0 10px;font:700 25px/30px Inter,sans-serif}
.fin p{margin:0 auto 26px;max-width:460px;color:#555}
body.ok .form{display:none} body.ok .fin{display:block}
@media (max-width:640px){
  .page{padding:18px 14px 30px}
  .who{grid-template-columns:1fr}
  .qtop{flex-wrap:wrap;padding:14px;gap:12px}.qico{width:42px;height:42px}.qhd{font-size:19px;line-height:23px}
  .qprog{width:100%;display:flex;align-items:center;gap:10px;text-align:left}.qprog b{display:inline;font-size:17px}.qbar{flex:1;margin:0}
  .chips{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.chips[style*="--n:3"]{grid-template-columns:repeat(3,minmax(0,1fr))}
  .chip{min-height:54px;padding:10px 12px;font-size:14px;line-height:17px}
  .chip i{top:-7px;right:-5px;opacity:0;transform:scale(.6);box-shadow:0 0 0 2px #fff}.chip.on i{opacity:1;transform:none}
  .card{padding:18px 14px 4px}
}
</style>
</head>

    <div class="qtop"><div class="qico"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-5.5h4V20"/></svg></div>
      <div class="qtxt"><div class="qhd" data-t="title"></div><div class="qsub" data-t="hint"></div></div>
      <div class="qprog"><span data-t="prog"></span><b id="pn">0 / 5</b><div class="qbar"><i id="pb"></i></div></div></div>
    <div class="card">
      <div class="who">
        <div><label class="lab" for="nm" data-t="name"></label><input class="inp" id="nm" autocomplete="name" data-p="name_ph"></div>
        <div><label class="lab" for="ph" data-t="phone"></label><div class="ph" id="phw"><span>+992</span><input id="ph" type="tel" inputmode="numeric" autocomplete="tel" placeholder="90 000 00 00" maxlength="14"></div></div>

<script>
const API="https://script.google.com/macros/s/AKfycbwAwrts4_R3JlbBpfUKtaGtwRTDNDSb_BX3C-CQ0-ZtHm3KBJEWVT4t8NnSwH04RKra/exec";
const T={
 ru:{title:"Пара вопросов о будущей квартире",hint:"Можно отметить несколько вариантов — так менеджер подберёт точнее",prog:"Отвечено",name:"Имя и фамилия",name_ph:"Как к вам обращаться",phone:"Телефон",
   send:"Отправить ответы",note:"Нажимая «Отправить», вы даёте согласие на обработку персональных данных",ok_t:"Спасибо! Ответы получены",ok_p:"Менеджер подберёт для вас подходящие варианты и свяжется с вами.",again:"Заполнить ещё раз",
   e_name:"Укажите имя",e_phone:"Укажите номер телефона — 9 цифр",e_quiz:"Ответьте хотя бы на один вопрос",e_net:"Нет связи — ответы сохранены и отправятся, когда появится интернет",
   quiz:[
  {k:"district",q:"В каком районе планируете купить квартиру?",o:["Центр","Спальный район","Не принципиально"]},
  {k:"rooms",q:"Тип квартиры",o:["1-комнатная","2-комнатная","3-комнатная","4 и более комнат"]},
  {k:"area",q:"Предпочтительная площадь",o:["до 50 м²","50–70 м²","70–90 м²","более 100 м²"]},
  {k:"floor",q:"На каком этаже вы бы хотели жить?",o:["до 5 этажа","до 9 этажа","выше 10 этажа"]},
  {k:"source",q:"Откуда вы узнали о нас?",o:["Instagram | Социальные сети","Рекомендации знакомых","Проезжал(а) мимо объекта","Уже покупал(а) у вас квартиру"]}]},
 tg:{title:"Чанд савол дар бораи хонаи оянда",hint:"Якчанд вариантро қайд кардан мумкин аст — менеҷер дақиқтар интихоб мекунад",prog:"Ҷавоб дода шуд",name:"Ном ва насаб",name_ph:"Ба шумо чӣ тавр муроҷиат кунем",phone:"Телефон",
   send:"Фиристодани ҷавобҳо",note:"Бо пахш кардани «Фиристодан» шумо ба коркарди маълумоти шахсӣ розӣ мешавед",ok_t:"Ташаккур! Ҷавобҳо қабул шуданд",ok_p:"Менеҷер барои шумо вариантҳои мувофиқро интихоб карда, бо шумо тамос мегирад.",again:"Боз пур кардан",
   e_name:"Номро нависед",e_phone:"Рақами телефонро нависед — 9 рақам",e_quiz:"Ақаллан ба як савол ҷавоб диҳед",e_net:"Интернет нест — ҷавобҳо нигоҳ дошта шуданд ва баъдтар фиристода мешаванд",
   quiz:[
  {k:"district",q:"Дар кадом ноҳия хона харидан мехоҳед?",o:["Марказ","Ноҳияи истиқоматӣ","Фарқ надорад"]},
  {k:"rooms",q:"Навъи хона",o:["1-ҳуҷрагӣ","2-ҳуҷрагӣ","3-ҳуҷрагӣ","4 ва зиёда ҳуҷра"]},
  {k:"area",q:"Масоҳати дилхоҳ",o:["то 50 м²","50–70 м²","70–90 м²","зиёда аз 100 м²"]},
  {k:"floor",q:"Дар кадом ошёна зиндагӣ кардан мехоҳед?",o:["то ошёнаи 5","то ошёнаи 9","болотар аз ошёнаи 10"]},
  {k:"source",q:"Дар бораи мо аз куҷо фаҳмидед?",o:["Instagram | Шабакаҳои иҷтимоӣ","Тавсияи шиносҳо","Аз назди объект гузаштам","Аллакай аз шумо хона харидаам"]}]}};
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lang=(new URLSearchParams(location.search).get("lang")==="tg")?"tg":"ru", ans={district:[],rooms:[],area:[],floor:[],source:[]};
const BOX='<i><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2.2 6.3l2.4 2.4 5.2-5.4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></i>';
const digits=v=>String(v||"").replace(/\D/g,"");
function fmtPhone(v){ const d=digits(v).slice(-9); return [d.slice(0,2),d.slice(2,5),d.slice(5,7),d.slice(7,9)].filter(Boolean).join(" "); }
function render(){
  document.documentElement.lang=lang==="tg"?"tg":"ru";
  $$("[data-l]").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  $$("[data-t]").forEach(el=>el.textContent=T[lang][el.dataset.t]);
  $$("[data-p]").forEach(el=>el.placeholder=T[lang][el.dataset.p]);
  $("#qs").innerHTML=T[lang].quiz.map((q,qi)=>`<div class="qblock${ans[q.k].length?" done":""}"><div class="qq"><span class="qn">${qi+1}</span><div class="q">${esc(q.q)}</div></div><div class="chips" style="--n:${q.o.length}">`+
    q.o.map((o,i)=>`<button type="button" class="chip${ans[q.k].includes(i)?" on":""}" data-k="${q.k}" data-i="${i}">${BOX}${esc(o)}</button>`).join("")+`</div></div>`).join("");
  prog();
}
function prog(){ const n=Object.values(ans).filter(a=>a.length).length; $("#pn").textContent=n+" / 5"; $("#pb").style.width=(n/5*100)+"%"; }
document.addEventListener("click",e=>{
  const l=e.target.closest("[data-l]"); if(l){ lang=l.dataset.l; render(); return; }
  const c=e.target.closest(".chip"); if(c){ const k=c.dataset.k,i=+c.dataset.i; ans[k]=ans[k].includes(i)?ans[k].filter(x=>x!==i):[...ans[k],i].sort(); render(); $("#msg").textContent=""; }
});
$("#ph").addEventListener("input",e=>{ e.target.value=fmtPhone(e.target.value); $("#phw").classList.remove("bad"); });
$("#nm").addEventListener("input",()=>$("#nm").classList.remove("bad"));
/* ссылка из Telegram: ?phone=900001122&name=Али&v=<визит>&a=0-1-x-x-02 (уже отмеченные ответы — можно дополнить) */
const QS=new URLSearchParams(location.search), VISIT=QS.get("v")||"";
(()=>{ if(QS.get("phone")) $("#ph").value=fmtPhone(QS.get("phone")); if(QS.get("name")) $("#nm").value=QS.get("name");
  const a=(QS.get("a")||"").split("-"); ["district","rooms","area","floor","source"].forEach((k,i)=>{ const c=a[i]||"x"; if(c!=="x") ans[k]=[...new Set(c.split("").map(Number).filter(n=>n>=0&&n<T.ru.quiz[i].o.length))].sort(); }); })();
const QK="sebiston_anketa_queue";
const getQ=()=>{ try{ return JSON.parse(localStorage.getItem(QK)||"[]"); }catch(e){ return []; } };
const setQ=q=>{ try{ localStorage.setItem(QK,JSON.stringify(q)); }catch(e){} };
async function post(x){ try{ const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({a:"quiz"},x))}); const j=await r.json(); return !!(j&&j.ok); }catch(e){ return false; } }
async function flush(){ const q=getQ(), rest=[]; for(const x of q){ if(!(await post(x))) rest.push(x); } setQ(rest); }
addEventListener("online",flush); setInterval(flush,30000); flush();
$("#send").addEventListener("click",async()=>{
  const name=$("#nm").value.trim(), ph=digits($("#ph").value);
  if(name.length<2){ $("#nm").classList.add("bad"); $("#msg").textContent=T[lang].e_name; return; }
  if(ph.length!==9){ $("#phw").classList.add("bad"); $("#msg").textContent=T[lang].e_phone; return; }
  if(!Object.values(ans).some(a=>a.length)){ $("#msg").textContent=T[lang].e_quiz; return; }
  const RU=T.ru.quiz, x={ id:Date.now()+"-"+Math.random().toString(36).slice(2,7), at:new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16).replace("T"," "),
    name, phone:"+992"+ph, lang:lang.toUpperCase(), v:VISIT };
  RU.forEach(q=>{ x[q.k]=ans[q.k].map(i=>q.o[i]).join(", "); });
  $("#send").disabled=true; $("#msg").textContent="";
  const ok=await post(x);
  if(!ok){ setQ([...getQ(),x]); }
  document.body.classList.add("ok"); scrollTo(0,0);
  $(".fin p").textContent = ok ? T[lang].ok_p : T[lang].e_net;
  $("#send").disabled=false;
});
$("#again").addEventListener("click",()=>{ ans={district:[],rooms:[],area:[],floor:[],source:[]}; $("#nm").value=""; $("#ph").value=""; document.body.classList.remove("ok"); render(); });
render();
</script>
